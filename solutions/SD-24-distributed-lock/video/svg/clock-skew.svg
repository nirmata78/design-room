e x1="1340.0" y1="300.0" x2="1340.0" y2="312.0" stroke="#8c959f" stroke-width="2"/><text x="1340" y="340" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#57606a">14</text><line x1="1500.0" y1="300.0" x2="1500.0" y2="312.0" stroke="#8c959f" stroke-width="2"/><text x="1500" y="340" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#57606a">16</text><line x1="220.0" y1="306.0" x2="1500.0" y2="306.0" stroke="#8c959f" stroke-width="2"/><text x="40" y="124" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#24292f">Server</text><text x="40" y="224" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#24292f">Client</text><rect x="220.0" y="100.0" width="800.0" height="40.0" rx="8" fill="#dbeafe" stroke="#2f6fb5" stroke-width="2.2"/><text x="620" y="128" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#0b2540">server: lease valid</text><line x1="1020.0" y1="80.0" x2="1020.0" y2="296.0" stroke="#c8341f" stroke-width="2.6" stroke-dasharray="8 6"/><text x="1020" y="72" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#c8341f">server expires, grants B</text><rect x="220.0" y="200.0" width="1200.0" height="40.0" rx="8" fill="#fdecea" stroke="#c8341f" stroke-width="2.2"/><text x="820.0" y="228" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#5a1308">client clock 5 s slow: believes it holds until its own 10 s</text><rect x="1020.0" y="250.0" width="400.0" height="36.0" rx="8" fill="#c8341f" stroke="#c8341f" stroke-width="2.2"/><text x="1220.0" y="276" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#ffffff">two holders</text><text x="40" y="400" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#5a1308">A timestamp from the server means nothing on a client whose clock disagrees.</text></svg>