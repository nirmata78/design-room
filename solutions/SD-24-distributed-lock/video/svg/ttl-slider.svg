<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" width="1600" height="520"><rect width="1600" height="520" fill="#ffffff"/><text x="40" y="44" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#24292f">Choosing the lease length (TTL): the same trade at every setting</text><rect x="120.0" y="150.0" width="1360.0" height="24.0" rx="12" fill="#eef1f4" stroke="#8c959f" stroke-width="2.2"/><line x1="120.0" y1="150.0" x2="120.0" y2="182.0" stroke="#8c959f" stroke-width="2"/><text x="120.0" y="212" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#57606a">1 s</text><line x1="212.2" y1="150.0" x2="212.2" y2="182.0" stroke="#8c959f" stroke-width="2"/><text x="212.20338983050846" y="212" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#57606a">5 s</text><line x1="327.5" y1="150.0" x2="327.5" y2="182.0" stroke="#8c959f" stroke-width="2"/><text x="327.45762711864404" y="212" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#57606a">10 s</text><line x1="558.0" y1="150.0" x2="558.0" y2="182.0" stroke="#8c959f" stroke-width="2"/><text x="557.9661016949153" y="212" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#57606a">20 s</text><line x1="788.5" y1="150.0" x2="788.5" y2="182.0" stroke="#8c959f" stroke-width="2"/><text x="788.4745762711865" y="212" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#57606a">30 s</text><line x1="1480.0" y1="150.0" x2="1480.0" y2="182.0" stroke="#8c959f" stroke-width="2"/><text x="1480.0" y="212" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#57606a">60 s</text><line x1="327.5" y1="100.0" x2="327.5" y2="150.0" stroke="#1f8a4c" stroke-width="4"/><text x="327.45762711864404" y="92" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#1f8a4c">default 10 s</text><line x1="442.7" y1="100.0" x2="442.7" y2="150.0" stroke="#c8341f" stroke-width="4"/><text x="456.7118644067797" y="92" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#c8341f">the 15 s pause</text><text x="120" y="270" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#2f6fb5">Short TTL</text><text x="120" y="304" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="500" fill="#24292f">a crash frees its name fast</text><text x="120" y="336" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#c8341f">a slow holder is expired while alive</text><text x="1480" y="270" text-anchor="end" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#2f6fb5">Long TTL</text><text x="1480" y="304" text-anchor="end" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#c8341f">a crash stalls its name for a long time</text><text x="1480" y="336" text-anchor="end" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="500" fill="#24292f">fewer false expiries</text><rect x="120.0" y="390.0" width="1360.0" height="80.0" rx="8" fill="#fdecea" stroke="#c8341f" stroke-width="2.2"/><text x="800.0" y="440" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="27" font-weight="800" fill="#5a1308">No setting removes the pause. A 70 s pause beats a 60 s TTL. Only a check at the resource does.</text></svg>