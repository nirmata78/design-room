<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 690" width="1600" height="690"><rect width="1600" height="690" fill="#ffffff"/><text x="40" y="44" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#24292f">Five replicas, one partition</text><rect x="60.0" y="100.0" width="420.0" height="470.0" rx="16" fill="#fdecea" stroke="#c8341f" stroke-width="2.2" stroke-dasharray="10 6"/><text x="80" y="135" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="800" fill="#c8341f">minority side · term 7</text><rect x="760.0" y="100.0" width="700.0" height="470.0" rx="16" fill="#e7f4ec" stroke="#1f8a4c" stroke-width="2.2" stroke-dasharray="10 6"/><text x="780" y="135" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="800" fill="#1f8a4c">majority side · term 8</text><circle cx="210" cy="250" r="52" fill="#ffffff" stroke="#c8341f" stroke-width="5"/><text x="210" y="259" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#24292f">R1</text><circle cx="210" cy="430" r="52" fill="#ffffff" stroke="#c8341f" stroke-width="2.4"/><text x="210" y="439" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#24292f">R2</text><circle cx="1000" cy="180" r="52" fill="#ffffff" stroke="#1f8a4c" stroke-width="5"/><text x="1000" y="189" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#24292f">R3</text><circle cx="1250" cy="330" r="52" fill="#ffffff" stroke="#1f8a4c" stroke-width="2.4"/><text x="1250" y="339" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#24292f">R4</text><circle cx="1000" cy="480" r="52" fill="#ffffff" stroke="#1f8a4c" stroke-width="2.4"/><text x="1000" y="489" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#24292f">R5</text><text x="210" y="330" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#c8341f">old leader</text><text x="1000" y="260" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1f8a4c">new leader</text><text x="610" y="345" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#c8341f">cut</text><line x1="560.0" y1="120.0" x2="660.0" y2="560.0" stroke="#c8341f" stroke-width="5" stroke-dasharray="8 6"/><text x="40" y="640" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#5a1308">R1 sees 2 of 5: it cannot commit, so it cannot grant. R3 sees 3 of 5: it can.</text></svg>