<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" width="1600" height="500"><rect width="1600" height="500" fill="#ffffff"/><text x="40" y="44" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#24292f">One name, 100 ms holds: how much can it grant?</text><text x="40" y="150" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#24292f">Capacity</text><rect x="330.0" y="120.0" width="244.4" height="50.0" rx="8" fill="#d3f3e6" stroke="#1f8a4c" stroke-width="2.2"/><text x="588.4444444444445" y="155" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#173d24">10 grants/s  (1 ÷ 0.1 s)</text><text x="40" y="250" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#24292f">Arriving</text><rect x="330.0" y="220.0" width="977.8" height="50.0" rx="8" fill="#fdecea" stroke="#c8341f" stroke-width="2.2"/><text x="1321.7777777777778" y="255" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#c8341f">40 attempts/s</text><rect x="574.4" y="290.0" width="733.3" height="40.0" rx="8" fill="#c8341f" stroke="#c8341f" stroke-width="2.2"/><text x="941.1111111111111" y="319" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#fff">30 a second too many</text><text x="40" y="420" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#5a1308">Unbounded queue: +30 waiters a second, so after 10 s a new waiter is 300 deep and waits about 30 s,</text><text x="40" y="456" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#5a1308">which is longer than its own lease. Polling adds 600 reads a second on this one name.</text></svg>