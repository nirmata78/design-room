<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" width="1600" height="520"><rect width="1600" height="520" fill="#ffffff"/><text x="40" y="44" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#24292f">One token: 64 bits, compared as a number</text><rect x="60.0" y="110.0" width="370.0" height="90.0" rx="8" fill="#e6dcfb" stroke="#6b4fc4" stroke-width="2.2"/><text x="245.0" y="168" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#2a1d66">epoch · 16 bits</text><rect x="430.0" y="110.0" width="1110.0" height="90.0" rx="8" fill="#d3f3e6" stroke="#1f8a4c" stroke-width="2.2"/><text x="985.0" y="168" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#0d3b2a">log index within the group · 48 bits</text><text x="60" y="250" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="500" fill="#24292f">epoch changes only on a rebuild or a slot move; the index grows with every committed entry.</text><text x="60" y="300" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="500" fill="#57606a">48 bits is 2.8 × 10^14 entries. At 15,000 a second that is about 600 years per epoch.</text><text x="60" y="350" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="500" fill="#57606a">16 bits is 65,536 rebuilds. Both limits are labelled arithmetic, not measurements.</text><rect x="60.0" y="400.0" width="1480.0" height="80.0" rx="8" fill="#fdf3e1" stroke="#d18f1c" stroke-width="2.2"/><text x="80" y="452" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#4a3207">Timestamps are not tokens (clocks go backwards). Random IDs are not tokens (no order).</text></svg>