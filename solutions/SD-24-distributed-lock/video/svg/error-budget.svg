<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" width="1600" height="400"><rect width="1600" height="400" fill="#ffffff"/><text x="40" y="44" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#24292f">Error budget at 99.99 % for a 30-day month</text><rect x="60.0" y="110.0" width="1480.0" height="70.0" rx="8" fill="#e7f4ec" stroke="#1f8a4c" stroke-width="2.2"/><text x="800.0" y="156" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#173d24">259 seconds of unavailability allowed (4.3 minutes)</text><text x="60" y="250" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="500" fill="#24292f">Each election costs about 2 s for one group.</text><text x="60" y="300" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#5a1308">259 s ÷ 2 s ≈ 130 elections a group a month spend all of it, if nothing else fails.</text><text x="60" y="350" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#24292f">So &#x27;elections per group per day&#x27; is an SLI, and under 1 is the target.</text></svg>