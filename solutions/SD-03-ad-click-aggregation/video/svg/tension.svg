<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 490" width="1600" height="490"><rect width="1600" height="490" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#5f6368"/></marker></defs><text x="40" y="50" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="28" font-weight="800" fill="#202124">One hour&#x27;s number, three times: each later one is slower, more exact, and the one that counts</text><rect x="60.0" y="110.0" width="470.0" height="250.0" rx="14" fill="#e8f0fe" stroke="#4285f4" stroke-width="2.2"/><text x="84" y="160" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="30" font-weight="800" fill="#1967D2">+10 s</text><text x="84" y="205" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="26" font-weight="800" fill="#202124">Live</text><text x="84" y="258" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="34" font-weight="800" fill="#202124">1,319,402</text><text x="84" y="300" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="21" font-weight="500" fill="#202124">provisional: duplicates within 10 min</text><text x="84" y="328" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="21" font-weight="500" fill="#202124">removed; late events still coming</text><path d="M540,235 l22,0" stroke="#5f6368" stroke-width="3" marker-end="url(#ar)"/><rect x="570.0" y="110.0" width="470.0" height="250.0" rx="14" fill="#e6f4ea" stroke="#34a853" stroke-width="2.2"/><text x="594" y="160" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="30" font-weight="800" fill="#188038">+48 h</text><text x="594" y="205" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="26" font-weight="800" fill="#202124">Final, version 1</text><text x="594" y="258" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="34" font-weight="800" fill="#202124">1,318,977</text><text x="594" y="300" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="21" font-weight="500" fill="#202124">exact: every duplicate removed, late</text><text x="594" y="328" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="21" font-weight="500" fill="#202124">events in; invoiced</text><path d="M1050,235 l22,0" stroke="#5f6368" stroke-width="3" marker-end="url(#ar)"/><rect x="1080.0" y="110.0" width="470.0" height="250.0" rx="14" fill="#fef7e0" stroke="#fbbc05" stroke-width="2.2"/><text x="1104" y="160" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="30" font-weight="800" fill="#B06000">+9 days</text><text x="1104" y="205" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="26" font-weight="800" fill="#202124">Version 2</text><text x="1104" y="258" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="34" font-weight="800" fill="#202124">1,291,045</text><text x="1104" y="300" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="21" font-weight="500" fill="#202124">fraud invalidated 2 %: an adjustment</text><text x="1104" y="328" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="21" font-weight="500" fill="#202124">line, never an edit</text><line x1="60" y1="420" x2="1540" y2="420" stroke="#4285f4" stroke-width="4"/><text x="60" y="462" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="24" font-weight="800" fill="#1967D2">← faster, cheaper, provisional</text><text x="1540" y="462" text-anchor="end" font-family="Inter, Roboto, sans-serif" font-size="24" font-weight="800" fill="#188038">exact, auditable, billed →</text></svg>