<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" width="1600" height="400"><rect width="1600" height="400" fill="#ffffff"/><text x="40" y="50" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="28" font-weight="800" fill="#202124">Two products from one stream: the latest position, and every position ever</text><rect x="60.0" y="110.0" width="470.0" height="250.0" rx="14" fill="#e8f0fe" stroke="#4285f4" stroke-width="2.2"/><text x="84" y="160" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="27" font-weight="800" fill="#202124">The live map</text><text x="84" y="205" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="22" font-weight="500" fill="#202124">where is each vehicle now?</text><text x="84" y="235" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="22" font-weight="500" fill="#202124">overwrite, in memory, by cell</text><text x="84" y="330" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="22" font-weight="800" fill="#1967D2">2 s fresh; loss is fine</text><rect x="570.0" y="110.0" width="470.0" height="250.0" rx="14" fill="#e6f4ea" stroke="#34a853" stroke-width="2.2"/><text x="594" y="160" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="27" font-weight="800" fill="#202124">The history</text><text x="594" y="205" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="22" font-weight="500" fill="#202124">where was it, every 2 s, for two</text><text x="594" y="235" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="22" font-weight="500" fill="#202124">years? append, columnar</text><text x="594" y="330" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="22" font-weight="800" fill="#188038">complete; minutes late is fine</text><rect x="1080.0" y="110.0" width="470.0" height="250.0" rx="14" fill="#fce8e6" stroke="#ea4335" stroke-width="2.2"/><text x="1104" y="160" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="27" font-weight="800" fill="#202124">One table for both</text><text x="1104" y="205" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="22" font-weight="500" fill="#202124">a database row per position</text><text x="1104" y="330" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="22" font-weight="800" fill="#C5221F">slow for one, wrong for the other</text></svg>