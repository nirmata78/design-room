<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 490" width="1600" height="490"><rect width="1600" height="490" fill="#ffffff"/><text x="40" y="50" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="28" font-weight="800" fill="#202124">1,000 requests a minute, 500 servers: three ways for each server to know</text><rect x="60.0" y="100.0" width="470.0" height="270.0" rx="14" fill="#fce8e6" stroke="#ea4335" stroke-width="2.2"/><text x="84" y="150" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="30" font-weight="800" fill="#C5221F">Exact</text><text x="84" y="196" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="26" font-weight="800" fill="#202124">One central counter</text><text x="84" y="250" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="32" font-weight="800" fill="#202124">+1.2 ms at p99</text><text x="84" y="296" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="22" font-weight="500" fill="#202124">every request waits on the store;</text><text x="84" y="326" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="22" font-weight="500" fill="#202124">when it is down, so is the API</text><rect x="570.0" y="100.0" width="470.0" height="270.0" rx="14" fill="#fef7e0" stroke="#fbbc05" stroke-width="2.2"/><text x="594" y="150" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="30" font-weight="800" fill="#B06000">Split</text><text x="594" y="196" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="26" font-weight="800" fill="#202124">The limit ÷ 500</text><text x="594" y="250" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="32" font-weight="800" fill="#202124">2 per server per minute</text><text x="594" y="296" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="22" font-weight="500" fill="#202124">traffic on 3 servers: throttled at</text><text x="594" y="326" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="22" font-weight="500" fill="#202124">0.6 % of the quota</text><rect x="1080.0" y="100.0" width="470.0" height="270.0" rx="14" fill="#e6f4ea" stroke="#34a853" stroke-width="2.2"/><text x="1104" y="150" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="30" font-weight="800" fill="#188038">Leased</text><text x="1104" y="196" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="26" font-weight="800" fill="#202124">Leases that follow demand</text><text x="1104" y="250" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="32" font-weight="800" fill="#202124">≤ 5 % over · 2 µs</text><text x="1104" y="296" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="22" font-weight="500" fill="#202124">decided in memory; survives its own</text><text x="1104" y="326" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="22" font-weight="500" fill="#202124">dependencies</text><line x1="60" y1="420" x2="1540" y2="420" stroke="#4285f4" stroke-width="4"/><text x="60" y="462" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="24" font-weight="800" fill="#C5221F">← exact, slow, a dependency</text><text x="1540" y="462" text-anchor="end" font-family="Inter, Roboto, sans-serif" font-size="24" font-weight="800" fill="#188038">bounded, fast, never the outage →</text></svg>