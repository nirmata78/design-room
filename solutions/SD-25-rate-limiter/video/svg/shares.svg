<svg xmlns="http://www.w3.org/2000/svg" class="c4" viewBox="0 0 1600 560" width="1600" height="560"><defs><marker id="c4a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#5b6672"/></marker><marker id="c4a-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M10,1 L0,5 L10,9 z" fill="#5b6672"/></marker></defs><rect width="1600" height="560" fill="#ffffff"/><rect x="40" y="70" width="480" height="240" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="280.0" y="165.265" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18.4" fill="#e3eefa">[1,000 ÷ 500 servers]</text><text x="280.0" y="193.61499999999998" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#ffffff">Static split</text><text x="280.0" y="231.47499999999997" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21.1" fill="#ffffff" fill-opacity="0.93">2 per server per minute: useless</text><rect x="560" y="70" width="480" height="240" rx="9" fill="#c8341f" stroke="#9d2817" stroke-width="1.6"/><text x="800.0" y="165.265" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18.4" fill="#fde3de">[recomputed every 100 ms]</text><text x="800.0" y="193.61499999999998" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#ffffff">Demand-weighted</text><text x="800.0" y="231.47499999999997" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21.1" fill="#ffffff" fill-opacity="0.93">the busy server gets the budget</text><rect x="1080" y="70" width="480" height="240" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="1320.0" y="165.265" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18.4" fill="#e3eefa">[one interval of demand shift]</text><text x="1320.0" y="193.61499999999998" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#ffffff">Error bound</text><text x="1320.0" y="231.47499999999997" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21.1" fill="#ffffff" fill-opacity="0.93">a few tokens; 1–2% for the heaviest</text><rect x="40" y="370" width="1520" height="45.3" rx="6" fill="#e8f0fa" stroke="#2f6fb5" stroke-width="1.4"/><text x="52" y="401.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" fill="#3b2a07">Uneven load balancing stops mattering: shares follow traffic, not node count.</text></svg>