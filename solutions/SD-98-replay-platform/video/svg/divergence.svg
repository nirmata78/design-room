<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" width="1600" height="500"><rect width="1600" height="500" fill="#ffffff"/><text x="40" y="48" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="27" font-weight="800" fill="#202124">Open-loop replay: once the new planner acts differently, the log stops being what would have happened</text><line x1="120" y1="300" x2="1500" y2="300" stroke="#5f6368" stroke-width="2"/><text x="120" y="336" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="20" font-weight="600" fill="#5f6368">t = 0 s</text><text x="1500" y="336" text-anchor="end" font-family="Inter, Roboto, sans-serif" font-size="20" font-weight="600" fill="#5f6368">12 s</text><path d="M120,240 L1500,240" stroke="#5f6368" stroke-width="5" fill="none" stroke-dasharray="12 8"/><text x="120" y="222" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="22" font-weight="700" fill="#5f6368">logged ego: brakes at 7.0 s</text><path d="M120,240 L700,240 C 800,240 850,160 950,150 L1500,150" stroke="#4285f4" stroke-width="5" fill="none"/><text x="960" y="132" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="22" font-weight="800" fill="#1967d2">new planner: brakes at 5.4 s</text><line x1="830" y1="90" x2="830" y2="310" stroke="#ea4335" stroke-width="3" stroke-dasharray="8 6"/><text x="818" y="120" text-anchor="end" font-family="Inter, Roboto, sans-serif" font-size="22" font-weight="800" fill="#c5221f">divergence &gt; 1 m at 6.2 s</text><rect x="120.0" y="360.0" width="650.0" height="110.0" rx="10" fill="#fce8e6" stroke="#ea4335" stroke-width="2.2"/><text x="140" y="400" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="22" font-weight="700" fill="#202124">Logged follower keeps its speed:</text><text x="140" y="435" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="22" font-weight="700" fill="#c5221f">a “collision” that the real follower would avoid</text><rect x="850.0" y="360.0" width="650.0" height="110.0" rx="10" fill="#e6f4ea" stroke="#34a853" stroke-width="2.2"/><text x="870" y="400" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="22" font-weight="700" fill="#202124">Score only up to the divergence, or</text><text x="870" y="435" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="22" font-weight="700" fill="#188038">replace the follower with a reactive agent</text></svg>