<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 490" width="1600" height="490"><rect width="1600" height="490" fill="#ffffff"/><text x="40" y="50" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="28" font-weight="800" fill="#202124">Recompute for trust, or reuse for speed: content keys give both, if every input is in the key</text><rect x="60.0" y="110.0" width="470.0" height="260.0" rx="14" fill="#e8f0fe" stroke="#4285f4" stroke-width="2.2"/><text x="84" y="160" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="27" font-weight="800" fill="#202124">Recompute everything</text><text x="84" y="205" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="22" font-weight="500" fill="#202124">trustworthy, but 1,040 GPUs for a</text><text x="84" y="233.6" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="22" font-weight="500" fill="#202124">4-hour gate</text><text x="84" y="340" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="23" font-weight="800" fill="#1967D2">≈ $8,300 a gate</text><rect x="570.0" y="110.0" width="470.0" height="260.0" rx="14" fill="#fce8e6" stroke="#ea4335" stroke-width="2.2"/><text x="594" y="160" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="27" font-weight="800" fill="#202124">Reuse by name</text><text x="594" y="205" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="22" font-weight="500" fill="#202124">build 412&#x27;s output reused for build</text><text x="594" y="233.6" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="22" font-weight="500" fill="#202124">413</text><text x="594" y="340" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="23" font-weight="800" fill="#C5221F">cheap, and silently stale</text><rect x="1080.0" y="110.0" width="470.0" height="260.0" rx="14" fill="#e6f4ea" stroke="#34a853" stroke-width="2.2"/><text x="1104" y="160" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="27" font-weight="800" fill="#202124">Reuse by content</text><text x="1104" y="205" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="22" font-weight="500" fill="#202124">key = hash of code, inputs, seed: a</text><text x="1104" y="233.6" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="22" font-weight="500" fill="#202124">hit equals a recompute</text><text x="1104" y="340" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="23" font-weight="800" fill="#188038">≈ 300 GPUs; trustworthy if hermetic</text><line x1="60" y1="420" x2="1540" y2="420" stroke="#4285f4" stroke-width="4"/><text x="60" y="462" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="24" font-weight="800" fill="#1967D2">← cost</text><text x="1540" y="462" text-anchor="end" font-family="Inter, Roboto, sans-serif" font-size="24" font-weight="800" fill="#188038">trust →</text></svg>