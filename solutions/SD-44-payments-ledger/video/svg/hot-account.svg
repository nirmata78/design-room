ext><text x="1320.0" y="180.385" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#ffffff">Where checked</text><text x="1320.0" y="218.245" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21.1" fill="#ffffff" fill-opacity="0.93">N sub-accounts summed, or one worker per</text><text x="1320.0" y="244.705" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21.1" fill="#ffffff" fill-opacity="0.93">merchant</text><rect x="40" y="370" width="1520" height="45.3" rx="6" fill="#e8f0fa" stroke="#2f6fb5" stroke-width="1.4"/><text x="52" y="401.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" fill="#3b2a07">A balance row updated 5,000 times a second serialises on its lock. Auditors want entries anyway.</text></svg>