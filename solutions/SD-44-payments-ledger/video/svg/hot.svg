<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" width="1600" height="560"><rect width="1600" height="560" fill="#ffffff"/><text x="40" y="50" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="28" font-weight="800" fill="#202124">One balance row against one merchant&#x27;s payment rate</text><g data-k="h0"><text x="40" y="136" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="24" font-weight="700" fill="#202124">Arriving payments</text><rect x="480.0" y="100.0" width="481.8" height="54.0" rx="10" fill="#fce8e6" stroke="#ea4335" stroke-width="2.2"/><text x="949.8181818181818" y="137" text-anchor="end" font-family="Inter, Roboto, sans-serif" font-size="24" font-weight="800" fill="#C5221F">5,000 / s</text></g><g data-k="h1"><text x="40" y="221" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="24" font-weight="700" fill="#202124">One row lock, ~1.5 ms each</text><rect x="480.0" y="185.0" width="64.6" height="54.0" rx="10" fill="#fef7e0" stroke="#fbbc05" stroke-width="2.2"/><text x="558.5636363636363" y="222" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="24" font-weight="800" fill="#B06000">≈ 670 / s</text></g><g data-k="h2"><text x="40" y="306" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="24" font-weight="700" fill="#202124">Append only: no shared row</text><rect x="480.0" y="270.0" width="481.8" height="54.0" rx="10" fill="#e6f4ea" stroke="#34a853" stroke-width="2.2"/><text x="949.8181818181818" y="307" text-anchor="end" font-family="Inter, Roboto, sans-serif" font-size="24" font-weight="800" fill="#188038">5,000 / s and more</text></g><g data-k="h3"><text x="40" y="391" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="24" font-weight="700" fill="#202124">16 sub-accounts × 670</text><rect x="480.0" y="355.0" width="1031.1" height="54.0" rx="10" fill="#e8f0fe" stroke="#4285f4" stroke-width="2.2"/><text x="1499.090909090909" y="392" text-anchor="end" font-family="Inter, Roboto, sans-serif" font-size="24" font-weight="800" fill="#1967D2">≈ 10,700 / s</text></g><g data-k="h4"><text x="40" y="490" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="24" font-weight="700" fill="#202124">On the shared row the queue grows by 4,330 a second: p99 passes 2 s within a second.</text><text x="40" y="530" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="22" font-weight="600" fill="#5f6368">Illustrative lock time, to be measured. The fix takes the shared row off the hot path.</text></g></svg>