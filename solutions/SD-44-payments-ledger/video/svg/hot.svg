<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 550" width="1600" height="550"><rect width="1600" height="550" fill="#ffffff"/><text x="40" y="44" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#24292f">One balance row against one merchant&#x27;s payment rate</text><text x="40" y="134" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#24292f">Arriving payments</text><rect x="420.0" y="100.0" width="490.9" height="52.0" rx="8" fill="#fdecea" stroke="#c8341f" stroke-width="2.2"/><text x="898.9090909090909" y="135" text-anchor="end" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#c8341f">5,000 / s</text><text x="40" y="219" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#24292f">One row lock, ~1.5 ms each</text><rect x="420.0" y="185.0" width="65.8" height="52.0" rx="8" fill="#fdf3e1" stroke="#d18f1c" stroke-width="2.2"/><text x="499.78181818181815" y="220" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#d18f1c">≈ 670 / s</text><text x="40" y="304" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#24292f">Append only (no shared row)</text><rect x="420.0" y="270.0" width="490.9" height="52.0" rx="8" fill="#e7f4ec" stroke="#1f8a4c" stroke-width="2.2"/><text x="898.9090909090909" y="305" text-anchor="end" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#1f8a4c">5,000 / s and more</text><text x="40" y="389" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#24292f">16 sub-accounts × 670</text><rect x="420.0" y="355.0" width="1050.5" height="52.0" rx="8" fill="#dbeafe" stroke="#2f6fb5" stroke-width="2.2"/><text x="1458.5454545454545" y="390" text-anchor="end" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#2f6fb5">≈ 10,700 / s capacity</text><text x="40" y="470" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#5a1308">The queue grows by 4,330 a second on the shared row; within a second the merchant&#x27;s p99 passes 2 s.</text><text x="40" y="510" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#57606a">Illustrative lock time, to be measured. The fix removes the shared row from the hot path.</text></svg>