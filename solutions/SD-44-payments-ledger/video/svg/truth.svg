<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 460" width="1600" height="460"><rect width="1600" height="460" fill="#ffffff"/><text x="40" y="44" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#24292f">The truth arrives over months; the client wants an answer in two seconds</text><line x1="120.0" y1="200.0" x2="1500.0" y2="200.0" stroke="#8c959f" stroke-width="4"/><circle cx="170" cy="200" r="16" fill="#2f6fb5"/><text x="170" y="150" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#2f6fb5">2 s</text><text x="170" y="260" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="800" fill="#24292f">the response</text><text x="170" y="296" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#57606a">approved, declined, or pending</text><circle cx="540" cy="200" r="16" fill="#6b4fc4"/><text x="540" y="150" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#6b4fc4">minutes</text><text x="540" y="260" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="800" fill="#24292f">the inquiry</text><text x="540" y="296" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#57606a">UNKNOWN becomes final</text><circle cx="910" cy="200" r="16" fill="#d18f1c"/><text x="910" y="150" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#d18f1c">next day</text><text x="910" y="260" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="800" fill="#24292f">the settlement file</text><text x="910" y="296" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#57606a">the processor&#x27;s books</text><circle cx="1280" cy="200" r="16" fill="#c8341f"/><text x="1280" y="150" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#c8341f">up to months</text><text x="1280" y="260" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="800" fill="#24292f">the chargeback window</text><text x="1280" y="296" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#57606a">a dispute can still arrive</text><text x="800" y="380" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#24292f">Each mechanism lives at one point: idempotency and UNKNOWN at the response, the inquiry at minutes,</text><text x="800" y="418" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#24292f">reconciliation at the file, adjusting entries at the chargeback. None of them replaces another.</text></svg>