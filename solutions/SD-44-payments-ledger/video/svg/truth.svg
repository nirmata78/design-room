<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 440" width="1600" height="440"><rect width="1600" height="440" fill="#ffffff"/><text x="40" y="50" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="28" font-weight="800" fill="#202124">The truth arrives over months; the client wants an answer in two seconds</text><line x1="120" y1="210" x2="1500" y2="210" stroke="#5f6368" stroke-width="4"/><g data-k="t0"><circle cx="170" cy="210" r="16" fill="#4285f4"/><text x="170" y="160" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="30" font-weight="800" fill="#1967D2">2 s</text><text x="170" y="270" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="25" font-weight="800" fill="#202124">the response</text><text x="170" y="306" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="21" font-weight="600" fill="#5f6368">approved, declined, or pending</text></g><g data-k="t1"><circle cx="540" cy="210" r="16" fill="#4285f4"/><text x="540" y="160" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="30" font-weight="800" fill="#1967D2">minutes</text><text x="540" y="270" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="25" font-weight="800" fill="#202124">the inquiry</text><text x="540" y="306" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="21" font-weight="600" fill="#5f6368">UNKNOWN becomes final</text></g><g data-k="t2"><circle cx="910" cy="210" r="16" fill="#fbbc05"/><text x="910" y="160" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="30" font-weight="800" fill="#B06000">next day</text><text x="910" y="270" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="25" font-weight="800" fill="#202124">the settlement file</text><text x="910" y="306" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="21" font-weight="600" fill="#5f6368">the processor&#x27;s books</text></g><g data-k="t3"><circle cx="1280" cy="210" r="16" fill="#ea4335"/><text x="1280" y="160" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="30" font-weight="800" fill="#C5221F">up to months</text><text x="1280" y="270" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="25" font-weight="800" fill="#202124">the chargeback window</text><text x="1280" y="306" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="21" font-weight="600" fill="#5f6368">a dispute can still arrive</text></g><g data-k="t4"><text x="800" y="400" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="25" font-weight="700" fill="#202124">Each mechanism lives at one point; none replaces another.</text></g></svg>