<text x="34" y="586.2" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21.0" fill="#1f2328">Money is numeric(12,2), never a float. psp_idem_key is what the PSP deduplicates on, so a retried authorisation is never a second charge. The</text>
<text x="34" y="614.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21.0" fill="#1f2328">ticket&#x27;s UNIQUE (event_id, seat_id) is the last line against oversell, independent of our code.</text>
