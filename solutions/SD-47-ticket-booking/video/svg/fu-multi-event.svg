<svg xmlns="http://www.w3.org/2000/svg" class="c4" viewBox="0 0 1600 560" width="1600" height="560"><defs><marker id="c4a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#5b6672"/></marker><marker id="c4a-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M10,1 L0,5 L10,9 z" fill="#5b6672"/></marker></defs><rect width="1600" height="560" fill="#ffffff"/><rect x="40" y="70" width="350" height="250" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="215.0" y="160.92000000000002" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16.3" fill="#e3eefa">[everything]</text><text x="215.0" y="186.12" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">Keyed by event_id</text><text x="215.0" y="220.44" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18.7" fill="#ffffff" fill-opacity="0.93">Redis slot, DB partition, Kafka</text><text x="215.0" y="243.96" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18.7" fill="#ffffff" fill-opacity="0.93">key, JWT evt, CDN key</text><rect x="430" y="70" width="350" height="250" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="605.0" y="160.92000000000002" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16.3" fill="#e3eefa">[across nodes]</text><text x="605.0" y="186.12" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">Spread</text><text x="605.0" y="220.44" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18.7" fill="#ffffff" fill-opacity="0.93">hash tags place each event&#x27;s</text><text x="605.0" y="243.96" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18.7" fill="#ffffff" fill-opacity="0.93">keys on its own Redis node</text><rect x="820" y="70" width="350" height="250" rx="9" fill="#c8341f" stroke="#9d2817" stroke-width="1.6"/><text x="995.0" y="160.92000000000002" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16.3" fill="#fde3de">[the PSP, the CDN]</text><text x="995.0" y="186.12" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">Shared limits</text><text x="995.0" y="220.44" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18.7" fill="#ffffff" fill-opacity="0.93">a global admission budget split</text><text x="995.0" y="243.96" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18.7" fill="#ffffff" fill-opacity="0.93">across events</text><rect x="1210" y="70" width="350" height="250" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="1385.0" y="160.92000000000002" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16.3" fill="#e3eefa">[its own primary]</text><text x="1385.0" y="186.12" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">Hot event</text><text x="1385.0" y="220.44" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18.7" fill="#ffffff" fill-opacity="0.93">a big on-sale gets a dedicated</text><text x="1385.0" y="243.96" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18.7" fill="#ffffff" fill-opacity="0.93">PostgreSQL partition host</text><rect x="40" y="380" width="1520" height="72.6" rx="6" fill="#e8f0fa" stroke="#2f6fb5" stroke-width="1.4"/><text x="52" y="411.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" fill="#3b2a07">Many events are an isolation problem, not a coordination problem. The only shared resources are the PSP pool and edge capacity, so</text><text x="52" y="438.3" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" fill="#3b2a07">those get explicit budgets.</text></svg>