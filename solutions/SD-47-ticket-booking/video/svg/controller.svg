<svg xmlns="http://www.w3.org/2000/svg" class="c4" viewBox="0 0 1600 620" width="1600" height="620"><defs><marker id="c4a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#5b6672"/></marker><marker id="c4a-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M10,1 L0,5 L10,9 z" fill="#5b6672"/></marker></defs><rect width="1600" height="620" fill="#ffffff"/><path d="M380.0,170.0 L460.0,170.0" fill="none" stroke="#5b6672" stroke-width="1.9" marker-end="url(#c4a)"/><path d="M800.0,170.0 L880.0,170.0" fill="none" stroke="#5b6672" stroke-width="1.9" marker-end="url(#c4a)"/><path d="M1220.0,170.0 L1300.0,170.0" fill="none" stroke="#5b6672" stroke-width="1.9" marker-end="url(#c4a)"/><path d="M1430.0,270.0 L1430.0,330.0 L210.0,330.0 L210.0,270.0" fill="none" stroke="#5b6672" stroke-width="1.9" marker-end="url(#c4a)"/><text x="820.0" y="330.0" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17.0" fill="#24292f" font-style="normal" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">next tick</text><rect x="40" y="70" width="340" height="200" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="210.0" y="139.805" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14.3" fill="#e3eefa">[every 1 s]</text><text x="210.0" y="161.855" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff">Read signals</text><text x="210.0" y="192.635" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16.4" fill="#ffffff" fill-opacity="0.93">shoppers, hold p99, DB CPU, PSP</text><text x="210.0" y="213.21499999999997" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16.4" fill="#ffffff" fill-opacity="0.93">errors, 409 ratio</text><rect x="460" y="70" width="340" height="200" rx="9" fill="#c8341f" stroke="#9d2817" stroke-width="1.6"/><text x="630.0" y="150.095" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14.3" fill="#fde3de">[AIMD]</text><text x="630.0" y="172.14499999999998" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff">Healthy?</text><text x="630.0" y="202.92499999999998" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16.4" fill="#ffffff" fill-opacity="0.93">yes: R += step · no: R × 0.7</text><rect x="880" y="70" width="340" height="200" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="1050.0" y="150.095" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14.3" fill="#e3eefa">[advance.lua]</text><text x="1050.0" y="172.14499999999998" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff">Advance pointer</text><text x="1050.0" y="202.92499999999998" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16.4" fill="#ffffff" fill-opacity="0.93">min(cur + R/60, next)</text><rect x="1300" y="70" width="260" height="200" rx="9" fill="#8c8c8c" stroke="#6b6b6b" stroke-width="1.6"/><text x="1430.0" y="150.095" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14.3" fill="#ececec">[CDN state]</text><text x="1430.0" y="172.14499999999998" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff">Publish</text><text x="1430.0" y="202.92499999999998" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16.4" fill="#ffffff" fill-opacity="0.93">rate, flags</text><rect x="40" y="400" width="760" height="67.4" rx="6" fill="#fdf3e1" stroke="#a86a12" stroke-width="1.4"/><text x="52" y="429.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" fill="#3b2a07">Thresholds: hold p99 &gt; 300 ms, DB CPU &gt; 70%, PSP errors &gt; 5% → cut. Below</text><text x="52" y="453.7" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" fill="#3b2a07">10,000 shoppers → ramp.</text><rect x="840" y="400" width="720" height="67.4" rx="6" fill="#fdecea" stroke="#c8341f" stroke-width="1.4"/><text x="852" y="429.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" fill="#3b2a07">One leader per event (Redis lease, renewed every second). Two</text><text x="852" y="453.7" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" fill="#3b2a07">controllers would admit double.</text></svg>