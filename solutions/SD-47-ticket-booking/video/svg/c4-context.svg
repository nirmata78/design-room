<svg xmlns="http://www.w3.org/2000/svg" class="c4" viewBox="0 0 1600 800" width="1600" height="800"><defs><marker id="c4a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#5b6672"/></marker><marker id="c4a-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M10,1 L0,5 L10,9 z" fill="#5b6672"/></marker></defs><rect width="1600" height="800" fill="#ffffff"/><path d="M360.0,145.0 L640.0,135.0" fill="none" stroke="#5b6672" stroke-width="1.9" stroke-dasharray="8 5" marker-end="url(#c4a)"/><text x="500.0" y="114.8" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17.0" fill="#24292f" font-style="normal" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">Join, poll, shop</text><text x="500.0" y="135.2" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14.6" fill="#6e7781" font-style="italic" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">[HTTPS]</text><path d="M810.0,210.0 L810.0,330.0" fill="none" stroke="#5b6672" stroke-width="1.9" stroke-dasharray="8 5" marker-end="url(#c4a)"/><text x="810.0" y="270.0" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17.0" fill="#24292f" font-style="normal" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">~200 req/s, not 100,000</text><path d="M360.0,635.0 L620.0,487.5" fill="none" stroke="#5b6672" stroke-width="1.9" stroke-dasharray="8 5" marker-end="url(#c4a)"/><text x="495.0" y="579.8" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17.0" fill="#24292f" font-style="normal" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">Schedule, fairness,</text><text x="495.0" y="600.2" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17.0" fill="#24292f" font-style="normal" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">seats</text><path d="M1000.0,382.5 L1240.0,325.0" fill="none" stroke="#5b6672" stroke-width="1.9" stroke-dasharray="8 5" marker-end="url(#c4a)" marker-start="url(#c4a-s)"/><text x="1120.0" y="309.6" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17.0" fill="#24292f" font-style="normal" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">Authorize, capture,</text><text x="1120.0" y="330.0" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17.0" fill="#24292f" font-style="normal" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">query</text><text x="1120.0" y="350.4" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14.6" fill="#6e7781" font-style="italic" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">[API]</text><path d="M1000.0,498.0 L1240.0,590.0" fill="none" stroke="#5b6672" stroke-width="1.9" stroke-dasharray="8 5" marker-end="url(#c4a)"/><text x="1120.0" y="560.0" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17.0" fill="#24292f" font-style="normal" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">Send tickets</text><rect x="40" y="70" width="320" height="150" rx="9" fill="#08427b" stroke="#052e56" stroke-width="1.6"/><circle cx="200.0" cy="56" r="15" fill="#08427b" stroke="#052e56" stroke-width="1.6"/><text x="200.0" y="114.805" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14.3" fill="#cfe0f3">[Person]</text><text x="200.0" y="136.855" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff">Fans · 1,000,000</text><text x="200.0" y="167.635" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16.4" fill="#ffffff" fill-opacity="0.93">Arrive in the same minute for</text><text x="200.0" y="188.21499999999997" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16.4" fill="#ffffff" fill-opacity="0.93">50,000 seats.</text><rect x="40" y="560" width="320" height="150" rx="9" fill="#08427b" stroke="#052e56" stroke-width="1.6"/><circle cx="200.0" cy="546" r="15" fill="#08427b" stroke="#052e56" stroke-width="1.6"/><text x="200.0" y="604.8050000000001" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14.3" fill="#cfe0f3">[Person]</text><text x="200.0" y="626.8550000000001" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff">Promoter and ops</text><text x="200.0" y="657.6350000000001" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16.4" fill="#ffffff" fill-opacity="0.93">Set the on-sale, the fairness</text><text x="200.0" y="678.2150000000001" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16.4" fill="#ffffff" fill-opacity="0.93">policy, add inventory.</text><rect x="640" y="60" width="340" height="150" rx="9" fill="#8c8c8c" stroke="#6b6b6b" stroke-width="1.6"/><text x="810.0" y="104.805" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14.3" fill="#ececec">[External System]</text><text x="810.0" y="126.855" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff">CDN and WAF</text><text x="810.0" y="157.635" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16.4" fill="#ffffff" fill-opacity="0.93">Absorbs the million: static app,</text><text x="810.0" y="178.21499999999997" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16.4" fill="#ffffff" fill-opacity="0.93">cached queue state, bot challenge.</text><rect x="620" y="330" width="380" height="210" rx="9" fill="#c8341f" stroke="#9d2817" stroke-width="1.6"/><text x="810.0" y="404.805" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14.3" fill="#fde3de">[Software System]</text><text x="810.0" y="426.855" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff">Ticket booking system</text><text x="810.0" y="457.635" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16.4" fill="#ffffff" fill-opacity="0.93">Meters fans in, sells each seat exactly</text><text x="810.0" y="478.215" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16.4" fill="#ffffff" fill-opacity="0.93">once, tells the rest early.</text><rect x="1240" y="250" width="320" height="150" rx="9" fill="#8c8c8c" stroke="#6b6b6b" stroke-width="1.6"/><text x="1400.0" y="305.095" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14.3" fill="#ececec">[External System]</text><text x="1400.0" y="327.14500000000004" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff">Payment provider</text><text x="1400.0" y="357.925" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16.4" fill="#ffffff" fill-opacity="0.93">2–10 s, sometimes silent.</text><rect x="1240" y="520" width="320" height="140" rx="9" fill="#8c8c8c" stroke="#6b6b6b" stroke-width="1.6"/><text x="1400.0" y="570.095" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14.3" fill="#ececec">[External System]</text><text x="1400.0" y="592.1450000000001" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff">Email and push</text><text x="1400.0" y="622.9250000000001" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16.4" fill="#ffffff" fill-opacity="0.93">Tickets, waitlist offers</text><rect x="40" y="770" width="18" height="18" rx="4" fill="#08427b" stroke="#052e56"/><text x="66" y="784" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#57606a">Person</text><rect x="122" y="770" width="18" height="18" rx="4" fill="#c8341f" stroke="#9d2817"/><text x="148" y="784" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#57606a">In focus</text><rect x="220" y="770" width="18" height="18" rx="4" fill="#8c8c8c" stroke="#6b6b6b"/><text x="246" y="784" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#57606a">External system</text></svg>