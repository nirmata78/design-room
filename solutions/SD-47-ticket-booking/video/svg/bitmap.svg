<text x="60" y="270" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" fill="#57606a">bit i = seat_id i (dense 0…49,999) · 1 = free · 0 = held, pending or sold · LSB-first per byte (Java BitSet.toByteArray)</text>
<rect x="40" y="310" width="740" height="42.8" rx="6" fill="#e8f0fa" stroke="#2f6fb5" stroke-width="1.2"/>
<text x="54" y="333.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.0" fill="#1f2328">Size: 50,000 seats ÷ 8 = 6,250 bytes; gzip ~1–3 KB when mostly sold.</text>
<rect x="820" y="310" width="740" height="68.4" rx="6" fill="#e8f0fa" stroke="#2f6fb5" stroke-width="1.2"/>
<text x="834" y="333.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.0" fill="#1f2328">Version = the Kafka offset of the last applied seat event: only grows,</text>
<text x="834" y="359.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.0" fill="#1f2328">survives restarts.</text>
<rect x="40" y="420" width="740" height="68.4" rx="6" fill="#e7f4ec" stroke="#2d8a4e" stroke-width="1.2"/>
<text x="54" y="443.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.0" fill="#1f2328">Unchanged since v? → 304 Not Modified, no body: 5,000 req/s × ~200 B ≈ 1</text>
<text x="54" y="469.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.0" fill="#1f2328">MB/s instead of ~31 MB/s.</text>
<rect x="820" y="420" width="740" height="68.4" rx="6" fill="#e7f4ec" stroke="#2d8a4e" stroke-width="1.2"/>
<text x="834" y="443.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.0" fill="#1f2328">Layout (positions, sections, prices) is separate: immutable, versioned</text>
<text x="834" y="469.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.0" fill="#1f2328">URL, CDN-cached for a year.</text>
<rect x="40" y="540" width="1520" height="68.4" rx="6" fill="#fdecea" stroke="#c8341f" stroke-width="1.2"/>
<text x="54" y="563.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.0" fill="#1f2328">A stale bit is a hint, not a promise: the hold in PostgreSQL decides. A stale click gets 409 with this same structure as the body, so the next click</text>
<text x="54" y="589.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.0" fill="#1f2328">lands on a free seat.</text>
