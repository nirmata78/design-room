th="1.6"/><text x="790.0" y="481.875" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="17.0" fill="#fce8e6">[PostgreSQL]</text><text x="790.0" y="508.125" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="25" font-weight="700" fill="#ffffff">50–500 holds/s</text><text x="790.0" y="543.625" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="19.5" fill="#ffffff" fill-opacity="0.93">33/s × 1.5 attempts; × 10 bursts</text></g><g data-k="n:f6"><rect x="1080" y="390" width="460" height="230" rx="9" fill="#8ab4f8" stroke="#4285f4" stroke-width="1.6"/><text x="1310.0" y="469.625" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="17.0" fill="#202124">[to the PSP]</text><text x="1310.0" y="495.875" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="25" font-weight="700" fill="#202124">~25 payments/s</text><text x="1310.0" y="531.375" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="19.5" fill="#202124" fill-opacity="0.93">20,000 orders ÷ ~900 s; × 10 s = 250 in</text><text x="1310.0" y="555.875" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="19.5" fill="#202124" fill-opacity="0.93">flight</text></g><g data-k="note:0"><rect x="40" y="680" width="1520" height="44.0" rx="6" fill="#e7f4ec" stroke="#2d8a4e" stroke-width="1.4"/><text x="52" y="710.0" font-family="Inter, Roboto, sans-serif" font-size="20" fill="#3b2a07">Each layer shrinks the number below it. After the queue, the write path is a few hundred transactions a second: not a big-data problem.</text></g></svg>