-serif" font-size="25" font-weight="700" fill="#ffffff">~200 req/s</text><text x="790.0" y="213.625" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.5" fill="#ffffff" fill-opacity="0.93">~200 edges ÷ 1 s TTL (shield: ~1/s)</text><rect x="1080" y="60" width="460" height="230" rx="9" fill="#c8341f" stroke="#9d2817" stroke-width="1.6"/><text x="1310.0" y="139.625" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17.0" fill="#fde3de">[into the shop]</text><text x="1310.0" y="165.875" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#ffffff">33 admits/s</text><text x="1310.0" y="201.375" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.5" fill="#ffffff" fill-opacity="0.93">10,000 shoppers ÷ 300 s each (Little&#x27;s</text><text x="1310.0" y="225.875" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.5" fill="#ffffff" fill-opacity="0.93">law)</text><rect x="40" y="390" width="460" height="230" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="270.0" y="469.625" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17.0" fill="#e3eefa">[seat map, Redis]</text><text x="270.0" y="495.875" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#ffffff">5,000 reads/s</text><text x="270.0" y="531.375" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.5" fill="#ffffff" fill-opacity="0.93">10,000 shoppers ÷ 2 s poll; 304 if</text><text x="270.0" y="555.875" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.5" fill="#ffffff" fill-opacity="0.93">unchanged</text><rect x="560" y="390" width="460" height="230" rx="9" fill="#c8341f" stroke="#9d2817" stroke-width="1.6"/><text x="790.0" y="481.875" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17.0" fill="#fde3de">[PostgreSQL]</text><text x="790.0" y="508.125" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#ffffff">50–500 holds/s</text><text x="790.0" y="543.625" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.5" fill="#ffffff" fill-opacity="0.93">33/s × 1.5 attempts; × 10 bursts</text><rect x="1080" y="390" width="460" height="230" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="1310.0" y="469.625" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17.0" fill="#e3eefa">[to the PSP]</text><text x="1310.0" y="495.875" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#ffffff">~25 payments/s</text><text x="1310.0" y="531.375" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.5" fill="#ffffff" fill-opacity="0.93">20,000 orders ÷ ~900 s; × 10 s = 250 in</text><text x="1310.0" y="555.875" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.5" fill="#ffffff" fill-opacity="0.93">flight</text><rect x="40" y="680" width="1520" height="44.0" rx="6" fill="#e7f4ec" stroke="#2d8a4e" stroke-width="1.4"/><text x="52" y="710.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" fill="#3b2a07">Each layer shrinks the number below it. After the queue, the write path is a few hundred transactions a second: not a big-data problem.</text></svg>