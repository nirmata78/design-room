a, Arial, sans-serif" font-size="25" font-weight="700" fill="#ffffff">Queue absorbs it</text><text x="484.0" y="216.375" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.5" fill="#ffffff" fill-opacity="0.93">controller cuts R to the</text><text x="484.0" y="240.875" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.5" fill="#ffffff" fill-opacity="0.93">floor; the line pauses</text><rect x="658" y="80" width="280" height="220" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="798.0" y="142.375" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17.0" fill="#e3eefa">[~30 s]</text><text x="798.0" y="168.625" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#ffffff">Failover</text><text x="798.0" y="204.125" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.5" fill="#ffffff" fill-opacity="0.93">synchronous replica</text><text x="798.0" y="228.625" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.5" fill="#ffffff" fill-opacity="0.93">promoted; nothing</text><text x="798.0" y="253.125" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.5" fill="#ffffff" fill-opacity="0.93">acknowledged is lost</text><rect x="972" y="80" width="280" height="220" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="1112.0" y="142.375" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17.0" fill="#e3eefa">[1–5 min]</text><text x="1112.0" y="168.625" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#ffffff">Slow restart</text><text x="1112.0" y="204.125" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.5" fill="#ffffff" fill-opacity="0.93">R ramps again from slow</text><text x="1112.0" y="228.625" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.5" fill="#ffffff" fill-opacity="0.93">start; shoppers retry</text><text x="1112.0" y="253.125" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.5" fill="#ffffff" fill-opacity="0.93">with jitter</text><rect x="1286" y="80" width="280" height="220" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="1426.0" y="142.375" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17.0" fill="#e3eefa">[same day]</text><text x="1426.0" y="168.625" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#ffffff">Verify</text><text x="1426.0" y="204.125" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.5" fill="#ffffff" fill-opacity="0.93">invariant monitor clean;</text><text x="1426.0" y="228.625" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.5" fill="#ffffff" fill-opacity="0.93">PAYMENT_PENDING ages</text><text x="1426.0" y="253.125" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.5" fill="#ffffff" fill-opacity="0.93">normal</text><rect x="30" y="360" width="1540" height="67.4" rx="6" fill="#fdf3e1" stroke="#a86a12" stroke-width="1.4"/><text x="42" y="389.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" fill="#3b2a07">Comms: a status line on the waiting page (&#x27;the line has paused&#x27;), the promoter told within minutes, support given the script. Nobody is told &#x27;sold</text><text x="42" y="413.7" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" fill="#3b2a07">out&#x27; because of our outage.</text><rect x="30" y="470" width="1540" height="42.7" rx="6" fill="#e7f4ec" stroke="#2d8a4e" stroke-width="1.4"/><text x="42" y="499.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" fill="#3b2a07">Week after: blameless review; game day before the next big sale — kill the primary, stop the sweeper, slow the PSP, kill the controller&#x27;s leader.</text></svg>