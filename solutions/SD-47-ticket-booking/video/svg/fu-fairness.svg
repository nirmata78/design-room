<svg xmlns="http://www.w3.org/2000/svg" class="c4" viewBox="0 0 1600 540" width="1600" height="540"><defs><marker id="c4a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#5b6672"/></marker><marker id="c4a-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M10,1 L0,5 L10,9 z" fill="#5b6672"/></marker></defs><rect width="1600" height="540" fill="#ffffff"/><text x="40" y="40" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#8c959f">THREE OPTIONS, WITH THEIR CONSEQUENCES — THE PROMOTER DECIDES</text><rect x="40" y="70" width="480" height="220" rx="9" fill="#8c8c8c" stroke="#6b6b6b" stroke-width="1.6"/><text x="280.0" y="142.035" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18.4" fill="#ececec">[Option A]</text><text x="280.0" y="170.385" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#ffffff">Strict FIFO at T0</text><text x="280.0" y="208.245" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21.1" fill="#ffffff" fill-opacity="0.93">Rewards the lowest latency and the best</text><text x="280.0" y="234.705" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21.1" fill="#ffffff" fill-opacity="0.93">bots. Looks fair, isn&#x27;t.</text><rect x="560" y="70" width="480" height="220" rx="9" fill="#c8341f" stroke="#9d2817" stroke-width="1.6"/><text x="800.0" y="142.035" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18.4" fill="#fde3de">[Option B · recommended]</text><text x="800.0" y="170.385" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#ffffff">Lottery among the lobby</text><text x="800.0" y="208.245" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21.1" fill="#ffffff" fill-opacity="0.93">Everyone present at T0 has the same</text><text x="800.0" y="234.705" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21.1" fill="#ffffff" fill-opacity="0.93">chance. Then FIFO for late arrivals.</text><rect x="1080" y="70" width="480" height="220" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="1320.0" y="142.035" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18.4" fill="#e3eefa">[Option C · flagship events]</text><text x="1320.0" y="170.385" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#ffffff">Verified pre-registration</text><text x="1320.0" y="208.245" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21.1" fill="#ffffff" fill-opacity="0.93">Fans screened days ahead. Slower, the</text><text x="1320.0" y="234.705" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21.1" fill="#ffffff" fill-opacity="0.93">strongest against bots.</text><rect x="40" y="330" width="1520" height="67.4" rx="6" fill="#fdf3e1" stroke="#a86a12" stroke-width="1.4"/><text x="52" y="359.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" fill="#3b2a07">What I bring: the data from the last on-sale (bot share, latency spread), the rules written in plain words, and how each fan learns their position</text><text x="52" y="383.7" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" fill="#3b2a07">early. What I don&#x27;t do: decide fairness alone.</text><rect x="40" y="440" width="1520" height="42.7" rx="6" fill="#e7f4ec" stroke="#2d8a4e" stroke-width="1.4"/><text x="52" y="469.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" fill="#3b2a07">Then: publish the rules before the sale, measure complaints and bot cancellations after, and revisit with the promoter.</text></svg>