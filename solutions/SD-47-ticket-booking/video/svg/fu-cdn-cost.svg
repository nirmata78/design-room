ica, Arial, sans-serif" font-size="20.3" fill="#ffffff" fill-opacity="0.93">a release polling every 1 s?</text><rect x="820" y="70" width="340" height="160" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="990.0" y="128.28" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff">By bot score</text><text x="990.0" y="164.96" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20.3" fill="#ffffff" fill-opacity="0.93">headless clients polling flat</text><text x="990.0" y="190.44" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20.3" fill="#ffffff" fill-opacity="0.93">out</text><rect x="1210" y="70" width="340" height="160" rx="9" fill="#c8341f" stroke="#9d2817" stroke-width="1.6"/><text x="1380.0" y="128.28" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff">Cause</text><text x="1380.0" y="164.96" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20.3" fill="#ffffff" fill-opacity="0.93">polling rate × size ×</text><text x="1380.0" y="190.44" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20.3" fill="#ffffff" fill-opacity="0.93">audience</text><rect x="40" y="290" width="740" height="67.4" rx="6" fill="#fdecea" stroke="#c8341f" stroke-width="1.4"/><text x="52" y="319.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" fill="#3b2a07">Contain: block flagged bots at the WAF, raise the poll interval</text><text x="52" y="343.7" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" fill="#3b2a07">server-side (it travels in the state JSON), roll back the client.</text><rect x="820" y="290" width="740" height="92.10000000000001" rx="6" fill="#e7f4ec" stroke="#2d8a4e" stroke-width="1.4"/><text x="832" y="319.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" 