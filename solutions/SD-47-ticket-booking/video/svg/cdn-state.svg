<svg xmlns="http://www.w3.org/2000/svg" class="c4" viewBox="0 0 1600 720" width="1600" height="720"><defs><marker id="c4a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#5b6672"/></marker><marker id="c4a-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M10,1 L0,5 L10,9 z" fill="#5b6672"/></marker></defs><rect width="1600" height="720" fill="#ffffff"/><path d="M340.0,155.0 L460.0,155.0" fill="none" stroke="#5b6672" stroke-width="1.9" stroke-dasharray="8 5" marker-end="url(#c4a)"/><text x="400.0" y="130.0" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17.0" fill="#24292f" font-style="normal" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">100 k/s</text><path d="M780.0,155.0 L900.0,155.0" fill="none" stroke="#5b6672" stroke-width="1.9" stroke-dasharray="8 5" marker-end="url(#c4a)"/><text x="840.0" y="130.0" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17.0" fill="#24292f" font-style="normal" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">~200/s</text><path d="M1200.0,155.0 L1320.0,155.0" fill="none" stroke="#5b6672" stroke-width="1.9" stroke-dasharray="8 5" marker-end="url(#c4a)"/><text x="1260.0" y="130.0" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17.0" fill="#24292f" font-style="normal" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">~1/s</text><rect x="40" y="70" width="300" height="170" rx="9" fill="#08427b" stroke="#052e56" stroke-width="1.6"/><circle cx="190.0" cy="56" r="15" fill="#08427b" stroke="#052e56" stroke-width="1.6"/><text x="190.0" y="135.095" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14.3" fill="#cfe0f3">[poll every 3–30 s]</text><text x="190.0" y="157.14499999999998" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff">1,000,000 fans</text><text x="190.0" y="187.92499999999998" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16.4" fill="#ffffff" fill-opacity="0.93">seq is in their signed token</text><rect x="460" y="70" width="320" height="170" rx="9" fill="#8c8c8c" stroke="#6b6b6b" stroke-width="1.6"/><text x="620.0" y="135.095" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14.3" fill="#ececec">[max-age=1]</text><text x="620.0" y="157.14499999999998" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff">~200 CDN edges</text><text x="620.0" y="187.92499999999998" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16.4" fill="#ffffff" fill-opacity="0.93">collapse concurrent misses</text><rect x="900" y="70" width="300" height="170" rx="9" fill="#8c8c8c" stroke="#6b6b6b" stroke-width="1.6"/><text x="1050.0" y="148.385" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14.3" fill="#ececec">[one fetch per second]</text><text x="1050.0" y="170.43499999999997" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff">Origin shield</text><rect x="1320" y="70" width="240" height="170" rx="9" fill="#c8341f" stroke="#9d2817" stroke-width="1.6"/><text x="1440.0" y="135.095" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14.3" fill="#fde3de">[reads Redis]</text><text x="1440.0" y="157.14499999999998" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff">Waiting room</text><text x="1440.0" y="187.92499999999998" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16.4" fill="#ffffff" fill-opacity="0.93">4 keys, one GET each</text><rect x="40" y="300" width="1520" height="42.7" rx="6" fill="#e8f0fa" stroke="#2f6fb5" stroke-width="1.4"/><text x="52" y="329.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" fill="#3b2a07">HTTP/1.1 200 · Content-Type: application/json · Cache-Control: public, max-age=1, stale-while-revalidate=2, stale-if-error=30 · ~90 bytes</text><rect x="40" y="390" width="1000" height="72.6" rx="6" fill="#f6f8fa" stroke="#1f2328" stroke-width="1.4"/><text x="52" y="421.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" fill="#3b2a07">{&quot;admittedUpTo&quot;: 31800, &quot;ratePerMin&quot;: 2000, &quot;admissionPaused&quot;: false, &quot;soldOut&quot;: false,</text><text x="52" y="448.3" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" fill="#3b2a07">&quot;serverTime&quot;: 1792131002}</text><rect x="1080" y="390" width="480" height="92.10000000000001" rx="6" fill="#e7f4ec" stroke="#2d8a4e" stroke-width="1.4"/><text x="1092" y="419.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" fill="#3b2a07">No user in the body: one cached object serves</text><text x="1092" y="443.7" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" fill="#3b2a07">everyone. The client computes ahead = mySeq −</text><text x="1092" y="468.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" fill="#3b2a07">admittedUpTo.</text><rect x="40" y="560" width="1520" height="42.7" rx="6" fill="#fdf3e1" stroke="#a86a12" stroke-width="1.4"/><text x="52" y="589.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" fill="#3b2a07">ETA = ahead ÷ ratePerMin. Fan 380,577 at pointer 31,800: 348,777 ÷ 2,000 ≈ 174 min, past the ~15 min sell-out, so we say &#x27;likely sold out&#x27; early.</text></svg>