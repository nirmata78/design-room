<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="353px" preserveAspectRatio="none" style="width:495px;height:353px;background:#FFFFFF;" version="1.1" viewBox="0 0 495 353" width="495px" zoomAndPan="magnify"><?plantuml 1.2026.5?><defs/><g><!--entity A--><g class="entity" data-qualified-name="A" data-source-line="6" id="ent0001"><rect fill="#EAF1FB" height="44" rx="5" ry="5" style="stroke:#4A6FA5;stroke-width:0.5;" width="152.0996" x="40.34" y="13"/><text fill="#000000" font-family="'Helvetica'" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="81.3926" x="50.34" y="32.2402">1,000,000 fans</text><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="132.0996" x="50.34" y="44.2402">in the lobby or the queue</text></g><!--entity B--><g class="entity" data-qualified-name="B" data-source-line="7" id="ent0002"><rect fill="#DCE8F7" height="44" rx="5" ry="5" style="stroke:#4A6FA5;stroke-width:0.5;" width="218.7793" x="7" y="149"/><text fill="#000000" font-family="'Helvetica'" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="97.0488" x="17" y="168.2402">~29,000 admitted</text><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="39.3633" x="117.3828" y="168.2402">to shop</text><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="198.7793" x="17" y="180.2402">R = 2,000 per minute for ~15 minutes</text></g><!--entity D--><g class="entity" data-qualified-name="D" data-source-line="8" id="ent0003"><rect fill="#DFF1E4" height="60" rx="5" ry="5" style="stroke:#4A6FA5;stroke-width:0.5;" width="173.875" x="29.45" y="279"/><text fill="#000000" font-family="'Helvetica'" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="145.7344" x="39.45" y="298.2402">~20,000 orders confirmed</text><text fill="#000000" font-family="'Helvetica'" font-size="16" font-weight="700" lengthAdjust="spacing" textLength="153.875" x="39.45" y="313.3203">all 50,000 seats sold</text><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="114.041" x="39.45" y="326.2402">(2.5 tickets per order)</text></g><!--entity X--><g class="entity" data-qualified-name="X" data-source-line="9" id="ent0004"><rect fill="#FBE6E4" height="56" rx="5" ry="5" style="stroke:#4A6FA5;stroke-width:0.5;" width="202.0918" x="227.34" y="7"/><text fill="#000000" font-family="'Helvetica'" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="139.0781" x="237.34" y="26.2402">~970,000 never admitted</text><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="19.3477" x="237.34" y="38.2402">told</text><text fill="#000000" font-family="'Helvetica'" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="42.0293" x="260.0216" y="38.2402">sold out</text><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="100.7344" x="305.3849" y="38.2402">by the cached flag,</text><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="182.0918" x="237.34" y="50.2402">within seconds, offered the waitlist</text></g><!--entity Y--><g class="entity" data-qualified-name="Y" data-source-line="10" id="ent0005"><rect fill="#FFF3D1" height="68" rx="5" ry="5" style="stroke:#4A6FA5;stroke-width:0.5;" width="220.8008" x="260.99" y="137"/><text fill="#000000" font-family="'Helvetica'" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="145.7109" x="270.99" y="156.2402">~9,000 admitted, no order</text><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="200.8008" x="270.99" y="168.2402">token ran out, card declined, gave up.</text><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="179.4375" x="270.99" y="180.2402">Their held seats return to the pool</text><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="179.4492" x="270.99" y="192.2402">and the next fans in line buy them</text></g><!--link A to B--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="11" id="lnk6"><path d="M116.39,57.23 C116.39,82.32 116.39,118.82 116.39,143.87" fill="none" id="A-to-B" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="116.39,148.87,120.39,139.87,116.39,143.87,112.39,139.87,116.39,148.87" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="103.377" x="117.39" y="103.2402">admission at rate R</text></g><!--link B to D--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="12" id="lnk7"><path d="M116.39,193.25 C116.39,216.19 116.39,247.87 116.39,273.57" fill="none" id="B-to-D" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="116.39,278.57,120.39,269.57,116.39,273.57,112.39,269.57,116.39,278.57" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="100.0664" x="117.39" y="245.2402">about 70% convert</text></g><!--link A to X--><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" data-link-type="dependency" data-source-line="13" id="lnk8"><path d="M192.58,35 C204.07,35 210.57,35 222.06,35" fill="none" id="A-to-X" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="227.06,35,218.06,31,222.06,35,218.06,39,227.06,35" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link B to Y--><g class="link" data-entity-1="ent0002" data-entity-2="ent0005" data-link-type="dependency" data-source-line="14" id="lnk9"><path d="M225.96,171 C237.51,171 244.06,171 255.61,171" fill="none" id="B-to-Y" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="260.61,171,251.61,167,255.61,171,251.61,175,260.61,171" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><?plantuml-src RP9FRzim3CNl-HH4WW4RaBPsrZJha1fm_XWxxP3jq0A-o3OT2v4fJvAJROT-zb7oMcHT3Zx8V7hlHrBs8AaJHhHGOIrwvJ9Dxgje4SPVK1tHoLACH_QIwflyZH3Fpegs4PK-ITf3BPJ5iuh1qWdQAzpfdggrDeG6ukYIOgLDXMQjbJOmkKtlidG-UYt2U5aayJIA8lzn3DdbJP7a90bSWw1qKVm2lkaFFthiSGp2GWgJRPh5sUgDq_FiFlY8gfNEOUMzm6bkH7SvxU01Pg7UCMqhgNS8DPi_n_E_HnliLp3PhBUViiL_zWDcwCX2gQcMfXrYSde0eHJC1ub5uInOhQgSti-kvy23Fo3_yj7X_eSGjU6eB8ktjs-ZxXU34U6HRvmtb9DZMrZAnDk3xjtoHYR0S_93AaNPO0Mr4ljfJYVf6XwbHMQjx1HqNQFXibUUX7HAMXSu7c6IhRPt5pZ-6UWKI0_uBoG79322FCQKmqt5JwfKahnsBuu8VNUTq_S6fO46cNUOZ47N6_AxyIYTrYedGGCOuKyNdW8mkhU2eW_DjG7rYL6pxECc7gLmnU-JhXBUsEV0QAtK1C8n4kzsDrgzAZPUKJ0bBA9tVdKyLkSTZDmtZWMFNlnoUFe3?></g></svg>