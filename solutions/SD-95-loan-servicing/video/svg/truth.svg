<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 450" width="1600" height="450"><rect width="1600" height="450" fill="#ffffff"/><text x="40" y="44" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#24292f">When is a collection final? Later than the dashboard thinks</text><line x1="80.0" y1="200.0" x2="1520.0" y2="200.0" stroke="#8c959f" stroke-width="4"/><circle cx="130" cy="200" r="15" fill="#2f6fb5"/><text x="130" y="150" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="27" font-weight="800" fill="#2f6fb5">seconds</text><text x="130" y="258" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="800" fill="#24292f">card answer</text><text x="130" y="292" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#57606a">or nothing at all</text><circle cx="390" cy="200" r="15" fill="#1f8a4c"/><text x="390" y="150" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="27" font-weight="800" fill="#1f8a4c">1–2 days</text><text x="390" y="258" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="800" fill="#24292f">debit settles</text><text x="390" y="292" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#57606a">SETTLED, not final</text><circle cx="650" cy="200" r="15" fill="#d18f1c"/><text x="650" y="150" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="27" font-weight="800" fill="#d18f1c">2 bank days</text><text x="650" y="258" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="800" fill="#24292f">NSF return</text><text x="650" y="292" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#57606a">insufficient funds</text><circle cx="910" cy="200" r="15" fill="#c8341f"/><text x="910" y="150" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="27" font-weight="800" fill="#c8341f">60 days</text><text x="910" y="258" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="800" fill="#24292f">unauthorised return</text><text x="910" y="292" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#57606a">customer disputes it</text><circle cx="1170" cy="200" r="15" fill="#6b4fc4"/><text x="1170" y="150" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="27" font-weight="800" fill="#6b4fc4">months</text><text x="1170" y="258" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="800" fill="#24292f">refunds, disputes</text><text x="1170" y="292" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#57606a">merchant or card</text><circle cx="1430" cy="200" r="15" fill="#8c959f"/><text x="1430" y="150" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="27" font-weight="800" fill="#8c959f">7 years</text><text x="1430" y="258" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="800" fill="#24292f">audit</text><text x="1430" y="292" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#57606a">every cent explained</text><text x="800" y="370" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#24292f">Each point has its own mechanism: UNKNOWN and the resolver, PENDING to SETTLED, RETURNED with a reversal,</text><text x="800" y="406" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#24292f">schedule versions for refunds, and three-way reconciliation every day. None replaces another.</text></svg>