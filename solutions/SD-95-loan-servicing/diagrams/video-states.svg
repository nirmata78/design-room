<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 660" width="1600" height="660"><rect width="1600" height="660" fill="#ffffff"/><text x="40" y="44" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#24292f">A collection is a state machine. SETTLED is not the end for a bank debit</text><rect x="40.0" y="140.0" width="240.0" height="90.0" rx="12" fill="#dbeafe" stroke="#2f6fb5" stroke-width="2.6"/><text x="160.0" y="190" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="800" fill="#24292f">SCHEDULED</text><rect x="360.0" y="140.0" width="240.0" height="90.0" rx="12" fill="#dbeafe" stroke="#2f6fb5" stroke-width="2.6"/><text x="480.0" y="190" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="800" fill="#24292f">SUBMITTED</text><rect x="680.0" y="140.0" width="240.0" height="90.0" rx="12" fill="#fdf3e1" stroke="#d18f1c" stroke-width="2.6"/><text x="800.0" y="190" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="800" fill="#24292f">PENDING</text><rect x="1000.0" y="140.0" width="240.0" height="90.0" rx="12" fill="#e7f4ec" stroke="#1f8a4c" stroke-width="2.6"/><text x="1120.0" y="190" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="800" fill="#24292f">SETTLED</text><rect x="1320.0" y="140.0" width="240.0" height="90.0" rx="12" fill="#fdecea" stroke="#c8341f" stroke-width="2.6"/><text x="1440.0" y="190" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="800" fill="#24292f">RETURNED</text><rect x="360.0" y="380.0" width="240.0" height="90.0" rx="12" fill="#fdecea" stroke="#c8341f" stroke-width="2.6"/><text x="480.0" y="430" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="800" fill="#24292f">UNKNOWN</text><rect x="680.0" y="380.0" width="240.0" height="90.0" rx="12" fill="#eef1f4" stroke="#8c959f" stroke-width="2.6"/><text x="800.0" y="430" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="800" fill="#24292f">DECLINED</text><rect x="1320.0" y="380.0" width="240.0" height="90.0" rx="12" fill="#fdf3e1" stroke="#d18f1c" stroke-width="2.6"/><text x="1440.0" y="430" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="800" fill="#24292f">RETRY DUE</text><line x1="280.0" y1="185.0" x2="344.0" y2="185.0" stroke="#24292f" stroke-width="2.6"/><polygon points="360,185.0 344.0,177.0 344.0,193.0" fill="#24292f"/><text x="320.0" y="171.0" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#24292f">claimed</text><line x1="600.0" y1="185.0" x2="664.0" y2="185.0" stroke="#24292f" stroke-width="2.6"/><polygon points="680,185.0 664.0,177.0 664.0,193.0" fill="#24292f"/><text x="640.0" y="171.0" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#24292f">sent</text><line x1="920.0" y1="185.0" x2="984.0" y2="185.0" stroke="#1f8a4c" stroke-width="2.6"/><polygon points="1000,185.0 984.0,177.0 984.0,193.0" fill="#1f8a4c"/><text x="960.0" y="171.0" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f8a4c">1–2 days</text><line x1="1240.0" y1="185.0" x2="1304.0" y2="185.0" stroke="#c8341f" stroke-width="2.6" stroke-dasharray="8 6"/><polygon points="1320,185.0 1304.0,177.0 1304.0,193.0" fill="#c8341f"/><text x="1280.0" y="171.0" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#c8341f">≤ 60 days</text><line x1="480.0" y1="230.0" x2="480.0" y2="364.0" stroke="#c8341f" stroke-width="2.6"/><polygon points="480.0,380 488.0,364.0 472.0,364.0" fill="#c8341f"/><text x="494.0" y="305.0" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#c8341f">timeout</text><line x1="800.0" y1="230.0" x2="800.0" y2="364.0" stroke="#8c959f" stroke-width="2.6"/><polygon points="800.0,380 808.0,364.0 792.0,364.0" fill="#8c959f"/><text x="814.0" y="305.0" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#8c959f">declined</text><line x1="1440.0" y1="230.0" x2="1440.0" y2="364.0" stroke="#d18f1c" stroke-width="2.6"/><polygon points="1440.0,380 1448.0,364.0 1432.0,364.0" fill="#d18f1c"/><text x="1454.0" y="305.0" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#d18f1c">NSF, ≤ 2 more</text><line x1="600.0" y1="425.0" x2="721.1" y2="243.3" stroke="#2f6fb5" stroke-width="2.6" stroke-dasharray="8 6"/><polygon points="730.0,230 714.5,238.9 727.8,247.8" fill="#2f6fb5"/><text x="360" y="515.0" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#2f6fb5">from UNKNOWN: query by the same key, never resend</text><text x="40" y="580" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#5a1308">A return posts a reversing transaction dated the day it arrives. An unauthorised return is never retried.</text><text x="40" y="620" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#57606a">A card charge settles in seconds; a card dispute arrives months later as its own reversal.</text></svg>