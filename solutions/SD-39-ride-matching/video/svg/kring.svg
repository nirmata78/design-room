rs</text><text x="960" y="260" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="24" font-weight="800" fill="#5f6368">Ring 2: 12 more: 19 cells ≈ 14 km²</text><text x="960" y="340" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="22" font-weight="600" fill="#202124">Each cell ID is a 64-bit integer:</text><text x="960" y="375" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="22" font-weight="600" fill="#202124">the query is 19 map lookups,</text><text x="960" y="410" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="22" font-weight="600" fill="#202124">not a distance over every driver.</text></svg>