<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 530" width="1600" height="530"><rect width="1600" height="530" fill="#ffffff"/><text x="40" y="44" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="28" font-weight="800" fill="#202124">Every region answers its own redirects and creates in its own slice of the ID space</text><rect x="60.0" y="100.0" width="460.0" height="330.0" rx="16" fill="#f8f9fa" stroke="#5f6368" stroke-width="2.2" stroke-dasharray="10 6"/><text x="290" y="140" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="25" font-weight="800" fill="#202124">Europe</text><rect x="90.0" y="170.0" width="400.0" height="70.0" rx="8" fill="#d2e3fc" stroke="#1967d2" stroke-width="2.2"/><text x="290" y="214" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="22" font-weight="700" fill="#202124">redirect servers + caches</text><rect x="90.0" y="260.0" width="400.0" height="70.0" rx="8" fill="#e6f4ea" stroke="#34a853" stroke-width="2.2"/><text x="290" y="304" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="22" font-weight="700" fill="#202124">link store replica</text><rect x="90.0" y="350.0" width="400.0" height="60.0" rx="8" fill="#e8f0fe" stroke="#4285f4" stroke-width="2.2"/><text x="290" y="388" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="21" font-weight="700" fill="#202124">IDs 0 – 1.1 × 10¹²</text><rect x="570.0" y="100.0" width="460.0" height="330.0" rx="16" fill="#fce8e6" stroke="#ea4335" stroke-width="2.2" stroke-dasharray="10 6"/><text x="800" y="140" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="25" font-weight="800" fill="#C5221F">Americas  (primary lost)</text><rect x="600.0" y="170.0" width="400.0" height="70.0" rx="8" fill="#d2e3fc" stroke="#1967d2" stroke-width="2.2"/><text x="800" y="214" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="22" font-weight="700" fill="#202124">redirect servers + caches</text><rect x="600.0" y="260.0" width="400.0" height="70.0" rx="8" fill="#e6f4ea" stroke="#34a853" stroke-width="2.2"/><text x="800" y="304" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="22" font-weight="700" fill="#202124">link store replica</text><rect x="600.0" y="350.0" width="400.0" height="60.0" rx="8" fill="#e8f0fe" stroke="#4285f4" stroke-width="2.2"/><text x="800" y="388" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="21" font-weight="700" fill="#202124">IDs 1.1 – 2.3 × 10¹²</text><rect x="1080.0" y="100.0" width="460.0" height="330.0" rx="16" fill="#f8f9fa" stroke="#5f6368" stroke-width="2.2" stroke-dasharray="10 6"/><text x="1310" y="140" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="25" font-weight="800" fill="#202124">Asia</text><rect x="1110.0" y="170.0" width="400.0" height="70.0" rx="8" fill="#d2e3fc" stroke="#1967d2" stroke-width="2.2"/><text x="1310" y="214" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="22" font-weight="700" fill="#202124">redirect servers + caches</text><rect x="1110.0" y="260.0" width="400.0" height="70.0" rx="8" fill="#e6f4ea" stroke="#34a853" stroke-width="2.2"/><text x="1310" y="304" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="22" font-weight="700" fill="#202124">link store replica</text><rect x="1110.0" y="350.0" width="400.0" height="60.0" rx="8" fill="#e8f0fe" stroke="#4285f4" stroke-width="2.2"/><text x="1310" y="388" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="21" font-weight="700" fill="#202124">IDs 2.3 – 3.5 × 10¹²</text><text x="40" y="490" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="22" font-weight="700" fill="#202124">Redirects never cross regions. A brand-new code clicked elsewhere before it replicates costs one cross-region lookup, not an error.</text></svg>