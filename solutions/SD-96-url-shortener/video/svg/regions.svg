<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 530" width="1600" height="530"><rect width="1600" height="530" fill="#ffffff"/><text x="40" y="44" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#24292f">Every region answers its own redirects and creates in its own slice of the ID space</text><rect x="60.0" y="100.0" width="460.0" height="330.0" rx="16" fill="#f6f8fa" stroke="#8c959f" stroke-width="2.2" stroke-dasharray="10 6"/><text x="290" y="140" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="800" fill="#24292f">Europe</text><rect x="90.0" y="170.0" width="400.0" height="70.0" rx="8" fill="#e6dcfb" stroke="#6b4fc4" stroke-width="2.2"/><text x="290" y="214" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#24292f">redirect servers + caches</text><rect x="90.0" y="260.0" width="400.0" height="70.0" rx="8" fill="#d3f3e6" stroke="#1f8a4c" stroke-width="2.2"/><text x="290" y="304" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#24292f">link store replica</text><rect x="90.0" y="350.0" width="400.0" height="60.0" rx="8" fill="#dbeafe" stroke="#2f6fb5" stroke-width="2.2"/><text x="290" y="388" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#0b2540">IDs 0 – 1.1 × 10¹²</text><rect x="570.0" y="100.0" width="460.0" height="330.0" rx="16" fill="#fdecea" stroke="#c8341f" stroke-width="2.2" stroke-dasharray="10 6"/><text x="800" y="140" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="800" fill="#c8341f">Americas  (primary lost)</text><rect x="600.0" y="170.0" width="400.0" height="70.0" rx="8" fill="#e6dcfb" stroke="#6b4fc4" stroke-width="2.2"/><text x="800" y="214" text-anchor="middle" font-family="Inter, Helvetica, Aria