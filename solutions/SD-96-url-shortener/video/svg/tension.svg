<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 510" width="1600" height="510"><rect width="1600" height="510" fill="#ffffff"/><text x="40" y="44" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="28" font-weight="800" fill="#202124">Speed of the answer against control over it: every layer closer to the user</text><rect x="60.0" y="110.0" width="345.0" height="120.0" rx="12" fill="#fce8e6" stroke="#ea4335" stroke-width="2.2"/><text x="232" y="165" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="25" font-weight="800" fill="#202124">Browser (301)</text><text x="232" y="205" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="21" font-weight="700" fill="#C5221F">0 ms</text><text x="232" y="270" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="21" font-weight="600" fill="#202124">never seen again</text><rect x="445.0" y="110.0" width="345.0" height="120.0" rx="12" fill="#fef7e0" stroke="#fbbc05" stroke-width="2.2"/><text x="617" y="165" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="25" font-weight="800" fill="#202124">Edge (302, 60 s)</text><text x="617" y="205" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="21" font-weight="700" fill="#B06000">~5 ms near the user</text><text x="617" y="270" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="21" font-weight="600" fill="#202124">counted from logs; purgeable</text><rect x="830.0" y="110.0" width="345.0" height="120.0" rx="12" fill="#e6f4ea" stroke="#34a853" stroke-width="2.2"/><text x="1002" y="165" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="25" font-weight="800" fill="#202124">Redirect + caches</text><text x="1002" y="205" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="21" font-weight="700" fill="#188038">~1 ms at the server</text><text x="1002" y="270" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="21" font-weight="600" fill="#202124">every click; recallable</text><rect x="1215.0" y="110.0" width="345.0" height="120.0" rx="12" fill="#e8f0fe" stroke="#4285f4" stroke-width="2.2"/><text x="1387" y="165" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="25" font-weight="800" fill="#202124">Link store</text><text x="1387" y="205" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="21" font-weight="700" fill="#1967D2">~5 ms, misses only</text><text x="1387" y="270" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="21" font-weight="600" fill="#202124">the truth</text><line x1="80.0" y1="330.0" x2="1520.0" y2="330.0" stroke="#4285f4" stroke-width="4"/><text x="80" y="370" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="24" font-weight="800" fill="#1967D2">← faster and cheaper</text><text x="1520" y="370" text-anchor="end" font-family="Inter, Roboto, sans-serif" font-size="24" font-weight="800" fill="#188038">more control: counting, takedown →</text><rect x="60.0" y="410.0" width="1480.0" height="70.0" rx="8" fill="#fef7e0" stroke="#fbbc05" stroke-width="2.2"/><text x="800" y="455" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="25" font-weight="800" fill="#202124">301 against 302 is where on this line you let the answer live. A product decision, not a tweak.</text></svg>