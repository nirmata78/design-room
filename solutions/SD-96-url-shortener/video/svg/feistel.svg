322.0" y1="370.0" x2="556.0" y2="250.0" stroke="#5f6368" stroke-width="2.5"/><line x1="1044.0" y1="250.0" x2="1276.0" y2="370.0" stroke="#5f6368" stroke-width="2.5"/><rect x="1280.0" y="330.0" width="260.0" height="80.0" rx="10" fill="#e6f4ea" stroke="#34a853" stroke-width="2.2"/><text x="1410" y="380" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="26" font-weight="800" fill="#202124">3fLx9Tb</text><rect x="560.0" y="170.0" width="480.0" height="160.0" rx="16" fill="#d2e3fc" stroke="#1967d2" stroke-width="2.2"/><text x="800" y="225" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="24" font-weight="800" fill="#202124">4-round Feistel over 42 bits</text><text x="800" y="262" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="21" font-weight="600" fill="#202124">secret round key · cycle-walk below 62⁷</text><text x="800" y="298" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="21" font-weight="600" fill="#202124">then base-62, 7 characters</text><text x="40" y="480" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="23" font-weight="700" fill="#202124">A bijection: two different IDs can never give the same code. The counter gives uniqueness; the key gives unpredictability.</text></svg>