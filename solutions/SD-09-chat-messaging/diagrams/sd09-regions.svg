home_region = EU)</text><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="117.3926" x="338.3" y="329.7402">3 zones, sync quorum</text></g><!--entity GU--><g class="entity" data-qualified-name="US.GU" data-source-line="17" id="ent0007"><rect fill="#E8F0FA" height="32" rx="2.5" ry="2.5" style="stroke:#2F6FB5;stroke-width:0.5;" width="87.3594" x="95.32" y="711.5"/><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="67.3594" x="105.32" y="730.7402">Gateway US</text></g><!--entity RU--><g class="entity" data-qualified-name="US.RU" data-source-line="18" id="ent0008"><rect fill="#E8F0FA" height="44" rx="2.5" ry="2.5" style="stroke:#2F6FB5;stroke-width:0.5;" width="159.4238" x="23.29" y="435.5"/><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="139.4238" x="33.29" y="454.7402">Read replica of conv 9001</text><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="137.0801" x="33.29" y="466.7402">(async, ~seconds behind)</text></g><!--entity WU--><g class="entity" data-qualified-name="US.WU" data-source-line="19" id="ent0009"><rect fill="#E8F0FA" height="32" rx="2.5" ry="2.5" style="stroke:#2F6FB5;stroke-width:0.5;" width="128.6855" x="42.66" y="585.5"/><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="108.6855" x="52.66" y="604.7402">Delivery workers US</text></g><!--entity A--><g class="entity" data-qualified-name="A" data-source-line="10" id="ent0001"><ellipse cx="376.0029" cy="14" fill="#F1F1F1" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M376.0029,22 L376.0029,49 M363.0029,30 L389.0029,30 M376.0029,49 L363.0029,64 M376.0029,49 L389.0029,64" fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="54.0059" x="349" y="74.7402">Alice (EU