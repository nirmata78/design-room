 lengthAdjust="spacing" textLength="158.7305" x="235.01" y="78.2402">stored locally with clientMsgId</text></g><!--link PENDING to SENT--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" data-link-type="dependency" data-source-line="12" id="lnk5"><path d="M202.99,152.3 C189.08,161.13 172.57,171.87 158.01,182 C127.29,203.38 96.9545,226.3803 74.5045,243.7503" fill="none" id="PENDING-to-SENT" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="70.55,246.81,80.1159,244.4662,74.5045,243.7503,75.2204,238.1389,70.55,246.81" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="55.3711" x="159.01" y="192.2402">ACK {seq}</text><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="41.3555" x="166.0178" y="204.2402">one tick</text></g><!--link PENDING to PENDING--><g class="link" data-entity-1="ent0002" data-entity-2="ent0002" data-link-type="dependency" data-source-line="13" id="lnk6"><path d="M266.58,120.75 C284.68,118.65 301.35,122.4 301.35,132 C301.35,141.6 289.6467,145.9262 271.5467,143.8262" fill="none" id="PENDING-to-PENDING" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="266.58,143.25,275.059,148.2606,271.5467,143.8262,275.981,140.3139,266.58,143.25" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="72.0234" x="318.0229" y="129.2402">no ACK: retry</text><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="93.3691" x="307.35" y="141.2402">same clientMsgId</text></g><!--link PENDING to FAILED--><g class="link" data-entity-1="ent0002" data-entity-2="ent0007" data-link-type="dependency" data-source-line="14" id="lnk8"><path d="M226.87,152.36 C222.13,168.9 218.78,192.42 231.01,2