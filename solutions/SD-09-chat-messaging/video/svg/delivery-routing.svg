<svg xmlns="http://www.w3.org/2000/svg" class="c4" viewBox="0 0 1600 800" width="1600" height="800"><defs><marker id="c4a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#5b6672"/></marker><marker id="c4a-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M10,1 L0,5 L10,9 z" fill="#5b6672"/></marker></defs><rect width="1600" height="800" fill="#ffffff"/><path d="M320.0,375.0 L420.0,375.0" fill="none" stroke="#5b6672" stroke-width="1.9" stroke-dasharray="8 5" marker-end="url(#c4a)"/><text x="370.0" y="360.0" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17.0" fill="#24292f" font-style="normal" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">consume</text><path d="M580.0,285.0 L580.0,120.0 L860.0,120.0" fill="none" stroke="#5b6672" stroke-width="1.9" stroke-dasharray="8 5" marker-end="url(#c4a)"/><path d="M740.0,375.0 L860.0,375.0" fill="none" stroke="#5b6672" stroke-width="1.9" stroke-dasharray="8 5" marker-end="url(#c4a)"/><path d="M580.0,465.0 L580.0,630.0 L860.0,630.0" fill="none" stroke="#5b6672" stroke-width="1.9" stroke-dasharray="8 5" marker-end="url(#c4a)"/><path d="M1200.0,120.0 L1320.0,120.0" fill="none" stroke="#5b6672" stroke-width="1.9" stroke-dasharray="8 5" marker-end="url(#c4a)"/><text x="1260.0" y="105.0" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17.0" fill="#24292f" font-style="normal" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">push</text><path d="M1200.0,375.0 L1320.0,468.0" fill="none" stroke="#5b6672" stroke-width="1.9" stroke-dasharray="8 5" marker-end="url(#c4a)"/><path d="M1200.0,630.0 L1320.0,540.0" fill="none" stroke="#5b6672" stroke-width="1.9" stroke-dasharray="8 5" marker-end="url(#c4a)"/><path d="M56,300 h248 a16,75.0 0 0,1 0,150 h-248 a16,75.0 0 0,1 0,-150 z" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><ellipse cx="304" cy="375.0" rx="16" ry="75.0" fill="none" stroke="#3c7fc0" stroke-width="1.6"/><text x="180.0" y="368.385" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14.3" fill="#e3eefa">[key = convId]</text><text x="180.0" y="390.435" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff">Message log</text><rect x="420" y="285" width="320" height="180" rx="9" fill="#c8341f" stroke="#9d2817" stroke-width="1.6"/><text x="580.0" y="355.095" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14.3" fill="#fde3de">[Container]</text><text x="580.0" y="377.14500000000004" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff">Delivery worker</text><text x="580.0" y="407.925" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16.4" fill="#ffffff" fill-opacity="0.93">reads tier and kind from the event</text><rect x="860" y="40" width="340" height="160" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="1030.0" y="100.095" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14.3" fill="#e3eefa">[any tier]</text><text x="1030.0" y="122.145" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff">Online device</text><text x="1030.0" y="152.92499999999998" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16.4" fill="#ffffff" fill-opacity="0.93">batch per gateway, 200 ms deadline</text><rect x="860" y="295" width="340" height="160" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="1030.0" y="355.095" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14.3" fill="#e3eefa">[up to ~32 members]</text><text x="1030.0" y="377.14500000000004" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff">Offline, SMALL</text><text x="1030.0" y="407.925" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16.4" fill="#ffffff" fill-opacity="0.93">one notification per message</text><rect x="860" y="550" width="340" height="160" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="1030.0" y="599.8050000000001" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14.3" fill="#e3eefa">[over ~32 members]</text><text x="1030.0" y="621.8550000000001" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff">Offline, LARGE</text><text x="1030.0" y="652.6350000000001" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16.4" fill="#ffffff" fill-opacity="0.93">collapsed: one per conversation per</text><text x="1030.0" y="673.2150000000001" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16.4" fill="#ffffff" fill-opacity="0.93">minute</text><rect x="1320" y="40" width="250" height="160" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="1445.0" y="100.095" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14.3" fill="#e3eefa">[WebSocket]</text><text x="1445.0" y="122.145" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff">Gateway</text><text x="1445.0" y="152.92499999999998" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16.4" fill="#ffffff" fill-opacity="0.93">MSG frame</text><rect x="1320" y="420" width="250" height="160" rx="9" fill="#8c8c8c" stroke="#6b6b6b" stroke-width="1.6"/><text x="1445.0" y="493.385" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14.3" fill="#ececec">[SD-12]</text><text x="1445.0" y="515.4350000000001" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff">Push platform</text><rect x="40" y="560" width="520" height="116.8" rx="6" fill="#e8f0fa" stroke="#2f6fb5" stroke-width="1.4"/><text x="52" y="589.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" fill="#3b2a07">The leader stamps tier into MessageStored from</text><text x="52" y="613.7" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" fill="#3b2a07">conversations.tier. kind is MSG, EDIT or DELETE:</text><text x="52" y="638.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" fill="#3b2a07">all three travel the same path, and the sender&#x27;s</text><text x="52" y="663.1" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" fill="#3b2a07">own other devices are recipients too.</text></svg>