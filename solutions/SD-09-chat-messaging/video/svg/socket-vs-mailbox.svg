<svg xmlns="http://www.w3.org/2000/svg" class="c4" viewBox="0 0 1600 700" width="1600" height="700"><defs><marker id="c4a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#5b6672"/></marker><marker id="c4a-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M10,1 L0,5 L10,9 z" fill="#5b6672"/></marker></defs><rect width="1600" height="700" fill="#ffffff"/><path d="M260.0,155.0 L340.0,155.0" fill="none" stroke="#5b6672" stroke-width="1.9" marker-end="url(#c4a)"/><path d="M406.0,220.0 L406.0,395.0 L260.0,395.0" fill="none" stroke="#5b6672" stroke-width="1.9" stroke-dasharray="8 5" marker-end="url(#c4a)"/><text x="330.0" y="380.0" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17.0" fill="#24292f" font-style="normal" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">push</text><path d="M505.0,220.0 L604.0,330.0" fill="none" stroke="#5b6672" stroke-width="1.9" stroke-dasharray="8 5" marker-end="url(#c4a)"/><text x="560.0" y="280.0" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17.0" fill="#24292f" font-style="normal" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">else store</text><path d="M1060.0,155.0 L1300.0,155.0" fill="none" stroke="#5b6672" stroke-width="1.9" stroke-dasharray="8 5" marker-end="url(#c4a)"/><text x="1180.0" y="140.0" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17.0" fill="#24292f" font-style="normal" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">append, then ACK</text><path d="M1352.0,220.0 L1352.0,290.0 L1120.0,290.0 L1120.0,395.0 L1060.0,395.0" fill="none" stroke="#5b6672" stroke-width="1.9" stroke-dasharray="8 5" marker-end="url(#c4a)"/><text x="1200.0" y="275.0" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17.0" fill="#24292f" font-style="normal" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">push: early</text><path d="M1469.0,220.0 L1469.0,330.0" fill="none" stroke="#5b6672" stroke-width="1.9" stroke-dasharray="8 5" marker-end="url(#c4a)"/><text x="1490.0" y="280.0" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17.0" fill="#24292f" font-style="normal" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">sync by cursor</text><text x="40" y="40" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#c8341f">Socket first: deliver, then store</text><text x="840" y="40" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#1168bd">Mailbox first: store, then deliver</text><rect x="40" y="90" width="220" height="130" rx="9" fill="#08427b" stroke="#052e56" stroke-width="1.6"/><circle cx="150.0" cy="76" r="15" fill="#08427b" stroke="#052e56" stroke-width="1.6"/><text x="150.0" y="160.46" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff">Sender</text><rect x="340" y="90" width="220" height="130" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="450.0" y="160.46" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff">Server</text><rect x="40" y="330" width="220" height="130" rx="9" fill="#08427b" stroke="#052e56" stroke-width="1.6"/><circle cx="150.0" cy="316" r="15" fill="#08427b" stroke="#052e56" stroke-width="1.6"/><text x="150.0" y="400.2" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Recipient online</text><path d="M500,344 a130.0,14 0 0,0 260,0 v102 a130.0,14 0 0,1 -260,0 z" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><ellipse cx="630.0" cy="344" rx="130.0" ry="14" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="630.0" y="388.7" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13.6" fill="#e3eefa">[if offline]</text><text x="630.0" y="409.7" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Pending table</text><rect x="840" y="90" width="220" height="130" rx="9" fill="#08427b" stroke="#052e56" stroke-width="1.6"/><circle cx="950.0" cy="76" r="15" fill="#08427b" stroke="#052e56" stroke-width="1.6"/><text x="950.0" y="160.46" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff">Sender</text><rect x="1300" y="90" width="260" height="130" rx="9" fill="#c8341f" stroke="#9d2817" stroke-width="1.6"/><text x="1430.0" y="148.7" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13.6" fill="#fde3de">[stored, numbered]</text><text x="1430.0" y="169.7" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Conversation log</text><rect x="840" y="330" width="220" height="130" rx="9" fill="#08427b" stroke="#052e56" stroke-width="1.6"/><circle cx="950.0" cy="316" r="15" fill="#08427b" stroke="#052e56" stroke-width="1.6"/><text x="950.0" y="400.2" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Device online</text><rect x="1300" y="330" width="260" height="130" rx="9" fill="#08427b" stroke="#052e56" stroke-width="1.6"/><circle cx="1430.0" cy="316" r="15" fill="#08427b" stroke="#052e56" stroke-width="1.6"/><text x="1430.0" y="400.2" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Device offline</text><rect x="40" y="530" width="720" height="72.6" rx="6" fill="#fdecea" stroke="#c8341f" stroke-width="1.4"/><text x="52" y="561.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" fill="#3b2a07">Two code paths. A crash after the push and before the write</text><text x="52" y="588.3" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" fill="#3b2a07">loses the message; a retry shows it twice.</text><rect x="840" y="530" width="720" height="72.6" rx="6" fill="#e8f0fa" stroke="#2f6fb5" stroke-width="1.4"/><text x="852" y="561.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" fill="#3b2a07">One code path. Every device reads the same log after its own</text><text x="852" y="588.3" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" fill="#3b2a07">cursor. The socket only delivers early.</text></svg>