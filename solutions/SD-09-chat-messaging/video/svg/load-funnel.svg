<svg xmlns="http://www.w3.org/2000/svg" class="c4" viewBox="0 0 1600 760" width="1600" height="760"><defs><marker id="c4a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#5b6672"/></marker><marker id="c4a-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M10,1 L0,5 L10,9 z" fill="#5b6672"/></marker></defs><rect width="1600" height="760" fill="#ffffff"/><path d="M500.0,175.0 L560.0,175.0" fill="none" stroke="#5b6672" stroke-width="1.9" marker-end="url(#c4a)"/><path d="M1020.0,175.0 L1080.0,175.0" fill="none" stroke="#5b6672" stroke-width="1.9" marker-end="url(#c4a)"/><path d="M500.0,505.0 L560.0,505.0" fill="none" stroke="#5b6672" stroke-width="1.9" marker-end="url(#c4a)"/><path d="M1020.0,505.0 L1080.0,505.0" fill="none" stroke="#5b6672" stroke-width="1.9" marker-end="url(#c4a)"/><rect x="40" y="60" width="460" height="230" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="270.0" y="151.875" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17.0" fill="#e3eefa">[connections]</text><text x="270.0" y="178.125" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#ffffff">~250–300 gateways</text><text x="270.0" y="213.625" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.5" fill="#ffffff" fill-opacity="0.93">100 M ÷ 500 k per host, plus headroom</text><rect x="560" y="60" width="460" height="230" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="790.0" y="151.875" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17.0" fill="#e3eefa">[stay at the gateway]</text><text x="790.0" y="178.125" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#ffffff">~3.3 M heartbeats/s</text><text x="790.0" y="213.625" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.5" fill="#ffffff" fill-opacity="0.93">100 M ÷ 30 s</text><rect x="1080" y="60" width="460" height="230" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="1310.0" y="151.875" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17.0" fill="#e3eefa">[to the registry, batched]</text><text x="1310.0" y="178.125" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#ffffff">~330 k TTL refreshes/s</text><text x="1310.0" y="213.625" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.5" fill="#ffffff" fill-opacity="0.93">100 M ÷ 300 s</text><rect x="40" y="390" width="460" height="230" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="270.0" y="481.875" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17.0" fill="#e3eefa">[one log write each]</text><text x="270.0" y="508.125" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#ffffff">1 M messages/s</text><text x="270.0" y="543.625" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.5" fill="#ffffff" fill-opacity="0.93">≈ 200 MB/s ingest</text><rect x="560" y="390" width="460" height="230" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="790.0" y="481.875" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17.0" fill="#e3eefa">[assumes ~3 online devices]</text><text x="790.0" y="508.125" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#ffffff">~3 M socket pushes/s</text><text x="790.0" y="543.625" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.5" fill="#ffffff" fill-opacity="0.93">1 M × ~3</text><rect x="1080" y="390" width="460" height="230" rx="9" fill="#c8341f" stroke="#9d2817" stroke-width="1.6"/><text x="1310.0" y="481.875" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17.0" fill="#fde3de">[per message, in a group of 1,000]</text><text x="1310.0" y="508.125" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#ffffff">~10⁶ receipts</text><text x="1310.0" y="543.625" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.5" fill="#ffffff" fill-opacity="0.93">1,000 readers × 999 others</text><rect x="40" y="680" width="1520" height="70.0" rx="6" fill="#e7f4ec" stroke="#2d8a4e" stroke-width="1.4"/><text x="52" y="710.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" fill="#3b2a07">Top row: the connection tier, sized by sockets. Bottom row: the message path, sized by messages. The red box is the trap, and it is found by</text><text x="52" y="736.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" fill="#3b2a07">arithmetic.</text></svg>