<svg xmlns="http://www.w3.org/2000/svg" class="c4" viewBox="0 0 1600 560" width="1600" height="560"><defs><marker id="c4a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#5b6672"/></marker><marker id="c4a-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M10,1 L0,5 L10,9 z" fill="#5b6672"/></marker></defs><rect width="1600" height="560" fill="#ffffff"/><rect x="40" y="70" width="350" height="240" rx="9" fill="#c8341f" stroke="#9d2817" stroke-width="1.6"/><text x="215.0" y="154.625" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17.0" fill="#fde3de">[log, seq, cursors]</text><text x="215.0" y="180.875" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#ffffff">What stays</text><text x="215.0" y="216.375" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.5" fill="#ffffff" fill-opacity="0.93">the server orders ciphertext it</text><text x="215.0" y="240.875" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.5" fill="#ffffff" fill-opacity="0.93">cannot read</text><rect x="430" y="70" width="350" height="240" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="605.0" y="166.875" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17.0" fill="#e3eefa">[server-side search]</text><text x="605.0" y="193.125" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#ffffff">What breaks</text><text x="605.0" y="228.625" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.5" fill="#ffffff" fill-opacity="0.93">search moves to the device</text><rect x="820" y="70" width="350" height="240" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="995.0" y="154.625" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17.0" fill="#e3eefa">[group fan-out]</text><text x="995.0" y="180.875" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#ffffff">What costs</text><text x="995.0" y="216.375" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.5" fill="#ffffff" fill-opacity="0.93">encrypt per device; sender keys</text><text x="995.0" y="240.875" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.5" fill="#ffffff" fill-opacity="0.93">reduce it</text><rect x="1210" y="70" width="350" height="240" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="1385.0" y="154.625" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17.0" fill="#e3eefa">[server moderation]</text><text x="1385.0" y="180.875" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#ffffff">What&#x27;s lost</text><text x="1385.0" y="216.375" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.5" fill="#ffffff" fill-opacity="0.93">reports carry decrypted copies,</text><text x="1385.0" y="240.875" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.5" fill="#ffffff" fill-opacity="0.93">by consent</text><rect x="40" y="370" width="1520" height="45.3" rx="6" fill="#e8f0fa" stroke="#2f6fb5" stroke-width="1.4"/><text x="52" y="401.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" fill="#3b2a07">Product, legal and policy decide. Engineering brings one page: the options, their costs and timelines.</text></svg>