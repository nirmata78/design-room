font-weight="400" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">append seq 900, term 5</text><rect x="451.0" y="226.5" width="958.0" height="42.84" rx="6" fill="#fdecea" stroke="#c8341f" stroke-width="1.4"/><text x="930.0" y="255.4" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20.2" fill="#24292f">The leader dies before it has a majority. No ACK reaches the phone.</text><line x1="930.0" y1="333.24" x2="1282.0" y2="333.24" stroke="#c8341f" stroke-width="2" marker-end="url(#sq-f-c8341f)"/><circle cx="944.0" cy="333.24" r="12" fill="#ffffff" stroke="#c8341f" stroke-width="1.6"/><text x="944.0" y="338.24" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#c8341f">3</text><text x="1110.0" y="297.84000000000003" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#c8341f" font-weight="600" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">wins the election: its log</text><text x="1110.0" y="324.24" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#c8341f" font-weight="600" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">is the most complete</text><path d="M930.0,409.64 h46 v26 h-44" fill="none" stroke="#c8341f" stroke-width="2" marker-end="url(#sq-f-c8341f)"/><circle cx="944.0" cy="435.64" r="12" fill="#ffffff" stroke="#c8341f" stroke-width="1.6"/><text x="944.0" y="440.64" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#c8341f">4</text><text x="986.0" y="387.24" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#c8341f" font-weight="600" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">commit its log tail;</text><text x="986.0" y="413.64" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#c8341f" font-weight="600" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">last_seq = 900</text><line x1="210.0" y1="485.64" x2="922.0" y2="485.64" stroke="#24292f" stroke-width="2" marker-end="url(#sq-f-24292f)"/><circle cx="224.0" cy="485.64" r="12" fill="#ffffff" stroke="#24292f" stroke-width="1.6"/><text x="224.0" y="490.64" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#24292f">5</text><text x="570.0" y="476.64" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#24292f" font-weight="400" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">retry: same c-77, seconds later</text><line x1="930.0" y1="535.64" x2="218.0" y2="535.64" stroke="#2d8a4e" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#sq-o-2d8a4e)"/><text x="570.0" y="526.64" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#2d8a4e" font-weight="400" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">dedup finds seq 900: ACK, no second copy</text><rect x="91.0" y="568.14" width="1318.0" height="42.84" rx="6" fill="#e7f4ec" stroke="#2d8a4e" stroke-width="1.4"/><text x="750.0" y="597.04" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20.2" fill="#24292f">Had 900 not survived, the retry would take 900. Term 5 can&#x27;t write: a stale term is fenced. Order and numbers hold.</text></svg>