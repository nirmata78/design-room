ial, sans-serif" font-size="25" font-weight="700" fill="#ffffff">~600 posts/s</text><text x="790.0" y="213.625" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.5" fill="#ffffff" fill-opacity="0.93">500 M × 0.1 posts/day ÷ 86,400</text><rect x="1080" y="60" width="460" height="230" rx="9" fill="#c8341f" stroke="#9d2817" stroke-width="1.6"/><text x="1310.0" y="151.875" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17.0" fill="#fde3de">[timeline fan-out]</text><text x="1310.0" y="178.125" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#ffffff">~120 k inserts/s</text><text x="1310.0" y="213.625" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.5" fill="#ffffff" fill-opacity="0.93">600 posts/s × 200 followers</text><rect x="40" y="390" width="460" height="230" rx="9" fill="#c8341f" stroke="#9d2817" stroke-width="1.6"/><text x="270.0" y="481.875" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17.0" fill="#fde3de">[after skipping inactive]</text><text x="270.0" y="508.125" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#ffffff">~60 k inserts/s</text><text x="270.0" y="543.625" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.5" fill="#ffffff" fill-opacity="0.93">≈ half of followers idle 30+ days</text><rect x="560" y="390" width="460" height="230" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="790.0" y="481.875" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17.0" fill="#e3eefa">[per open, celebrity lists]</text><text x="790.0" y="508.125" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#ffffff">~5–20 reads</text><text x="790.0" y="543.625" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.5" fill="#ffffff" fill-opacity="0.93">followed celebrities, one small list each</text><rect x="1080" y="390" width="460" height="230" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="1310.0" y="481.875" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17.0" fill="#e3eefa">[per open, multi-get]</text><text x="1310.0" y="508.125" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#ffffff">50 hydrations</text><text x="1310.0" y="543.625" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.5" fill="#ffffff" fill-opacity="0.93">top 50 of ~200 candidates</text><rect x="40" y="680" width="1520" height="70.0" rx="6" fill="#e7f4ec" stroke="#2d8a4e" stroke-width="1.4"/><text x="52" y="710.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" fill="#3b2a07">Writes are small; fan-out multiplies them 200×; skipping inactive users halves that. Reads stay cache-only: one timeline, a handful of</text><text x="52" y="736.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" fill="#3b2a07">celebrity lists, one multi-get.</text></svg>