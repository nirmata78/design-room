<svg xmlns="http://www.w3.org/2000/svg" class="c4" viewBox="0 0 1600 560" width="1600" height="560"><defs><marker id="c4a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#5b6672"/></marker><marker id="c4a-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M10,1 L0,5 L10,9 z" fill="#5b6672"/></marker></defs><rect width="1600" height="560" fill="#ffffff"/><path d="M510.0,180.0 L560.0,180.0" fill="none" stroke="#5b6672" stroke-width="1.9" marker-end="url(#c4a)"/><path d="M1030.0,180.0 L1080.0,180.0" fill="none" stroke="#5b6672" stroke-width="1.9" marker-end="url(#c4a)"/><rect x="40" y="70" width="470" height="220" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="275.0" y="142.035" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18.4" fill="#e3eefa">[Phase 1]</text><text x="275.0" y="170.385" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#ffffff">pure pull + caching</text><text x="275.0" y="208.245" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21.1" fill="#ffffff" fill-opacity="0.93">enough at today&#x27;s scale; one moving</text><text x="275.0" y="234.705" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21.1" fill="#ffffff" fill-opacity="0.93">part</text><rect x="560" y="70" width="470" height="220" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="795.0" y="155.265" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18.4" fill="#e3eefa">[Phase 2]</text><text x="795.0" y="183.61499999999998" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#ffffff">push for active users</text><text x="795.0" y="221.47499999999997" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21.1" fill="#ffffff" fill-opacity="0.93">when read cost or latency says so</text><rect x="1080" y="70" width="470" height="220" rx="9" fill="#c8341f" stroke="#9d2817" stroke-width="1.6"/><text x="1315.0" y="142.035" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18.4" fill="#fde3de">[Phase 3]</text><text x="1315.0" y="170.385" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#ffffff">the celebrity split</text><text x="1315.0" y="208.245" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21.1" fill="#ffffff" fill-opacity="0.93">when the first account crosses the</text><text x="1315.0" y="234.705" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21.1" fill="#ffffff" fill-opacity="0.93">threshold</text><rect x="40" y="350" width="1520" height="46.6" rx="6" fill="#e7f4ec" stroke="#2d8a4e" stroke-width="1.4"/><text x="52" y="382.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#3b2a07">Each step is triggered by a measured number, not by the diagram. On-call watches freshness from day one.</text></svg>