<svg xmlns="http://www.w3.org/2000/svg" class="c4" viewBox="0 0 1600 560" width="1600" height="560"><defs><marker id="c4a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#5b6672"/></marker><marker id="c4a-s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M10,1 L0,5 L10,9 z" fill="#5b6672"/></marker></defs><rect width="1600" height="560" fill="#ffffff"/><rect x="40" y="70" width="480" height="230" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="280.0" y="160.265" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18.4" fill="#e3eefa">[push]</text><text x="280.0" y="188.61499999999998" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#ffffff">Under ~10 k followers</text><text x="280.0" y="226.47499999999997" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21.1" fill="#ffffff" fill-opacity="0.93">fan out to every active follower</text><rect x="560" y="70" width="480" height="230" rx="9" fill="#85bbf0" stroke="#5d9bd6" stroke-width="1.6"/><text x="800.0" y="160.265" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18.4" fill="#1f4a75">[push, narrower]</text><text x="800.0" y="188.61499999999998" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#0b2540">~10 k to ~100 k</text><text x="800.0" y="226.47499999999997" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21.1" fill="#0b2540" fill-opacity="0.93">only followers active in the last day</text><rect x="1080" y="70" width="480" height="230" rx="9" fill="#c8341f" stroke="#9d2817" stroke-width="1.6"/><text x="1320.0" y="147.035" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18.4" fill="#fde3de">[pull]</text><text x="1320.0" y="175.385" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#ffffff">Over ~100 k</text><text x="1320.0" y="213.245" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21.1" fill="#ffffff" fill-opacity="0.93">recent posts cached per author, merged</text><text x="1320.0" y="239.705" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21.1" fill="#ffffff" fill-opacity="0.93">at read</text><rect x="40" y="360" width="1520" height="75.2" rx="6" fill="#e8f0fa" stroke="#2f6fb5" stroke-width="1.4"/><text x="52" y="392.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#3b2a07">The threshold is a config value: where one post&#x27;s fan-out cost exceeds the extra read cost across that author&#x27;s followers. Start</text><text x="52" y="420.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#3b2a07">at ten thousand, then measure.</text></svg>