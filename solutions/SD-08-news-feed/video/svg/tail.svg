nt-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="800" fill="#c8341f">110 million</text><line x1="607.1" y1="90.0" x2="607.1" y2="425.0" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="8 6"/><text x="607.1084337349398" y="452" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#57606a">100</text><line x1="884.2" y1="90.0" x2="884.2" y2="425.0" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="8 6"/><text x="884.2168674698795" y="452" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#57606a">10 k</text><line x1="1161.3" y1="90.0" x2="1161.3" y2="425.0" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="8 6"/><text x="1161.3253012048192" y="452" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#57606a">1 M</text><line x1="1438.4" y1="90.0" x2="1438.4" y2="425.0" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="8 6"/><text x="1438.433734939759" y="452" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#57606a">100 M</text><text x="40" y="505" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#5a1308">One post&#x27;s push cost is its author&#x27;s follower count. The few accounts on the right decide the architecture.</text></svg>