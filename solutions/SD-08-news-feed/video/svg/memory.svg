<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" width="1600" height="500"><rect width="1600" height="500" fill="#ffffff"/><text x="40" y="44" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#24292f">Timeline tier memory: IDs against bodies (500 M users × 500 entries)</text><text x="40" y="136" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#24292f">IDs, 16 B each</text><rect x="380.0" y="100.0" width="17.6" height="54.0" rx="8" fill="#e7f4ec" stroke="#1f8a4c" stroke-width="2.2"/><text x="411.6" y="137" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="800" fill="#1f8a4c">4 TB</text><text x="40" y="226" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#24292f">IDs, three replicas</text><rect x="380.0" y="190.0" width="52.8" height="54.0" rx="8" fill="#e7f4ec" stroke="#1f8a4c" stroke-width="2.2"/><text x="446.8" y="227" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="800" fill="#1f8a4c">12 TB</text><text x="40" y="316" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#24292f">Bodies, ~1 KB each</text><rect x="380.0" y="280.0" width="1100.0" height="54.0" rx="8" fill="#fdecea" stroke="#c8341f" stroke-width="2.2"/><text x="1494.0" y="317" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="800" fill="#c8341f">250 TB</text><text x="40" y="410" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#5a1308">Bodies are 60 times larger, and every edit or delete would have to chase millions of copies.</text><text x="40" y="455" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#173d24">IDs are hydrated from one post cache: a delete is one write.</text></svg>