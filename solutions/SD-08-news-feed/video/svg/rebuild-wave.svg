<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 510" width="1600" height="510"><rect width="1600" height="510" fill="#ffffff"/><text x="40" y="44" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#24292f">A lost shard: rebuilds a second, with and without a limit (illustrative)</text><line x1="160.0" y1="400.0" x2="1480.0" y2="400.0" stroke="#24292f" stroke-width="2.5"/><line x1="160.0" y1="400.0" x2="160.0" y2="100.0" stroke="#24292f" stroke-width="2.5"/><text x="1480" y="440" text-anchor="end" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#57606a">minutes after the loss</text><polyline points="160,145 182,165 204,184 226,201 248,217 270,232 292,245 314,258 336,269 358,280 380,289 402,298 424,306 446,314 468,321 490,327 512,333 534,338 556,343 578,348 600,352 622,356 644,359 666,362 688,365 710,368 732,371 754,373 776,375 798,377 820,379 842,381 864,382 886,384 908,385 930,386 952,387 974,388 996,389 1018,390 1040,391 1062,392 1084,392 1106,393 1128,393 1150,394 1172,394 1194,395 1216,395 1238,396 1260,396 1282,396 1304,397 1326,397 1348,397 1370,397 1392,398 1414,398 1436,398 1458,398 1480,398" fill="none" stroke="#c8341f" stroke-width="4"/><line x1="160.0" y1="325.0" x2="930.0" y2="325.0" stroke="#1f8a4c" stroke-width="4"/><text x="214.0" y="151.0" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="800" fill="#c8341f">unlimited: 1,700/s × 200 reads = 340,000 author-index reads/s</text><text x="962.0" y="333.0" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="800" fill="#1f8a4c">limited: 500/s (100,000 reads/s), the rest degraded</text><line x1="160.0" y1="325.0" x2="160.0" y2="400.0" stroke="#8c959f" stroke-width="1"/><text x="146" y="333.0" text-anchor="end" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#57606a">500</text><text x="146" y="153.0" text-anchor="end" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#57606a">1,700</text><text x="40" y="470" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#24292f">The limit decides the blast radius; the degraded feed keeps the lost users served while they wait.</text></svg>