 y="216.375" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.5" fill="#ffffff" fill-opacity="0.93">read both, serve pull; diff the</text><text x="605.0" y="240.875" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.5" fill="#ffffff" fill-opacity="0.93">top 50</text><rect x="820" y="70" width="350" height="240" rx="9" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.6"/><text x="995.0" y="154.625" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17.0" fill="#e3eefa">[Weeks 7–9]</text><text x="995.0" y="180.875" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#ffffff">ramp</text><text x="995.0" y="216.375" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.5" fill="#ffffff" fill-opacity="0.93">1% → 10% → 100% serve from</text><text x="995.0" y="240.875" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.5" fill="#ffffff" fill-opacity="0.93">timelines</text><rect x="1210" y="70" width="350" height="240" rx="9" fill="#c8341f" stroke="#9d2817" stroke-width="1.6"/><text x="1385.0" y="154.625" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17.0" fill="#fde3de">[Weeks 10–13]</text><text x="1385.0" y="180.875" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#ffffff">celebrity split</text><text x="1385.0" y="216.375" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.5" fill="#ffffff" fill-opacity="0.93">threshold on; pull path kept</text><text x="1385.0" y="240.875" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19.5" fill="#ffffff" fill-opacity="0.93">for rebuilds</text><rect x="40" y="370" width="1520" height="72.6" rx="6" fill="#e8f0fa" stroke="#2f6fb5" stroke-width="1.4"/><text 