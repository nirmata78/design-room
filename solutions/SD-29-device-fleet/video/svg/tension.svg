<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" width="1600" height="400"><rect width="1600" height="400" fill="#ffffff"/><text x="40" y="50" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="28" font-weight="800" fill="#202124">Reach every device, or never break one: a release is both, and you cannot touch the hardware</text><rect x="60.0" y="110.0" width="470.0" height="250.0" rx="14" fill="#fce8e6" stroke="#ea4335" stroke-width="2.2"/><text x="84" y="160" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="27" font-weight="800" fill="#202124">Move fast</text><text x="84" y="205" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="22" font-weight="500" fill="#202124">push to everyone at once; one day</text><text x="84" y="235" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="22" font-weight="500" fill="#202124">to 100 %</text><text x="84" y="330" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="22" font-weight="800" fill="#C5221F">a bad image bricks 1 M devices: $150 M</text><rect x="570.0" y="110.0" width="470.0" height="250.0" rx="14" fill="#fef7e0" stroke="#fbbc05" stroke-width="2.2"/><text x="594" y="160" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="27" font-weight="800" fill="#202124">Move never</text><text x="594" y="205" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="22" font-weight="500" fill="#202124">freeze firmware; manual updates</text><text x="594" y="330" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="22" font-weight="800" fill="#B06000">7 years of unpatched devices</text><rect x="1080.0" y="110.0" width="470.0" height="250.0" rx="14" fill="#e6f4ea" stroke="#34a853" stroke-width="2.2"/><text x="1104" y="160" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="27" font-weight="800" fill="#202124">Move in waves</text><text x="1104" y="205" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="22" font-weight="500" fill="#202124">1,000 first, every hardware rev;</text><text x="1104" y="235" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="22" font-weight="500" fill="#202124">halt on signal; devices revert on</text><text x="1104" y="265" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="22" font-weight="500" fill="#202124">their own</text><text x="1104" y="330" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="22" font-weight="800" fill="#188038">blast radius ≤ 100 devices</text></svg>