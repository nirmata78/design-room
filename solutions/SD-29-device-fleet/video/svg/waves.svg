<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 570" width="1600" height="570"><rect width="1600" height="570" fill="#ffffff"/><text x="40" y="48" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="28" font-weight="800" fill="#202124">Waves by cohort, each soaked and compared with a control before the next</text><rect x="60.0" y="120.0" width="200.0" height="50.0" rx="10" fill="#e8f0fe" stroke="#4285f4" stroke-width="2.2"/><text x="74" y="153" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="22" font-weight="800" fill="#202124">wave 0: 100</text><text x="306" y="153" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="21" font-weight="600" fill="#5f6368">internal devices  ·  soak 24 h, compare</text><rect x="60.0" y="190.0" width="260.0" height="50.0" rx="10" fill="#e8f0fe" stroke="#4285f4" stroke-width="2.2"/><text x="74" y="223" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="22" font-weight="800" fill="#202124">wave 1: 1,000</text><text x="336" y="223" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="21" font-weight="600" fill="#5f6368">every hardware rev  ·  soak 24 h, compare</text><rect x="60.0" y="260.0" width="470.0" height="50.0" rx="10" fill="#e8f0fe" stroke="#4285f4" stroke-width="2.2"/><text x="74" y="293" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="22" font-weight="800" fill="#202124">wave 2: 10,000</text><text x="546" y="293" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="21" font-weight="600" fill="#5f6368">+ every region  ·  soak 24 h, compare</text><rect x="60.0" y="330.0" width="820.0" height="50.0" rx="10" fill="#e8f0fe" stroke="#4285f4" stroke-width="2.2"/><text x="74" y="363" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="22" font-weight="800" fill="#202124">wave 3: 100,000</text><text x="896" y="363" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="21" font-weight="600" fill="#5f6368">a person approves  ·  soak 24 h, compare</text><rect x="60.0" y="400.0" width="1200.0" height="50.0" rx="10" fill="#e6f4ea" stroke="#34a853" stroke-width="2.2"/><text x="74" y="433" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="22" font-weight="800" fill="#202124">wave 4: rest</text><text x="1276" y="433" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="21" font-weight="600" fill="#5f6368"></text><rect x="60.0" y="480.0" width="1480.0" height="60.0" rx="10" fill="#fce8e6" stroke="#ea4335" stroke-width="2.2"/><text x="80" y="518" text-anchor="start" font-family="Inter, Roboto, sans-serif" font-size="21" font-weight="700" fill="#c5221f">Halt rule at every wave: crash rate, reconnects or battery worse than control beyond the interval → stop, revert as v+1</text></svg>