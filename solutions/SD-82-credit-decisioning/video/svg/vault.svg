<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 550" width="1600" height="550"><rect width="1600" height="550" fill="#ffffff"/><text x="40" y="44" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#24292f">The identity boundary: real values inside, tokens everywhere else</text><rect x="40.0" y="90.0" width="600.0" height="380.0" rx="18" fill="#fdecea" stroke="#c8341f" stroke-width="2.2" stroke-dasharray="10 6"/><text x="340" y="130" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="800" fill="#c8341f">Inside the boundary</text><rect x="80.0" y="160.0" width="520.0" height="110.0" rx="12" fill="#d3f3e6" stroke="#1f8a4c" stroke-width="2.2"/><text x="340" y="205" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="800" fill="#24292f">Identity vault</text><text x="340" y="243" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#173d24">SSN · date of birth · address, keys per field</text><rect x="80.0" y="310.0" width="520.0" height="110.0" rx="12" fill="#eceff2" stroke="#8c959f" stroke-width="2.2"/><text x="340" y="355" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="800" fill="#24292f">Vendor adapters</text><text x="340" y="393" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#3a424a">detokenise for the call; logs scrubbed</text><rect x="900.0" y="100.0" width="640.0" height="72.0" rx="12" fill="#dbeafe" stroke="#2f6fb5" stroke-width="2.2"/><text x="1220" y="146" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#24292f">Application service and DB</text><line x1="642.0" y1="280.0" x2="896.0" y2="136.0" stroke="#8c959f" stroke-width="2.2"/><polygon points="896,136 887.5,147.1 882.