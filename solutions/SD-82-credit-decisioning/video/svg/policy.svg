<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 550" width="1600" height="550"><rect width="1600" height="550" fill="#ffffff"/><text x="40" y="44" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#24292f">When the bureau is missing at the deadline: four answers, in order, signed by credit risk</text><rect x="40.0" y="90.0" width="420.0" height="80.0" rx="12" fill="#dbeafe" stroke="#2f6fb5" stroke-width="2.2"/><text x="60" y="140" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#24292f">1 · Second bureau</text><rect x="480.0" y="90.0" width="700.0" height="80.0" rx="12" fill="#ffffff" stroke="#2f6fb5" stroke-width="2.2"/><text x="500" y="140" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#24292f">only after an error or an open breaker; never a race</text><rect x="1200.0" y="90.0" width="360.0" height="80.0" rx="12" fill="#f6f8fa" stroke="#8c959f" stroke-width="2.2"/><text x="1380" y="140" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#3a424a">rate-limited to its contract</text><line x1="250.0" y1="170.0" x2="250.0" y2="190.0" stroke="#8c959f" stroke-width="2.2"/><polygon points="250,190 244.5,177.1 255.5,177.1" fill="#8c959f"/><rect x="40.0" y="190.0" width="420.0" height="80.0" rx="12" fill="#d3f3e6" stroke="#1f8a4c" stroke-width="2.2"/><text x="60" y="240" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#24292f">2 · Decide without a bureau</text><rect x="480.0" y="190.0" width="700.0" height="80.0" rx="12" fill="#ffffff" stroke="#1f8a4c" stroke-width="2.2"/><text x="500" y="240" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#24292f">returning customer in good standing, ≤ $500</text><rect x="1200.0" y="190.0" width="360.0" height="80.0" rx="12" fill="#f6f8fa" stroke="#8c959f" stroke-width="2.2"/><text x="1380" y="240" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#3a424a">daily exposure cap $250,000</text><line x1="250.0" y1="270.0" x2="250.0" y2="290.0" stroke="#8c959f" stroke-width="2.2"/><polygon points="250,290 244.5,277.1 255.5,277.1" fill="#8c959f"/><rect x="40.0" y="290.0" width="420.0" height="80.0" rx="12" fill="#fdf3e1" stroke="#d18f1c" stroke-width="2.2"/><text x="60" y="340" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#24292f">3 · Refer</text><rect x="480.0" y="290.0" width="700.0" height="80.0" rx="12" fill="#ffffff" stroke="#d18f1c" stroke-width="2.2"/><text x="500" y="340" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#24292f">“we&#x27;ll finish in two minutes by text”; merchant sees pending</text><rect x="1200.0" y="290.0" width="360.0" height="80.0" rx="12" fill="#f6f8fa" stroke="#8c959f" stroke-width="2.2"/><text x="1380" y="340" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#3a424a">finish within 10 minutes</text><line x1="250.0" y1="370.0" x2="250.0" y2="390.0" stroke="#8c959f" stroke-width="2.2"/><polygon points="250,390 244.5,377.1 255.5,377.1" fill="#8c959f"/><rect x="40.0" y="390.0" width="420.0" height="80.0" rx="12" fill="#fdecea" stroke="#c8341f" stroke-width="2.2"/><text x="60" y="440" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#24292f">4 · Decline</text><rect x="480.0" y="390.0" width="700.0" height="80.0" rx="12" fill="#ffffff" stroke="#c8341f" stroke-width="2.2"/><text x="500" y="440" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#24292f">only with a reason about the applicant</text><rect x="1200.0" y="390.0" width="360.0" height="80.0" rx="12" fill="#f6f8fa" stroke="#8c959f" stroke-width="2.2"/><text x="1380" y="440" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#3a424a">never “our vendor was slow”</text><text x="40" y="520" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#173d24">Every row is a versioned setting with a counter, a cap and a dashboard. Engineering builds it; credit risk owns it.</text></svg>