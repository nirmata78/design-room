<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 590" width="1600" height="590"><rect width="1600" height="590" fill="#ffffff"/><text x="40" y="44" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#24292f">The application as a state machine: one committed row per transition</text><rect x="60.0" y="200.0" width="200.0" height="70.0" rx="35" fill="#dbeafe" stroke="#2f6fb5" stroke-width="2.2"/><text x="160" y="245" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#24292f">STARTED</text><rect x="330.0" y="200.0" width="200.0" height="70.0" rx="35" fill="#dbeafe" stroke="#2f6fb5" stroke-width="2.2"/><text x="430" y="245" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#24292f">CHECKING</text><rect x="640.0" y="110.0" width="200.0" height="70.0" rx="35" fill="#d3f3e6" stroke="#1f8a4c" stroke-width="2.2"/><text x="740" y="155" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#24292f">OFFERED</text><rect x="640.0" y="290.0" width="200.0" height="70.0" rx="35" fill="#fdf3e1" stroke="#d18f1c" stroke-width="2.2"/><text x="740" y="335" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#24292f">REFERRED</text><rect x="640.0" y="430.0" width="200.0" height="70.0" rx="35" fill="#fdecea" stroke="#c8341f" stroke-width="2.2"/><text x="740" y="475" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#24292f">DECLINED</text><rect x="950.0" y="110.0" width="200.0" height="70.0" rx="35" fill="#d3f3e6" stroke="#1f8a4c" stroke-width="2.2"/><text x="1050" y="155" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#24292f">BOOKED</text><rect x="950.0" y="250.0" width="200.0" height="70.0" rx="35" fill="#eceff2" stroke="#8c959f" stroke-width="2.2"/><text x="1050" y="295" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#24292f">EXPIRED</text><rect x="1260.0" y="110.0" width="200.0" height="70.0" rx="35" fill="#d3f3e6" stroke="#1f8a4c" stroke-width="2.2"/><text x="1360" y="155" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#24292f">FUNDED</text><line x1="260.0" y1="235.0" x2="326.0" y2="235.0" stroke="#24292f" stroke-width="2.4"/><polygon points="326,235 313.1,240.5 313.1,229.5" fill="#24292f"/><text x="295.0" y="221.0" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#57606a">vendors called</text><line x1="530.0" y1="235.0" x2="636.0" y2="145.0" stroke="#24292f" stroke-width="2.4"/><polygon points="636,145 629.7,157.5 622.6,149.2" fill="#24292f"/><text x="585.0" y="176.0" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#57606a">approve</text><line x1="530.0" y1="235.0" x2="636.0" y2="325.0" stroke="#24292f" stroke-width="2.4"/><polygon points="636,325 622.6,320.8 629.7,312.5" fill="#24292f"/><text x="585.0" y="296.0" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#57606a">missing data</text><line x1="530.0" y1="235.0" x2="636.0" y2="465.0" stroke="#24292f" stroke-width="2.4"/><polygon points="636,465 625.7,455.6 635.6,451.0" fill="#24292f"/><text x="585.0" y="376.0" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#57606a">reasons</text><line x1="840.0" y1="145.0" x2="946.0" y2="145.0" stroke="#24292f" stroke-width="2.4"/><polygon points="946,145 933.1,150.5 933.1,139.5" fill="#24292f"/><text x="895.0" y="131.0" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#57606a">accept</text><line x1="840.0" y1="145.0" x2="946.0" y2="285.0" stroke="#24292f" stroke-width="2.4"/><polygon points="946,285 933.9,278.0 942.6,271.4" fill="#24292f"/><text x="895.0" y="231.0" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#57606a">15 min</text><line x1="1150.0" y1="145.0" x2="1256.0" y2="145.0" stroke="#24292f" stroke-width="2.4"/><polygon points="1256,145 1243.1,150.5 1243.1,139.5" fill="#24292f"/><text x="1205.0" y="131.0" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#57606a">merchant paid</text><line x1="740.0" y1="290.0" x2="740.0" y2="184.0" stroke="#d18f1c" stroke-width="2.4"/><polygon points="740,184 745.5,196.9 734.5,196.9" fill="#d18f1c"/><text x="752" y="245" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#a86a12">finished</text><rect x="900.0" y="400.0" width="660.0" height="110.0" rx="12" fill="#e7f4ec" stroke="#1f8a4c" stroke-width="2.2"/><text x="920" y="440" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="800" fill="#173d24">The one atomic step: OFFERED → BOOKED</text><text x="920" y="478" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#173d24">loan + outbox row in the same commit, at a version</text><text x="40" y="560" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#24292f">A credit pull is never “compensated”: it happened, and the row records it. Only funding, after BOOKED, has a real undo.</text></svg>