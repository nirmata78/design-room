<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 540" width="1600" height="540"><rect width="1600" height="540" fill="#ffffff"/><text x="40" y="44" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#24292f">The decision record: same inputs + same versions = the same answer, years later</text><rect x="40.0" y="80.0" width="490.0" height="380.0" rx="14" fill="#dbeafe" stroke="#2f6fb5" stroke-width="2.2"/><text x="285" y="125" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#24292f">Inputs, frozen</text><text x="66" y="180" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#24292f">· bureau report (encrypted, by reference)</text><text x="66" y="236" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#24292f">· identity and fraud results</text><text x="66" y="292" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#24292f">· internal history as of then</text><text x="66" y="348" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#24292f">· the feature vector</text><text x="66" y="404" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#24292f">· which calls were missing</text><rect x="555.0" y="80.0" width="490.0" height="380.0" rx="14" fill="#e6dcfb" stroke="#6b4fc4" stroke-width="2.2"/><text x="800" y="125" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#24292f">Versions</text><text x="581" y="180" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#24292f">· model v9</text><text x="581" y="236" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#24292f">· policy v31 (incl. missing-data table)</text><text x="581" y="292" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#24292f">· pricing v12</text><text x="581" y="348" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#24292f">· disclosure v7</text><text x="581" y="404" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#24292f">· orchestrator build</text><rect x="1070.0" y="80.0" width="490.0" height="380.0" rx="14" fill="#d3f3e6" stroke="#1f8a4c" stroke-width="2.2"/><text x="1315" y="125" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#24292f">Outputs</text><text x="1096" y="180" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#24292f">· outcome and offers</text><text x="1096" y="236" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#24292f">· ranked reasons</text><text x="1096" y="292" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#24292f">· the degraded path taken</text><text x="1096" y="348" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#24292f">· the deadline and timings</text><text x="1096" y="404" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#24292f">· who signed the policy</text><text x="40" y="510" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#173d24">About 50 KB each, written once: 100 GB a month, 8.4 TB over seven years, in encrypted object storage.</text></svg>