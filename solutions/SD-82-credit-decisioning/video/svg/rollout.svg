<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" width="1600" height="500"><rect width="1600" height="500" fill="#ffffff"/><text x="40" y="44" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#24292f">Changing the model: each step can only see what the one before cannot</text><rect x="40.0" y="100.0" width="350.0" height="200.0" rx="14" fill="#dbeafe" stroke="#2f6fb5" stroke-width="2.2"/><text x="215" y="150" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="27" font-weight="800" fill="#24292f">Backtest</text><text x="215" y="200" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#24292f">on labelled history</text><text x="215" y="250" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#3a424a">approval, loss on past loans</text><line x1="392.0" y1="200.0" x2="426.0" y2="200.0" stroke="#8c959f" stroke-width="2.4"/><polygon points="426,200 413.1,205.5 413.1,194.5" fill="#8c959f"/><rect x="430.0" y="100.0" width="350.0" height="200.0" rx="14" fill="#e6dcfb" stroke="#6b4fc4" stroke-width="2.2"/><text x="605" y="150" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="27" font-weight="800" fill="#24292f">Shadow</text><text x="605" y="200" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#24292f">both score, champion acts</text><text x="605" y="250" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#3a424a">approval and reasons by segment</text><line x1="782.0" y1="200.0" x2="816.0" y2="200.0" stroke="#8c959f" stroke-width="2.4"/><polygon points="816,200 803.1,205.5 803.1,194.5" fill="#8c959f"/><rect x="820.0" y="100.0" width="350.0" height="200.0" rx="14" fill="#fdf3e1" stroke="#d18f1c" stroke-width="2.2"/><text x="995" y="150" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="27" font-weight="800" fill="#24292f">Challenger 5 %</text><text x="995" y="200" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#24292f">challenger decides, capped</text><text x="995" y="250" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#3a424a">real labels, first payments</text><line x1="1172.0" y1="200.0" x2="1206.0" y2="200.0" stroke="#8c959f" stroke-width="2.4"/><polygon points="1206,200 1193.1,205.5 1193.1,194.5" fill="#8c959f"/><rect x="1210.0" y="100.0" width="350.0" height="200.0" rx="14" fill="#d3f3e6" stroke="#1f8a4c" stroke-width="2.2"/><text x="1385" y="150" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="27" font-weight="800" fill="#24292f">Widen</text><text x="1385" y="200" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#24292f">a policy version change</text><text x="1385" y="250" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#3a424a">kill switch per version</text><rect x="40.0" y="340.0" width="1520.0" height="80.0" rx="12" fill="#fdecea" stroke="#c8341f" stroke-width="2.2"/><text x="800" y="390" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="800" fill="#5a1308">Shadow cannot measure loss: people the champion declined never got a loan, so they have no label.</text><text x="40" y="470" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#24292f">Signals: first payment missed at 30–45 days, approval parity by group, decline-reason mix. Losses arrive at 90–120 days.</text></svg>