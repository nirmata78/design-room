<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 530" width="1600" height="530"><rect width="1600" height="530" fill="#ffffff"/><text x="40" y="44" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#24292f">Two kinds of features: exact now, or richer and seconds late</text><rect x="40.0" y="90.0" width="740.0" height="360.0" rx="14" fill="#d3f3e6" stroke="#1f8a4c" stroke-width="2.2"/><text x="410" y="135" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="800" fill="#173d24">Inline, on the request path</text><text x="70" y="190" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#24292f">• swipes on this card, last 10 min</text><text x="70" y="245" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#24292f">• card-not-present amount, last hour</text><text x="70" y="300" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#24292f">• declines on this card, last hour</text><text x="70" y="355" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#24292f">→ read and increment: one round trip, ~1 ms</text><rect x="820.0" y="90.0" width="740.0" height="360.0" rx="14" fill="#e6dcfb" stroke="#6b4fc4" stroke-width="2.2"/><text x="1190" y="135" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="800" fill="#2a1d66">From the stream, seconds late</text><text x="850" y="190" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#24292f">• distinct merchants for this card, today</text><text x="850" y="245" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#24292f">• merchant&#x27;s decline rate, last hour</text><text x="850" y="300" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#24292f">• device seen on other cards, 30 days</text><text x="850" y="355" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#24292f">→ computed off the path; read in the same call</text><text x="40" y="500" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#173d24">A burst of fraud is seconds apart; a stream lags by seconds. Log every value with the decision: train on what the model saw.</text></svg>