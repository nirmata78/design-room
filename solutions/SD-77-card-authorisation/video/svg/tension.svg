<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 580" width="1600" height="580"><rect width="1600" height="580" fill="#ffffff"/><text x="40" y="44" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#24292f">Decision quality against the deadline: every signal costs milliseconds</text><line x1="120.0" y1="420.0" x2="1500.0" y2="420.0" stroke="#8c959f" stroke-width="2.5"/><line x1="120.0" y1="420.0" x2="120.0" y2="90.0" stroke="#8c959f" stroke-width="2.5"/><text x="1500" y="460" text-anchor="end" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#57606a">time to answer →</text><text x="106" y="100" text-anchor="end" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#57606a">quality</text><path d="M120.0,330.0 L200.0,250.0 L316.0,165.0 L397.2,140.0 L558.3,128.0 L1251.6,120.0" fill="none" stroke="#2f6fb5" stroke-width="4"/><circle cx="200.0" cy="250" r="8" fill="#2f6fb5"/><text x="216.01620335906972" y="284" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#2f6fb5">rules</text><circle cx="316.0" cy="165" r="8" fill="#2f6fb5"/><text x="331.9988693844941" y="199" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#2f6fb5">+ model</text><circle cx="397.2" cy="140" r="8" fill="#2f6fb5"/><text x="413.18425929334444" y="174" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#2f6fb5">+ aggregates</text><line x1="558.3" y1="80.0" x2="558.3" y2="420.0" stroke="#1f8a4c" stroke-width="3" stroke-dasharray="8 6"/><text x="558.2667954568313" y="490" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#1f8a4c">our target 300 ms</text><line x1="1251.6" y1="80.0" x2="1251.6" y2="420.0" stroke="#c8341f" stroke-widt