<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 550" width="1600" height="550"><rect width="1600" height="550" fill="#ffffff"/><text x="40" y="44" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#24292f">The path of a swipe: who is in the chain, and who decides when we are late</text><rect x="40.0" y="110.0" width="270.0" height="120.0" rx="12" fill="#dbeafe" stroke="#2f6fb5" stroke-width="2.2"/><text x="175" y="160" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="800" fill="#24292f">Till</text><text x="175" y="198" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#24292f">card, wallet</text><rect x="352.0" y="110.0" width="270.0" height="120.0" rx="12" fill="#eceff2" stroke="#8c959f" stroke-width="2.2"/><text x="487" y="160" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="800" fill="#24292f">Acquirer</text><text x="487" y="198" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#24292f">merchant&#x27;s bank</text><line x1="312.0" y1="170.0" x2="348.0" y2="170.0" stroke="#24292f" stroke-width="3"/><rect x="664.0" y="110.0" width="270.0" height="120.0" rx="12" fill="#eceff2" stroke="#8c959f" stroke-width="2.2"/><text x="799" y="160" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="800" fill="#24292f">Card network</text><text x="799" y="198" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#24292f">routes, times out ≈ 2 s</text><line x1="624.0" y1="170.0" x2="660.0" y2="170.0" stroke="#24292f" stroke-width="3"/><rect x="976.0" y="110.0" width="270.0" height="120.0" rx="12" fill="#eceff2" stroke="#8c959f" stroke-width="2.2"/><text x="1111" y="160" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="800" fill="#24292f">Processor</text><text x="1111" y="198" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#24292f">card vault, link</text><line x1="936.0" y1="170.0" x2="972.0" y2="170.0" stroke="#24292f" stroke-width="3"/><rect x="1288.0" y="110.0" width="270.0" height="120.0" rx="12" fill="#e6dcfb" stroke="#6b4fc4" stroke-width="2.2"/><text x="1423" y="160" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="800" fill="#24292f">Us: issuer</text><text x="1423" y="198" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#24292f">decide in 300 ms</text><line x1="1248.0" y1="170.0" x2="1284.0" y2="170.0" stroke="#24292f" stroke-width="3"/><rect x="664.0" y="290.0" width="560.0" height="90.0" rx="10" fill="#fdecea" stroke="#c8341f" stroke-width="2.2"/><text x="944" y="330" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#c8341f">We are late or down: the network stands in</text><text x="944" y="362" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#5a1308">within our pre-set limits, then sends us an advice</text><rect x="40.0" y="430.0" width="1520.0" height="90.0" rx="10" fill="#d3f3e6" stroke="#1f8a4c" stroke-width="2.2"/><text x="800" y="470" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="800" fill="#173d24">Days later, by file: clearing with the real amount, then settlement between banks</text><text x="800" y="502" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#173d24">The money does not move at the till. It moves on the clearing file.</text></svg>