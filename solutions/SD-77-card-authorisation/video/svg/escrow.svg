<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 440" width="1600" height="440"><rect width="1600" height="440" fill="#ffffff"/><text x="40" y="44" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#24292f">A shared business account: sub-limits carved per card</text><rect x="40.0" y="100.0" width="420.0" height="150.0" rx="14" fill="#d3f3e6" stroke="#1f8a4c" stroke-width="2.2"/><text x="250" y="160" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#24292f">Account B-7</text><text x="250" y="200" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#173d24">posted $200,000</text><line x1="462.0" y1="175.0" x2="740.0" y2="125.0" stroke="#8c959f" stroke-width="2.5"/><rect x="740.0" y="80.0" width="360.0" height="90.0" rx="10" fill="#dbeafe" stroke="#2f6fb5" stroke-width="2.2"/><text x="920" y="120" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="800" fill="#24292f">card 1 slice</text><text x="920" y="152" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#2f6fb5">$400 left</text><line x1="462.0" y1="175.0" x2="740.0" y2="235.0" stroke="#8c959f" stroke-width="2.5"/><rect x="740.0" y="190.0" width="360.0" height="90.0" rx="10" fill="#dbeafe" stroke="#2f6fb5" stroke-width="2.2"/><text x="920" y="230" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="800" fill="#24292f">card 2 slice</text><text x="920" y="262" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#2f6fb5">$150 left</text><line x1="462.0" y1="175.0" x2="740.0" y2="345.0" stroke="#8c959f" stroke-width="2.5"/><rect x="740.0" y="300.0" width="360.0" height="90.0" rx="10" fill="#fdecea" stroke="#c8341f" stroke-width="2.2"/><text x="920" y="340" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="800" fill="#24292f">card 2,000 slice</text><text x="920" y="372" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#c8341f">$0: refill</text><rect x="1160.0" y="120.0" width="400.0" height="210.0" rx="12" fill="#f6f8fa" stroke="#8c959f" stroke-width="2.2"/><text x="1360" y="170" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#24292f">Most auths touch only</text><text x="1360" y="200" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#24292f">the card&#x27;s slice</text><text x="1360" y="250" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#24292f">refills move budget</text><text x="1360" y="280" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#24292f">from the account, async</text><text x="40" y="410" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#173d24">2,000 cards × 1 auth per 10 min ≈ 3.3/s on one key: fine for one partition. Slices matter at hundreds a second.</text></svg>