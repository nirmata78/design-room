<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" width="1600" height="520"><rect width="1600" height="520" fill="#ffffff"/><text x="40" y="44" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#24292f">A rule&#x27;s lifecycle: fast, measured, and undoable</text><rect x="40.0" y="100.0" width="280.0" height="150.0" rx="12" fill="#dbeafe" stroke="#2f6fb5" stroke-width="2.2"/><text x="180" y="160" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#24292f">Write</text><text x="180" y="200" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#24292f">an expression</text><text x="180" y="228" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#24292f">an owner</text><rect x="352.0" y="100.0" width="280.0" height="150.0" rx="12" fill="#dbeafe" stroke="#2f6fb5" stroke-width="2.2"/><text x="492" y="160" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#24292f">Backtest</text><text x="492" y="200" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#24292f">90 days of the archive</text><text x="492" y="228" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#24292f">with labels</text><line x1="320.0" y1="175.0" x2="348.0" y2="175.0" stroke="#24292f" stroke-width="3"/><rect x="664.0" y="100.0" width="280.0" height="150.0" rx="12" fill="#fdf3e1" stroke="#d18f1c" stroke-width="2.2"/><text x="804" y="160" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#24292f">Shadow</text><text x="804" y="200" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#24292f">live</text><text x="804" y="228" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#24292f">logged</text><line x1="632.0" y1="175.0" x2="660.0" y2="175.0" stroke="#24292f" stroke-width="3"/><rect x="976.0" y="100.0" width="280.0" height="150.0" rx="12" fill="#fdf3e1" stroke="#d18f1c" stroke-width="2.2"/><text x="1116" y="160" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#24292f">Slice</text><text x="1116" y="200" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#24292f">5 %</text><text x="1116" y="228" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#24292f">decline-rate alarm</text><line x1="944.0" y1="175.0" x2="972.0" y2="175.0" stroke="#24292f" stroke-width="3"/><rect x="1288.0" y="100.0" width="280.0" height="150.0" rx="12" fill="#d3f3e6" stroke="#1f8a4c" stroke-width="2.2"/><text x="1428" y="160" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#24292f">Enforce</text><text x="1428" y="200" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#24292f">everywhere</text><text x="1428" y="228" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#24292f">kill switch</text><line x1="1256.0" y1="175.0" x2="1284.0" y2="175.0" stroke="#24292f" stroke-width="3"/><rect x="40.0" y="300.0" width="1520.0" height="80.0" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-width="2.2"/><text x="800" y="350" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#24292f">Every decision records the rule-set version. Rollback = re-point to the previous version: seconds, no deploy.</text><rect x="40.0" y="410.0" width="1520.0" height="80.0" rx="10" fill="#fdecea" stroke="#c8341f" stroke-width="2.2"/><text x="800" y="460" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#5a1308">Shadow shows how many it would decline, not which were fraud: labels arrive in 30–90 days.</text></svg>