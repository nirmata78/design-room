<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 490" width="1600" height="490"><rect width="1600" height="490" fill="#ffffff"/><text x="40" y="44" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#24292f">Stale is not open: the node keeps enforcing what it has</text><line x1="120.0" y1="330.0" x2="120.0" y2="344.0" stroke="#8c959f" stroke-width="2"/><text x="120.0" y="374" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#57606a">0 min</text><line x1="198.0" y1="330.0" x2="198.0" y2="344.0" stroke="#8c959f" stroke-width="2"/><text x="198.0" y="374" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#57606a">15 min</text><line x1="432.0" y1="330.0" x2="432.0" y2="344.0" stroke="#8c959f" stroke-width="2"/><text x="432.0" y="374" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#57606a">60 min</text><line x1="744.0" y1="330.0" x2="744.0" y2="344.0" stroke="#8c959f" stroke-width="2"/><text x="744.0" y="374" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#57606a">120 min</text><line x1="1056.0" y1="330.0" x2="1056.0" y2="344.0" stroke="#8c959f" stroke-width="2"/><text x="1056.0" y="374" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#57606a">180 min</text><line x1="1368.0" y1="330.0" x2="1368.0" y2="344.0" stroke="#8c959f" stroke-width="2"/><text x="1368.0" y="374" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#57606a">240 min</text><line x1="120.0" y1="337.0" x2="1368.0" y2="337.0" stroke="#8c959f" stroke-width="2"/><rect x="120.0" y="120.0" width="78.0" height="60.0" rx="8" fill="#d3f3e6" stroke="#1f8a4c" stroke-width="2.2"/><text x="159.0" y="108" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f8a4c">fresh</text><rect x="198.0" y="120.0" width="234.0" height="60.0" rx="8" fill="#fdf3e1" stroke="#d18f1c" stroke-width="2.2"/><text x="312.4" y="208" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#4a3207">past 15 min: alert</text><rect x="432.0" y="120.0" width="936.0" height="60.0" rx="8" fill="#fdecea" stroke="#c8341f" stroke-width="2.2"/><text x="900.0" y="108" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#c8341f">past 60 min: drain, capped at 5 %</text><text x="40" y="270" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#24292f">Every stage: the node still blocks every ban it knew about. Only the newest bans are missing.</text><text x="40" y="440" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#57606a">The owner signs the bound and the action per list. The cap keeps a control-plane outage from becoming a fleet outage.</text></svg>