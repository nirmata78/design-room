<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 530" width="1600" height="530"><rect width="1600" height="530" fill="#ffffff"/><text x="40" y="44" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#24292f">Freshness against blast radius: one slider, set per push</text><rect x="120.0" y="150.0" width="1360.0" height="24.0" rx="12" fill="#eef1f4" stroke="#8c959f" stroke-width="2.2"/><line x1="228.8" y1="120.0" x2="228.8" y2="182.0" stroke="#c8341f" stroke-width="5"/><text x="228.8" y="100" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#c8341f">no gates</text><text x="228.8" y="226" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#24292f">18 s to everyone</text><line x1="732.0" y1="120.0" x2="732.0" y2="182.0" stroke="#d18f1c" stroke-width="5"/><text x="732.0" y="100" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#d18f1c">urgent ban</text><text x="732.0" y="226" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#24292f">one region, 60 s bake</text><line x1="1344.0" y1="120.0" x2="1344.0" y2="182.0" stroke="#1f8a4c" stroke-width="5"/><text x="1344.0" y="100" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#1f8a4c">routine push</text><text x="1344.0" y="226" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#24292f">5 % → 25 % → all, ~10 min</text><text x="120" y="290" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#2f6fb5">Fast</text><text x="120" y="324" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="500" fill="#24292f">a ban lands quickly</text><text x="120" y="356" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#c8341f">a mistake lands just as quickly</text><text x="1480" y="290" text-anchor="end" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#2f6fb5">Slow</text><text x="1480" y="324" text-anchor="end" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#173d24">a mistake is caught on a canary</text><text x="1480" y="356" text-anchor="end" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#c8341f">a ban waits for the bake</text><rect x="120.0" y="410.0" width="1360.0" height="80.0" rx="8" fill="#fdf3e1" stroke="#d18f1c" stroke-width="2.2"/><text x="800.0" y="460" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="27" font-weight="800" fill="#4a3207">The pipe cannot tell a ban from a mistake. The owner picks the position, per push.</text></svg>