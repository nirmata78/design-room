<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" width="1600" height="520"><rect width="1600" height="520" fill="#ffffff"/><text x="40" y="44" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#24292f">Versions form a chain: each checksum covers its content and the one before</text><rect x="60.0" y="110.0" width="280.0" height="110.0" rx="12" fill="#d3f3e6" stroke="#1f8a4c" stroke-width="2.2"/><text x="200" y="156" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#24292f">version 8,360,998</text><text x="200" y="196" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#173d24">checksum = H(prev, content)</text><rect x="460.0" y="110.0" width="280.0" height="110.0" rx="12" fill="#d3f3e6" stroke="#1f8a4c" stroke-width="2.2"/><text x="600" y="156" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#24292f">version 8,360,999</text><text x="600" y="196" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#173d24">checksum = H(prev, content)</text><rect x="860.0" y="110.0" width="280.0" height="110.0" rx="12" fill="#d3f3e6" stroke="#1f8a4c" stroke-width="2.2"/><text x="1000" y="156" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#24292f">version 8,361,000</text><text x="1000" y="196" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#173d24">checksum = H(prev, content)</text><rect x="1260.0" y="110.0" width="280.0" height="110.0" rx="12" fill="#d3f3e6" stroke="#1f8a4c" stroke-width="2.2"/><text x="1400" y="156" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#24292f">version 8,361,001</text><text x="1400" y="196" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#173d24">checksum = H(prev, content)</text><line x1="340.0" y1="165.0" x2="460.0" y2="165.0" stroke="#1f8a4c" stroke-width="3.5"/><line x1="740.0" y1="165.0" x2="860.0" y2="165.0" stroke="#1f8a4c" stroke-width="3.5"/><line x1="1140.0" y1="165.0" x2="1260.0" y2="165.0" stroke="#1f8a4c" stroke-width="3.5"/><rect x="60.0" y="290.0" width="1480.0" height="60.0" rx="8" fill="#dbeafe" stroke="#2f6fb5" stroke-width="2.2" stroke-dasharray="10 6"/><text x="800" y="330" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#0b2540">delta window: the last 24 h of deltas (≈ 130 MB at the burst rate)</text><text x="60" y="420" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#24292f">Node has 8,360,998:</text><text x="330" y="420" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="500" fill="#24292f">inside the window → three small deltas, each verified before it is applied.</text><text x="60" y="470" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#c8341f">Node older than the window, or a checksum fails:</text><text x="740" y="470" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="500" fill="#24292f">one full snapshot, verified, then swapped.</text></svg>