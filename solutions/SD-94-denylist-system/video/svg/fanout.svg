<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 510" width="1600" height="510"><rect width="1600" height="510" fill="#ffffff"/><text x="40" y="44" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#24292f">Without a tree, 100,000 full downloads. With one, the origin serves 20.</text><rect x="120.0" y="150.0" width="220.0" height="130.0" rx="12" fill="#e6dcfb" stroke="#6b4fc4" stroke-width="2.2"/><text x="230" y="205" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#24292f">Origin</text><text x="230" y="250" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#6b4fc4">1</text><rect x="520.0" y="150.0" width="220.0" height="130.0" rx="12" fill="#dbeafe" stroke="#2f6fb5" stroke-width="2.2"/><text x="630" y="205" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#24292f">Regional relays</text><text x="630" y="250" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#2f6fb5">20</text><rect x="920.0" y="150.0" width="220.0" height="130.0" rx="12" fill="#dbeafe" stroke="#2f6fb5" stroke-width="2.2"/><text x="1030" y="205" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#24292f">Zone relays</text><text x="1030" y="250" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#2f6fb5">200</text><rect x="1320.0" y="150.0" width="220.0" height="130.0" rx="12" fill="#d3f3e6" stroke="#1f8a4c" stroke-width="2.2"/><text x="1430" y="205" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#24292f">Nodes</text><text x="1430" y="250" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#1f8a4c">100,000</text><line x1="340.0" y1="215.0" x2="520.0" y2="215.0" stroke="#8c959f" stroke-width="3"/><line x1="740.0" y1="215.0" x2="920.0" y2="215.0" stroke="#8c959f" stroke-width="3"/><line x1="1140.0" y1="215.0" x2="1320.0" y2="215.0" stroke="#8c959f" stroke-width="3"/><text x="430" y="190" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#24292f">×20</text><text x="830" y="190" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#24292f">×10 each</text><text x="1230" y="190" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#24292f">×500 each</text><text x="40" y="360" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#24292f">Snapshot 40 MB.  Direct: 100,000 × 40 MB = 4 TB.  Through the tree: origin → 20 regionals = 800 MB.</text><text x="40" y="410" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="600" fill="#57606a">Zone relays cache immutable, content-addressed files, so 500 nodes cost one fetch.</text><text x="40" y="460" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="600" fill="#57606a">A manifest poll is about 100 bytes: 10,000 polls a second is about 1 MB a second across the fleet.</text></svg>