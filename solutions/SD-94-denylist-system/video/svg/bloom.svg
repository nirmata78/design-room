<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 530" width="1600" height="530"><rect width="1600" height="530" fill="#ffffff"/><text x="40" y="44" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#24292f">A filter in front: not listed is certain, maybe needs a check</text><rect x="60.0" y="130.0" width="240.0" height="110.0" rx="12" fill="#dbeafe" stroke="#2f6fb5" stroke-width="2.2"/><text x="180" y="195" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#24292f">request</text><rect x="420.0" y="130.0" width="300.0" height="110.0" rx="12" fill="#fdf3e1" stroke="#d18f1c" stroke-width="2.2"/><text x="570" y="178" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#24292f">local filter</text><text x="570" y="214" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#4a3207">125 MB, ~1 % false positives</text><rect x="880.0" y="40.0" width="300.0" height="90.0" rx="12" fill="#d3f3e6" stroke="#1f8a4c" stroke-width="2.2"/><text x="1030" y="96" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#0d3b2a">not listed: allow</text><rect x="880.0" y="240.0" width="300.0" height="110.0" rx="12" fill="#e6dcfb" stroke="#6b4fc4" stroke-width="2.2"/><text x="1030" y="290" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#24292f">exact lookup tier</text><text x="1030" y="324" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#2a1d66">sharded, regional</text><rect x="1300.0" y="240.0" width="260.0" height="110.0" rx="12" fill="#fdecea" stroke="#c8341f" stroke-width="2.2"/><text x="1430" y="288" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#5a1308">listed: deny</text><text x="1430" y="322" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#5a1308">else allow, cache</text><line x1="300.0" y1="185.0" x2="420.0" y2="185.0" stroke="#24292f" stroke-width="3"/><line x1="720.0" y1="160.0" x2="880.0" y2="90.0" stroke="#1f8a4c" stroke-width="3"/><line x1="720.0" y1="210.0" x2="880.0" y2="285.0" stroke="#6b4fc4" stroke-width="3"/><line x1="1180.0" y1="295.0" x2="1300.0" y2="295.0" stroke="#c8341f" stroke-width="3"/><text x="800" y="130" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#1f8a4c">99 %</text><text x="790" y="270" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#6b4fc4">~1 % + true hits</text><text x="60" y="440" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#5a1308">Used alone, 1 % of 1 M requests a second is 10,000 real users blocked every second.</text><text x="60" y="480" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#173d24">Behind an exact check, a false positive costs one lookup, not a wrong block.</text></svg>