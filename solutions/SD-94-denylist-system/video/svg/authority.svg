<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" width="1600" height="500"><rect width="1600" height="500" fill="#ffffff"/><text x="40" y="44" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#24292f">A slow lookup API cannot sit on the request path, and cannot cover everything</text><text x="40" y="150" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#24292f">New addresses</text><rect x="360.0" y="120.0" width="1100.0" height="50.0" rx="8" fill="#fdecea" stroke="#c8341f" stroke-width="2.2"/><text x="1450.0" y="155" text-anchor="end" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#c8341f">20,000 / s</text><text x="40" y="250" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#24292f">API budget</text><rect x="360.0" y="220.0" width="5.5" height="50.0" rx="8" fill="#d3f3e6" stroke="#1f8a4c" stroke-width="2.2"/><text x="379.5" y="255" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#1f8a4c">100 / s</text><text x="40" y="400" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#5a1308">200 times over. At 100 a second, a day buys 8.6 M lookups against about 50 M distinct addresses: 17 % coverage.</text><text x="40" y="450" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#173d24">So: mirror a bulk list if one exists; spend the budget on the highest-volume addresses; say what first-seen means.</text></svg>