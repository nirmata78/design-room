<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640"><defs><marker id="ah1f2328" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="ah1f6feb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6feb"/></marker><marker id="ahcf222e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker><marker id="ah1a7f37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="ahbf8700" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bf8700"/></marker><marker id="ah8c959f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker><marker id="ah57606a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="ah6e8fb5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e8fb5"/></marker><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#eef1f4"/><line x1="0" y1="0" x2="0" y2="12" stroke="#a7b0ba" stroke-width="5"/></pattern><pattern id="hatchred" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#fdeef0"/><line x1="0" y1="0" x2="0" y2="12" stroke="#e8a0a8" stroke-width="5"/></pattern><pattern id="hatchamber" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#fff6e0"/><line x1="0" y1="0" x2="0" y2="12" stroke="#e5c56b" stroke-width="5"/></pattern></defs><rect width="1600" height="640" fill="#fff"/><text x="40.0" y="50.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" fill="#1f2328" text-anchor="start" font-weight="700">A replica two days behind: 864 million writes to apply</text><text x="40.0" y="185.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" fill="#1f2328" text-anchor="start" font-weight="800">Catch up</text><text x="330.0" y="252.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" fill="#57606a" text-anchor="start" font-weight="400">replay 20,000 a second, while 5,000 a second still arrive</text><rect x="330.0" y="150.0" width="1115.2" height="70.0" rx="6" fill="#bf8700"/><text x="887.6" y="193.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" fill="#1f2328" text-anchor="middle" font-weight="600">net 15,000 a second → about 16 hours</text><text x="40.0" y="385.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" fill="#1f2328" text-anchor="start" font-weight="800">Rebuild</text><text x="330.0" y="452.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" fill="#57606a" text-anchor="start" font-weight="400">copy a 2 TB snapshot at 200 MB a second</text><rect x="330.0" y="350.0" width="195.2" height="70.0" rx="6" fill="#1a7f37"/><text x="427.6" y="393.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" fill="#fff" text-anchor="middle" font-weight="600">2.8 h</text><rect x="525.2" y="350.0" width="41.8" height="70.0" rx="6" fill="url(#hatch)" stroke="#1a7f37" stroke-width="2"/><text x="583.0" y="395.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#1a7f37" text-anchor="start" font-weight="700">then replay only what arrived during the copy</text><line x1="330.0" y1="520.0" x2="1480.0" y2="520.0" stroke="#57606a" stroke-width="2" marker-end="url(#ah57606a)"/><line x1="330.0" y1="512.0" x2="330.0" y2="528.0" stroke="#57606a" stroke-width="2"/><text x="330.0" y="554.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" fill="#57606a" text-anchor="middle" font-weight="400">0 h</text><line x1="608.8" y1="512.0" x2="608.8" y2="528.0" stroke="#57606a" stroke-width="2"/><text x="608.8" y="554.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" fill="#57606a" text-anchor="middle" font-weight="400">4 h</text><line x1="887.6" y1="512.0" x2="887.6" y2="528.0" stroke="#57606a" stroke-width="2"/><text x="887.6" y="554.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" fill="#57606a" text-anchor="middle" font-weight="400">8 h</text><line x1="1166.4" y1="512.0" x2="1166.4" y2="528.0" stroke="#57606a" stroke-width="2"/><text x="1166.4" y="554.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" fill="#57606a" text-anchor="middle" font-weight="400">12 h</text><line x1="1445.2" y1="512.0" x2="1445.2" y2="528.0" stroke="#57606a" stroke-width="2"/><text x="1445.2" y="554.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" fill="#57606a" text-anchor="middle" font-weight="400">16 h</text><text x="40.0" y="610.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">Catch-up is possible at all only if the leader still holds <tspan font-weight="800">two days of log</tspan>.</text></svg>
