" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#fff6e0"/><line x1="0" y1="0" x2="0" y2="12" stroke="#e5c56b" stroke-width="5"/></pattern></defs><rect width="1600" height="700" fill="#fff"/><text x="40.0" y="50.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" fill="#1f2328" text-anchor="start" font-weight="700">User-facing p99 target: 1,000 ms</text><text x="40.0" y="164.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" fill="#1f2328" text-anchor="start" font-weight="700">Front end</text><line x1="230.0" y1="155.0" x2="1530.0" y2="155.0" stroke="#e3e8ee" stroke-width="2"/><rect x="230.0" y="130.0" width="260.0" height="50.0" rx="6" fill="#8c959f"/><text x="360.0" y="162.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" fill="#fff" text-anchor="middle" font-weight="600">200 ms</text><text x="504.0" y="163.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" fill="#57606a" text-anchor="start" font-weight="400">keeps 200 ms for itself</text><text x="40.0" y="264.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" fill="#1f2328" text-anchor="start" font-weight="700">Service A</text><line x1="230.0" y1="255.0" x2="1530.0" y2="255.0" stroke="#e3e8ee" stroke-width="2"/><rect x="490.0" y="230.0" width="65.0" height="50.0" rx="6" fill="#1f6feb"/><text x="522.5" y="262.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" fill="#fff" text-anchor="middle" font-weight="600">50 ms</text><text x="569.0" y="263.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" fill="#57606a" text-anchor="start" font-weight="400">own work 50 ms → calls B with 750 ms left</text><text x="40.0" y="364.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" fill="#1f2328" text-anchor="start" font-weight="700">Service B</text><line x1="230.0" y1="355.0" x2="1530.0" y2="355.0" stroke="#e3e8ee" stroke-width="2"/><rect x="555.0" y="330.0" width="104.0" height="50.0" rx="6" fill="#1f6feb"/><text x="607.0" y="362.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" fill="#fff" text-anchor="middle" font-weight="600">80 ms</text><text x="673.0" y="363.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" fill="#57606a" text-anchor="start" font-weight="400">own work 80 ms → calls C with 670 ms left</text><text x="40.0" y="464.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" fill="#1f2328" text-anchor="start" font-weight="700">Service C</text><line x1="230.0" y1="455.0" x2="1530.0" y2="455.0" stroke="#e3e8ee" stroke-width="2"/><rect x="659.0" y="430.0" width="390.0" height="50.0" rx="6" fill="#1a7f37"/><text x="854.0" y="462.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" fill="#fff" text-anchor="middle" font-weight="600">300 ms query: fits</text><text x="1063.0" y="463.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" fill="#57606a" text-anchor="start" font-weight="400"></text><rect x="1049.0" y="430.0" width="481.0" height="50.0" rx="6" fill="url(#hatch)" stroke="#1a7f37" stroke-width="2"/><text x="1409.5" y="523.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" fill="#1a7f37" text-anchor="middle" font-weight="700">370 ms spare</text><line x1="1530.0" y1="110.0" x2="1530.0" y2="560.0" stroke="#cf222e" stroke-width="3" stroke-dasharray="10 7"/><text x="1530.0" y="100.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#cf222e" text-anchor="middle" font-weight="800">deadline</text><line x1="230.0" y1="600.0" x2="1560.0" y2="600.0" stroke="#57606a" stroke-width="2" marker-end="url(#ah57606a)"/><line x1="230.0" y1="592.0" x2="230.0" y2="608.0" stroke="#57606a" stroke-width="2"/><text x="230.0" y="634.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" fill="#57606a" text-anchor="middle" font-weight="400">0 ms</text><line x1="490.0" y1="592.0" x2="490.0" y2="608.0" stroke="#57606a" stroke-width="2"/><text x="490.0" y="634.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" fill="#57606a" text-anchor="middle" font-weight="400">200 ms</text><line x1="750.0" y1="592.0" x2="750.0" y2="608.0" stroke="#57606a" stroke-width="2"/><text x="750.0" y="634.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" fill="#57606a" text-anchor="middle" font-weight="400">400 ms</text><line x1="1010.0" y1="592.0" x2="1010.0" y2="608.0" stroke="#57606a" stroke-width="2"/><text x="1010.0" y="634.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" fill="#57606a" text-anchor="middle" font-weight="400">600 ms</text><line x1="1270.0" y1="592.0" x2="1270.0" y2="608.0" stroke="#57606a" stroke-width="2"/><text x="1270.0" y="634.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" fill="#57606a" text-anchor="middle" font-weight="400">800 ms</text><line x1="1530.0" y1="592.0" x2="1530.0" y2="608.0" stroke="#57606a" stroke-width="2"/><text x="1530.0" y="634.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" fill="#57606a" text-anchor="middle" font-weight="400">1000 ms</text><text x="40.0" y="680.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#1f2328" text-anchor="start" font-weight="400">If C takes 700 ms, B&#x27;s deadline passes first: B returns DEADLINE_EXCEEDED, and A does <tspan font-weight="800">not</tspan> retry. No time is left.</text></svg>
