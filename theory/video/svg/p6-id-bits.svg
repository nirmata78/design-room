<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620"><defs><marker id="ah1f2328" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="ah1f6feb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6feb"/></marker><marker id="ahcf222e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker><marker id="ah1a7f37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="ahbf8700" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bf8700"/></marker><marker id="ah8c959f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker><marker id="ah57606a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="ah6e8fb5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e8fb5"/></marker><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#eef1f4"/><line x1="0" y1="0" x2="0" y2="12" stroke="#a7b0ba" stroke-width="5"/></pattern><pattern id="hatchred" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#fdeef0"/><line x1="0" y1="0" x2="0" y2="12" stroke="#e8a0a8" stroke-width="5"/></pattern><pattern id="hatchamber" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#fff6e0"/><line x1="0" y1="0" x2="0" y2="12" stroke="#e5c56b" stroke-width="5"/></pattern></defs><rect width="1600" height="620" fill="#fff"/><text x="50.0" y="50.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" fill="#1f2328" text-anchor="start" font-weight="700">One 64-bit ID: time, then worker, then a counter</text><rect x="50.0" y="100.0" width="23.4" height="110.0" rx="6" fill="#eef1f4" stroke="#8c959f" stroke-width="3"/><text x="50.0" y="88.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" fill="#57606a" text-anchor="start" font-weight="400">1 sign bit</text><rect x="73.4" y="100.0" width="960.9" height="110.0" rx="6" fill="#ddeaf8" stroke="#1f6feb" stroke-width="3"/><text x="553.9" y="150.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" fill="#1f6feb" text-anchor="middle" font-weight="800">41 bits</text><text x="553.9" y="185.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" fill="#1f2328" text-anchor="middle" font-weight="400">milliseconds since a custom epoch</text><text x="553.9" y="250.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" fill="#1f6feb" text-anchor="middle" font-weight="700">2⁴¹ ms ≈ 69 years</text><rect x="1034.4" y="100.0" width="234.4" height="110.0" rx="6" fill="#fff4d6" stroke="#bf8700" stroke-width="3"/><text x="1151.6" y="150.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" fill="#bf8700" text-anchor="middle" font-weight="800">10 bits</text><text x="1151.6" y="185.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" fill="#1f2328" text-anchor="middle" font-weight="400">worker</text><text x="1151.6" y="250.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" fill="#bf8700" text-anchor="middle" font-weight="700">1,024 workers</text><rect x="1268.8" y="100.0" width="281.2" height="110.0" rx="6" fill="#dff3e4" stroke="#1a7f37" stroke-width="3"/><text x="1409.4" y="150.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" fill="#1a7f37" text-anchor="middle" font-weight="800">12 bits</text><text x="1409.4" y="185.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" fill="#1f2328" text-anchor="middle" font-weight="400">sequence</text><text x="1409.4" y="250.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" fill="#1a7f37" text-anchor="middle" font-weight="700">4,096 per ms per worker</text><text x="50.0" y="330.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">≈ 4 million IDs a second per worker · unique with no coordination · roughly ordered by time</text><text x="50.0" y="420.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" fill="#1f2328" text-anchor="start" font-weight="800">Alternatives</text><text x="50.0" y="465.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#1f2328" text-anchor="start" font-weight="400"><tspan font-weight="800">UUID version 7</tspan> (standardised in RFC 9562, 2024): 48 bits of milliseconds, then random bits. No worker IDs to assign.</text><text x="50.0" y="510.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#1f2328" text-anchor="start" font-weight="400"><tspan font-weight="800">Leased ranges</tspan>: a worker takes IDs 1,000,000 to 1,009,999 from a central counter, and hands them out locally.</text></svg>
