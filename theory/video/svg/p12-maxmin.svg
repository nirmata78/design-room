<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640"><defs><marker id="ah1f2328" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="ah1f6feb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6feb"/></marker><marker id="ahcf222e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker><marker id="ah1a7f37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="ahbf8700" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bf8700"/></marker><marker id="ah8c959f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker><marker id="ah57606a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="ah6e8fb5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e8fb5"/></marker><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#eef1f4"/><line x1="0" y1="0" x2="0" y2="12" stroke="#a7b0ba" stroke-width="5"/></pattern><pattern id="hatchred" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#fdeef0"/><line x1="0" y1="0" x2="0" y2="12" stroke="#e8a0a8" stroke-width="5"/></pattern><pattern id="hatchamber" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#fff6e0"/><line x1="0" y1="0" x2="0" y2="12" stroke="#e5c56b" stroke-width="5"/></pattern></defs><rect width="1600" height="640" fill="#fff"/><text x="40.0" y="50.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" fill="#1f2328" text-anchor="start" font-weight="700">Capacity 100. Tenants want 10, 30 and 80.</text><rect x="260.0" y="494.0" width="220.0" height="46.0" rx="6" fill="#fff" stroke="#57606a" stroke-width="2.5" stroke-dasharray="8 6"/><rect x="260.0" y="494.0" width="220.0" height="46.0" rx="6" fill="#1a7f37"/><text x="370.0" y="524.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#fff" text-anchor="middle" font-weight="600">wants 10, gets 10</text><text x="370.0" y="580.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" fill="#1f2328" text-anchor="middle" font-weight="700">tenant A</text><rect x="640.0" y="402.0" width="220.0" height="138.0" rx="6" fill="#fff" stroke="#57606a" stroke-width="2.5" stroke-dasharray="8 6"/><rect x="640.0" y="402.0" width="220.0" height="138.0" rx="6" fill="#1a7f37"/><text x="750.0" y="478.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#fff" text-anchor="middle" font-weight="600">wants 30, gets 30</text><text x="750.0" y="580.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" fill="#1f2328" text-anchor="middle" font-weight="700">tenant B</text><rect x="1020.0" y="172.0" width="220.0" height="368.0" rx="6" fill="#fff" stroke="#57606a" stroke-width="2.5" stroke-dasharray="8 6"/><rect x="1020.0" y="264.0" width="220.0" height="276.0" rx="6" fill="#1a7f37"/><text x="1130.0" y="409.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#fff" text-anchor="middle" font-weight="600">gets 60</text><text x="1130.0" y="158.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#57606a" text-anchor="middle" font-weight="700">wants 80</text><text x="1130.0" y="580.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" fill="#1f2328" text-anchor="middle" font-weight="700">tenant C</text><line x1="200.0" y1="386.8" x2="1250.0" y2="386.8" stroke="#bf8700" stroke-width="3" stroke-dasharray="12 8"/><text x="1262.0" y="394.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#bf8700" text-anchor="start" font-weight="700">equal split: 33 each</text><line x1="200.0" y1="540.0" x2="1400.0" y2="540.0" stroke="#57606a" stroke-width="2"/><text x="800.0" y="620.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#1f2328" text-anchor="middle" font-weight="400">Fill the smallest demands first; share what is left equally. Nobody can gain without taking from someone smaller.</text></svg>
