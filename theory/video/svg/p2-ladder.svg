<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800"><defs><marker id="ah1f2328" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="ah1f6feb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6feb"/></marker><marker id="ahcf222e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker><marker id="ah1a7f37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="ahbf8700" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bf8700"/></marker><marker id="ah8c959f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker><marker id="ah57606a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="ah6e8fb5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e8fb5"/></marker><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#eef1f4"/><line x1="0" y1="0" x2="0" y2="12" stroke="#a7b0ba" stroke-width="5"/></pattern><pattern id="hatchred" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#fdeef0"/><line x1="0" y1="0" x2="0" y2="12" stroke="#e8a0a8" stroke-width="5"/></pattern><pattern id="hatchamber" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#fff6e0"/><line x1="0" y1="0" x2="0" y2="12" stroke="#e5c56b" stroke-width="5"/></pattern></defs><rect width="1600" height="800" fill="#fff"/><rect x="190.0" y="40.0" width="690.0" height="104.0" rx="10" fill="#fde7e9" stroke="#cf222e" stroke-width="2.5"/><text x="212.0" y="80.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#1f2328" text-anchor="start" font-weight="400"><tspan font-weight="800">Linearizable</tspan> · everyone sees a write the instant it completes</text><text x="212.0" y="120.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" fill="#57606a" text-anchor="start" font-weight="400">consensus group, reads via the leader</text><rect x="308.0" y="162.0" width="690.0" height="104.0" rx="10" fill="#fff4d6" stroke="#bf8700" stroke-width="2.5"/><text x="330.0" y="202.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#1f2328" text-anchor="start" font-weight="400"><tspan font-weight="800">Causal</tspan> · never an answer before its question</text><text x="330.0" y="242.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" fill="#57606a" text-anchor="start" font-weight="400">version vectors, dependency tracking</text><rect x="426.0" y="284.0" width="690.0" height="104.0" rx="10" fill="#fff4d6" stroke="#bf8700" stroke-width="2.5"/><text x="448.0" y="324.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#1f2328" text-anchor="start" font-weight="400"><tspan font-weight="800">Read-your-writes</tspan> · you always see your own changes</text><text x="448.0" y="364.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" fill="#57606a" text-anchor="start" font-weight="400">session carries its last version</text><rect x="544.0" y="406.0" width="690.0" height="104.0" rx="10" fill="#ddeaf8" stroke="#1f6feb" stroke-width="2.5"/><text x="566.0" y="446.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#1f2328" text-anchor="start" font-weight="400"><tspan font-weight="800">Monotonic reads</tspan> · time never goes backwards for you</text><text x="566.0" y="486.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" fill="#57606a" text-anchor="start" font-weight="400">pin the session to one replica</text><rect x="662.0" y="528.0" width="690.0" height="104.0" rx="10" fill="#ddeaf8" stroke="#1f6feb" stroke-width="2.5"/><text x="684.0" y="568.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#1f2328" text-anchor="start" font-weight="400"><tspan font-weight="800">Bounded staleness</tspan> · at most N seconds old</text><text x="684.0" y="608.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" fill="#57606a" text-anchor="start" font-weight="400">replica within a lag limit</text><rect x="780.0" y="650.0" width="690.0" height="104.0" rx="10" fill="#dff3e4" stroke="#1a7f37" stroke-width="2.5"/><text x="802.0" y="690.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#1f2328" text-anchor="start" font-weight="400"><tspan font-weight="800">Eventual</tspan> · the same, some time after writes stop</text><text x="802.0" y="730.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" fill="#57606a" text-anchor="start" font-weight="400">asynchronous replication</text><line x1="110.0" y1="760.0" x2="110.0" y2="50.0" stroke="#cf222e" stroke-width="4" marker-end="url(#ahcf222e)"/><text x="80.0" y="405.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#cf222e" text-anchor="middle" font-weight="700" transform="rotate(-90 80 405)">stronger · more replicas agree · slower</text><text x="1560.0" y="790.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#1a7f37" text-anchor="end" font-weight="700">weaker · cheaper · faster →</text></svg>
