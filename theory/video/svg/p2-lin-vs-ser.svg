<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780"><defs><marker id="ah1f2328" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="ah1f6feb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6feb"/></marker><marker id="ahcf222e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker><marker id="ah1a7f37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="ahbf8700" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bf8700"/></marker><marker id="ah8c959f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker><marker id="ah57606a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="ah6e8fb5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e8fb5"/></marker><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#eef1f4"/><line x1="0" y1="0" x2="0" y2="12" stroke="#a7b0ba" stroke-width="5"/></pattern><pattern id="hatchred" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#fdeef0"/><line x1="0" y1="0" x2="0" y2="12" stroke="#e8a0a8" stroke-width="5"/></pattern><pattern id="hatchamber" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#fff6e0"/><line x1="0" y1="0" x2="0" y2="12" stroke="#e5c56b" stroke-width="5"/></pattern></defs><rect width="1600" height="780" fill="#fff"/><text x="40.0" y="50.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" fill="#1f2328" text-anchor="start" font-weight="700">Linearizable · single operations, real-time order</text><text x="260.0" y="330.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" fill="#57606a" text-anchor="middle" font-weight="400">t = 0</text><line x1="260.0" y1="300.0" x2="260.0" y2="308.0" stroke="#57606a" stroke-width="2"/><text x="390.0" y="330.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" fill="#57606a" text-anchor="middle" font-weight="400">t = 1</text><line x1="390.0" y1="300.0" x2="390.0" y2="308.0" stroke="#57606a" stroke-width="2"/><text x="520.0" y="330.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" fill="#57606a" text-anchor="middle" font-weight="400">t = 2</text><line x1="520.0" y1="300.0" x2="520.0" y2="308.0" stroke="#57606a" stroke-width="2"/><text x="650.0" y="330.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" fill="#57606a" text-anchor="middle" font-weight="400">t = 3</text><line x1="650.0" y1="300.0" x2="650.0" y2="308.0" stroke="#57606a" stroke-width="2"/><text x="780.0" y="330.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" fill="#57606a" text-anchor="middle" font-weight="400">t = 4</text><line x1="780.0" y1="300.0" x2="780.0" y2="308.0" stroke="#57606a" stroke-width="2"/><text x="910.0" y="330.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" fill="#57606a" text-anchor="middle" font-weight="400">t = 5</text><line x1="910.0" y1="300.0" x2="910.0" y2="308.0" stroke="#57606a" stroke-width="2"/><text x="1040.0" y="330.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" fill="#57606a" text-anchor="middle" font-weight="400">t = 6</text><line x1="1040.0" y1="300.0" x2="1040.0" y2="308.0" stroke="#57606a" stroke-width="2"/><line x1="260.0" y1="300.0" x2="1079.0" y2="300.0" stroke="#57606a" stroke-width="2" marker-end="url(#ah57606a)"/><text x="40.0" y="135.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#1f2328" text-anchor="start" font-weight="600">Client A</text><line x1="260.0" y1="128.0" x2="1079.0" y2="128.0" stroke="#d0d7de" stroke-width="2"/><text x="40.0" y="235.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#1f2328" text-anchor="start" font-weight="600">Client B</text><line x1="260.0" y1="228.0" x2="1079.0" y2="228.0" stroke="#d0d7de" stroke-width="2"/><rect x="390.0" y="104.0" width="260.0" height="48.0" rx="6" fill="#1f6feb"/><text x="520.0" y="135.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#fff" text-anchor="middle" font-weight="600">write x = 2</text><rect x="780.0" y="204.0" width="130.0" height="48.0" rx="6" fill="#1f6feb"/><text x="845.0" y="235.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#fff" text-anchor="middle" font-weight="600">read x</text><text x="928.0" y="236.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#1a7f37" text-anchor="start" font-weight="700">must return 2</text><line x1="650.0" y1="80.0" x2="650.0" y2="290.0" stroke="#57606a" stroke-width="2.5" stroke-dasharray="3 6"/><text x="660.0" y="88.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" fill="#57606a" text-anchor="start" font-weight="600" stroke="#fff" stroke-width="7" stroke-linejoin="round" paint-order="stroke">write completed</text><line x1="40.0" y1="375.0" x2="1560.0" y2="375.0" stroke="#d0d7de" stroke-width="2"/><text x="40.0" y="450.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" fill="#1f2328" text-anchor="start" font-weight="700">Serializable · whole transactions, some serial order</text><text x="40.0" y="535.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#1f2328" text-anchor="start" font-weight="600">T1</text><line x1="260.0" y1="528.0" x2="1079.0" y2="528.0" stroke="#d0d7de" stroke-width="2"/><text x="40.0" y="635.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#1f2328" text-anchor="start" font-weight="600">T2</text><line x1="260.0" y1="628.0" x2="1079.0" y2="628.0" stroke="#d0d7de" stroke-width="2"/><rect x="390.0" y="504.0" width="390.0" height="48.0" rx="6" fill="#1f6feb"/><text x="585.0" y="535.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#fff" text-anchor="middle" font-weight="600">read A, write B</text><rect x="520.0" y="604.0" width="390.0" height="48.0" rx="6" fill="#6e8fb5"/><text x="715.0" y="635.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#fff" text-anchor="middle" font-weight="600">read B, write A</text><text x="260.0" y="730.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" fill="#57606a" text-anchor="middle" font-weight="400">t = 0</text><line x1="260.0" y1="700.0" x2="260.0" y2="708.0" stroke="#57606a" stroke-width="2"/><text x="390.0" y="730.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" fill="#57606a" text-anchor="middle" font-weight="400">t = 1</text><line x1="390.0" y1="700.0" x2="390.0" y2="708.0" stroke="#57606a" stroke-width="2"/><text x="520.0" y="730.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" fill="#57606a" text-anchor="middle" font-weight="400">t = 2</text><line x1="520.0" y1="700.0" x2="520.0" y2="708.0" stroke="#57606a" stroke-width="2"/><text x="650.0" y="730.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" fill="#57606a" text-anchor="middle" font-weight="400">t = 3</text><line x1="650.0" y1="700.0" x2="650.0" y2="708.0" stroke="#57606a" stroke-width="2"/><text x="780.0" y="730.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" fill="#57606a" text-anchor="middle" font-weight="400">t = 4</text><line x1="780.0" y1="700.0" x2="780.0" y2="708.0" stroke="#57606a" stroke-width="2"/><text x="910.0" y="730.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" fill="#57606a" text-anchor="middle" font-weight="400">t = 5</text><line x1="910.0" y1="700.0" x2="910.0" y2="708.0" stroke="#57606a" stroke-width="2"/><text x="1040.0" y="730.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" fill="#57606a" text-anchor="middle" font-weight="400">t = 6</text><line x1="1040.0" y1="700.0" x2="1040.0" y2="708.0" stroke="#57606a" stroke-width="2"/><line x1="260.0" y1="700.0" x2="1079.0" y2="700.0" stroke="#57606a" stroke-width="2" marker-end="url(#ah57606a)"/><rect x="1140.0" y="490.0" width="420.0" height="180.0" rx="10" fill="#fff8e6" stroke="#bf8700" stroke-width="2.5"/><text x="1350.0" y="535.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#1f2328" text-anchor="middle" font-weight="400">result must equal</text><text x="1350.0" y="563.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#1f2328" text-anchor="middle" font-weight="400"><tspan font-weight="800">T1 then T2</tspan> or <tspan font-weight="800">T2 then T1</tspan></text><text x="1350.0" y="592.2" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#1f2328" text-anchor="middle" font-weight="400">either is allowed ·</text><text x="1350.0" y="620.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#1f2328" text-anchor="middle" font-weight="400">real time is not consulted</text></svg>
