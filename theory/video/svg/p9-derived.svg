<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700"><defs><marker id="ah1f2328" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="ah1f6feb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6feb"/></marker><marker id="ahcf222e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker><marker id="ah1a7f37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="ahbf8700" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bf8700"/></marker><marker id="ah8c959f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker><marker id="ah57606a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="ah6e8fb5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e8fb5"/></marker><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#eef1f4"/><line x1="0" y1="0" x2="0" y2="12" stroke="#a7b0ba" stroke-width="5"/></pattern><pattern id="hatchred" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#fdeef0"/><line x1="0" y1="0" x2="0" y2="12" stroke="#e8a0a8" stroke-width="5"/></pattern><pattern id="hatchamber" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#fff6e0"/><line x1="0" y1="0" x2="0" y2="12" stroke="#e5c56b" stroke-width="5"/></pattern></defs><rect width="1600" height="700" fill="#fff"/><path d="M60,264 L60,406 A130.0,14 0 0 0 320,406 L320,264" fill="#ddeaf8" stroke="#1f6feb" stroke-width="2.5"/><ellipse cx="190.0" cy="264" rx="130.0" ry="14" fill="#ddeaf8" stroke="#1f6feb" stroke-width="2.5"/><text x="190.0" y="335.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#1f2328" text-anchor="middle" font-weight="600">System of record</text><text x="190.0" y="363.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#1f2328" text-anchor="middle" font-weight="600">the database</text><rect x="420.0" y="285.0" width="250.0" height="100.0" rx="10" fill="#fff4d6" stroke="#bf8700" stroke-width="2.5"/><text x="545.0" y="328.7" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#1f2328" text-anchor="middle" font-weight="600">Change log</text><text x="545.0" y="356.7" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#1f2328" text-anchor="middle" font-weight="400">every commit, in order</text><line x1="322.0" y1="335.0" x2="418.0" y2="335.0" stroke="#1f2328" stroke-width="3" marker-end="url(#ah1f2328)"/><rect x="960.0" y="60.0" width="330.0" height="105.0" rx="10" fill="#dff3e4" stroke="#1a7f37" stroke-width="2.5"/><text x="1125.0" y="106.2" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#1f2328" text-anchor="middle" font-weight="600">Cache invalidator</text><text x="1125.0" y="134.2" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#1f2328" text-anchor="middle" font-weight="400">delete changed keys</text><line x1="672.0" y1="335.0" x2="958.0" y2="112.0" stroke="#1a7f37" stroke-width="2.5" marker-end="url(#ah1a7f37)"/><rect x="960.0" y="205.0" width="330.0" height="105.0" rx="10" fill="#dff3e4" stroke="#1a7f37" stroke-width="2.5"/><text x="1125.0" y="251.2" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#1f2328" text-anchor="middle" font-weight="600">Search index</text><text x="1125.0" y="279.2" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#1f2328" text-anchor="middle" font-weight="400">rebuilt by replay</text><line x1="672.0" y1="335.0" x2="958.0" y2="257.0" stroke="#1a7f37" stroke-width="2.5" marker-end="url(#ah1a7f37)"/><rect x="960.0" y="350.0" width="330.0" height="105.0" rx="10" fill="#dff3e4" stroke="#1a7f37" stroke-width="2.5"/><text x="1125.0" y="396.2" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#1f2328" text-anchor="middle" font-weight="600">Warehouse</text><text x="1125.0" y="424.2" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#1f2328" text-anchor="middle" font-weight="400">analytics, hours later</text><line x1="672.0" y1="335.0" x2="958.0" y2="402.0" stroke="#1a7f37" stroke-width="2.5" marker-end="url(#ah1a7f37)"/><rect x="960.0" y="495.0" width="330.0" height="105.0" rx="10" fill="#dff3e4" stroke="#1a7f37" stroke-width="2.5"/><text x="1125.0" y="541.2" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#1f2328" text-anchor="middle" font-weight="600">Feature store</text><text x="1125.0" y="569.2" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#1f2328" text-anchor="middle" font-weight="400">for ranking and ML</text><line x1="672.0" y1="335.0" x2="958.0" y2="547.0" stroke="#1a7f37" stroke-width="2.5" marker-end="url(#ah1a7f37)"/><text x="1460.0" y="130.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#1a7f37" text-anchor="middle" font-weight="800">derived:</text><text x="1460.0" y="170.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#1a7f37" text-anchor="middle" font-weight="600">can be thrown</text><text x="1460.0" y="198.2" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#1a7f37" text-anchor="middle" font-weight="600">away and</text><text x="1460.0" y="226.3" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#1a7f37" text-anchor="middle" font-weight="600">recomputed</text><text x="1460.0" y="254.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#1a7f37" text-anchor="middle" font-weight="600">from the log</text><text x="190.0" y="470.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" fill="#1f6feb" text-anchor="middle" font-weight="700">the only copy that</text><text x="190.0" y="498.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" fill="#1f6feb" text-anchor="middle" font-weight="700">is ever written to</text><line x1="60.0" y1="640.0" x2="1540.0" y2="640.0" stroke="#d0d7de" stroke-width="2"/><text x="800.0" y="680.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" fill="#1f2328" text-anchor="middle" font-weight="400">Derived data is <tspan font-weight="800">never written back</tspan> to the source. Each view states its lag.</text></svg>
