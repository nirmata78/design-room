 font-size="22" fill="#1f2328" text-anchor="middle" font-weight="400">1 ms</text><line x1="1225.7" y1="50.0" x2="1225.7" y2="562.0" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4 6"/><line x1="1225.7" y1="562.0" x2="1225.7" y2="572.0" stroke="#1f2328" stroke-width="2"/><text x="1225.7" y="600.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#1f2328" text-anchor="middle" font-weight="400">10 ms</text><line x1="1330.0" y1="50.0" x2="1330.0" y2="562.0" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4 6"/><line x1="1330.0" y1="562.0" x2="1330.0" y2="572.0" stroke="#1f2328" stroke-width="2"/><text x="1330.0" y="600.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#1f2328" text-anchor="middle" font-weight="400">100 ms</text><line x1="600.0" y1="562.0" x2="1361.4" y2="562.0" stroke="#1f2328" stroke-width="2"/><text x="965.0" y="634.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" fill="#57606a" text-anchor="middle" font-weight="400">time, log scale: each gridline is ten times the one before</text><text x="582.0" y="93.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#1f2328" text-anchor="end" font-weight="600">Memory access</text><rect x="600" y="60" width="104.3" height="50" rx="4" fill="#6e8fb5"/><text x="716.3" y="93.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#1f2328" text-anchor="start" font-weight="700">100 ns</text><text x="582.0" y="175.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#1f2328" text-anchor="end" font-weight="600">Read from a flash drive</text><rect x="600" y="142" width="417.1" height="50" rx="4" fill="#6e8fb5"/><text x="1029.1" y="175.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#1f2328" text-anchor="start" font-weight="700">100 µs</text><text x="582.0" y="257.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#1f2328" text-anchor="end" font-weight="600">Round trip in one datacentre</text><rect x="600" y="224" width="490.0" height="50" rx="4" fill="#6e8fb5"/><text x="1102.0" y="257.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#1f2328" text-anchor="start" font-weight="700">0.5 ms</text><text x="582.0" y="339.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#1f2328" text-anchor="end" font-weight="600">Seek on a spinning disk</text><rect x="600" y="306" width="625.7" height="50" rx="4" fill="#bf8700"/><text x="1237.7" y="339.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#bf8700" text-anchor="start" font-weight="700">10 ms</text><text x="582.0" y="421.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#1f2328" text-anchor="end" font-weight="600">Round trip between regions, one continent</text><rect x="600" y="388" width="675.5" height="50" rx="4" fill="#cf222e"/><text x="1287.5" y="421.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#cf222e" text-anchor="start" font-weight="700">30 ms</text><text x="582.0" y="503.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#1f2328" text-anchor="end" font-weight="600">Round trip across an ocean</text><rect x="600" y="470" width="738.3" height="50" rx="4" fill="#cf222e"/><text x="1350.3" y="503.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#cf222e" text-anchor="start" font-weight="700">100–150 ms</text><line x1="600.0" y1="50.0" x2="600.0" y2="562.0" stroke="#1f2328" stroke-width="2"/><rect x="960" y="684" width="600" height="56" rx="10" fill="#fff8e6" stroke="#bf8700" stroke-width="2.5"/><text x="1260.0" y="720.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#1f2328" text-anchor="middle" font-weight="600">one ocean crossing = 240 datacentre round trips</text></svg>
