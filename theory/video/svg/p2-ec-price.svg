<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700"><defs><marker id="ah1f2328" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="ah1f6feb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6feb"/></marker><marker id="ahcf222e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker><marker id="ah1a7f37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="ahbf8700" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bf8700"/></marker><marker id="ah8c959f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker><marker id="ah57606a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="ah6e8fb5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e8fb5"/></marker><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#eef1f4"/><line x1="0" y1="0" x2="0" y2="12" stroke="#a7b0ba" stroke-width="5"/></pattern><pattern id="hatchred" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#fdeef0"/><line x1="0" y1="0" x2="0" y2="12" stroke="#e8a0a8" stroke-width="5"/></pattern><pattern id="hatchamber" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#fff6e0"/><line x1="0" y1="0" x2="0" y2="12" stroke="#e5c56b" stroke-width="5"/></pattern></defs><rect width="1600" height="700" fill="#fff"/><text x="40.0" y="50.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" fill="#1f2328" text-anchor="start" font-weight="700">Three replicas, three regions</text><line x1="260.0" y1="350.0" x2="430.0" y2="220.0" stroke="#1f6feb" stroke-width="4"/><text x="330.0" y="255.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" fill="#1f6feb" text-anchor="middle" font-weight="800" stroke="#fff" stroke-width="7" stroke-linejoin="round" paint-order="stroke">30 ms</text><line x1="260.0" y1="410.0" x2="430.0" y2="540.0" stroke="#bf8700" stroke-width="4"/><text x="330.0" y="525.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" fill="#bf8700" text-anchor="middle" font-weight="800" stroke="#fff" stroke-width="7" stroke-linejoin="round" paint-order="stroke">80 ms</text><rect x="60.0" y="330.0" width="220.0" height="100.0" rx="10" fill="#ddeaf8" stroke="#1f6feb" stroke-width="2.5"/><text x="170.0" y="373.7" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#1f2328" text-anchor="middle" font-weight="600">Leader</text><text x="170.0" y="401.7" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#1f2328" text-anchor="middle" font-weight="400">region A</text><rect x="410.0" y="140.0" width="220.0" height="100.0" rx="10" fill="#ddeaf8" stroke="#1f6feb" stroke-width="2.5"/><text x="520.0" y="183.7" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#1f2328" text-anchor="middle" font-weight="600">Replica</text><text x="520.0" y="211.7" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#1f2328" text-anchor="middle" font-weight="400">region B</text><rect x="410.0" y="520.0" width="220.0" height="100.0" rx="10" fill="#fff4d6" stroke="#bf8700" stroke-width="2.5"/><text x="520.0" y="563.7" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#1f2328" text-anchor="middle" font-weight="600">Replica</text><text x="520.0" y="591.7" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#1f2328" text-anchor="middle" font-weight="400">region C</text><text x="170.0" y="660.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" fill="#57606a" text-anchor="start" font-weight="400">round trips from the leader</text><text x="780.0" y="50.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" fill="#1f2328" text-anchor="start" font-weight="700">What each choice costs, per request</text><text x="780.0" y="132.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" fill="#1f2328" text-anchor="start" font-weight="700">consistent write</text><text x="780.0" y="226.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" fill="#57606a" text-anchor="start" font-weight="400">waits for the nearest majority: leader + B</text><text x="780.0" y="312.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" fill="#1f2328" text-anchor="start" font-weight="700">consistent read</text><text x="780.0" y="406.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" fill="#57606a" text-anchor="start" font-weight="400">one more round to confirm the leader, or a lease</text><text x="780.0" y="492.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" fill="#1f2328" text-anchor="start" font-weight="700">low-latency write</text><text x="780.0" y="586.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" fill="#57606a" text-anchor="start" font-weight="400">acknowledged locally, replicated behind</text><rect x="780.0" y="150.0" width="258.0" height="46.0" rx="6" fill="#1f6feb"/><text x="909.0" y="180.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#fff" text-anchor="middle" font-weight="600">30 ms</text><rect x="780.0" y="330.0" width="258.0" height="46.0" rx="6" fill="#1f6feb"/><text x="909.0" y="360.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#fff" text-anchor="middle" font-weight="600">30 ms</text><text x="1058.0" y="362.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" fill="#1a7f37" text-anchor="start" font-weight="700">or about 0 with a lease</text><rect x="780.0" y="510.0" width="14.0" height="46.0" rx="6" fill="#1a7f37"/><text x="806.0" y="543.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#1a7f37" text-anchor="start" font-weight="800">1 ms</text><rect x="866.0" y="510.0" width="602.0" height="46.0" rx="6" fill="url(#hatchred)" stroke="#cf222e" stroke-width="2"/><text x="1167.0" y="543.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" fill="#cf222e" text-anchor="middle" font-weight="700" stroke="#fff" stroke-width="7" stroke-linejoin="round" paint-order="stroke">regions disagree for 80 ms or more</text><line x1="780.0" y1="640.0" x2="1511.0" y2="640.0" stroke="#57606a" stroke-width="2" marker-end="url(#ah57606a)"/><line x1="780.0" y1="632.0" x2="780.0" y2="648.0" stroke="#57606a" stroke-width="2"/><text x="780.0" y="674.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" fill="#57606a" text-anchor="middle" font-weight="400">0 ms</text><line x1="1038.0" y1="632.0" x2="1038.0" y2="648.0" stroke="#57606a" stroke-width="2"/><text x="1038.0" y="674.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" fill="#57606a" text-anchor="middle" font-weight="400">30 ms</text><line x1="1468.0" y1="632.0" x2="1468.0" y2="648.0" stroke="#57606a" stroke-width="2"/><text x="1468.0" y="674.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" fill="#57606a" text-anchor="middle" font-weight="400">80 ms</text></svg>
