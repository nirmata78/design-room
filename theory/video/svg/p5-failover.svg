<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560"><defs><marker id="ah1f2328" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="ah1f6feb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6feb"/></marker><marker id="ahcf222e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker><marker id="ah1a7f37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="ahbf8700" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bf8700"/></marker><marker id="ah8c959f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker><marker id="ah57606a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="ah6e8fb5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e8fb5"/></marker><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#eef1f4"/><line x1="0" y1="0" x2="0" y2="12" stroke="#a7b0ba" stroke-width="5"/></pattern><pattern id="hatchred" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#fdeef0"/><line x1="0" y1="0" x2="0" y2="12" stroke="#e8a0a8" stroke-width="5"/></pattern><pattern id="hatchamber" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#fff6e0"/><line x1="0" y1="0" x2="0" y2="12" stroke="#e5c56b" stroke-width="5"/></pattern></defs><rect width="1600" height="560" fill="#fff"/><rect x="30.0" y="120.0" width="284.0" height="230.0" rx="14" fill="#ddeaf8" stroke="#1f6feb" stroke-width="3"/><text x="172.0" y="172.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="27" fill="#1f6feb" text-anchor="middle" font-weight="800">1 · Detect</text><text x="172.0" y="240.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#1f2328" text-anchor="middle" font-weight="400">3 missed heartbeats</text><text x="172.0" y="271.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#1f2328" text-anchor="middle" font-weight="400">× 10 s = 30 s</text><text x="172.0" y="303.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#1f2328" text-anchor="middle" font-weight="400">set against false alarms</text><rect x="344.0" y="120.0" width="284.0" height="230.0" rx="14" fill="#ddeaf8" stroke="#1f6feb" stroke-width="3"/><text x="486.0" y="172.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="27" fill="#1f6feb" text-anchor="middle" font-weight="800">2 · Choose</text><text x="486.0" y="240.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#1f2328" text-anchor="middle" font-weight="400">the follower with the</text><text x="486.0" y="271.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#1f2328" text-anchor="middle" font-weight="400">highest applied position</text><text x="486.0" y="303.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#1f2328" text-anchor="middle" font-weight="400">(semi-sync: the acker)</text><line x1="316.0" y1="270.0" x2="340.0" y2="270.0" stroke="#57606a" stroke-width="3" marker-end="url(#ah57606a)"/><rect x="658.0" y="120.0" width="284.0" height="230.0" rx="14" fill="#fde7e9" stroke="#cf222e" stroke-width="3"/><text x="800.0" y="172.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="27" fill="#cf222e" text-anchor="middle" font-weight="800">3 · Fence</text><text x="800.0" y="240.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#1f2328" text-anchor="middle" font-weight="400">revoke the lease, raise</text><text x="800.0" y="271.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#1f2328" text-anchor="middle" font-weight="400">the epoch, or cut power:</text><text x="800.0" y="303.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#1f2328" text-anchor="middle" font-weight="400"><tspan font-weight="800">not one more write</tspan></text><line x1="630.0" y1="270.0" x2="654.0" y2="270.0" stroke="#57606a" stroke-width="3" marker-end="url(#ah57606a)"/><rect x="972.0" y="120.0" width="284.0" height="230.0" rx="14" fill="#ddeaf8" stroke="#1f6feb" stroke-width="3"/><text x="1114.0" y="172.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="27" fill="#1f6feb" text-anchor="middle" font-weight="800">4 · Repoint</text><text x="1114.0" y="240.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#1f2328" text-anchor="middle" font-weight="400">registry, proxy or</text><text x="1114.0" y="271.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#1f2328" text-anchor="middle" font-weight="400">virtual IP; stale client</text><text x="1114.0" y="303.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#1f2328" text-anchor="middle" font-weight="400">caches are the slow part</text><line x1="944.0" y1="270.0" x2="968.0" y2="270.0" stroke="#57606a" stroke-width="3" marker-end="url(#ah57606a)"/><rect x="1286.0" y="120.0" width="284.0" height="230.0" rx="14" fill="#dff3e4" stroke="#1a7f37" stroke-width="3"/><text x="1428.0" y="172.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="27" fill="#1a7f37" text-anchor="middle" font-weight="800">5 · Reconcile</text><text x="1428.0" y="240.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#1f2328" text-anchor="middle" font-weight="400">the old leader&#x27;s tail is</text><text x="1428.0" y="271.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#1f2328" text-anchor="middle" font-weight="400"><tspan font-weight="800">saved</tspan>, compared, and</text><text x="1428.0" y="303.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#1f2328" text-anchor="middle" font-weight="400">replayed or reported</text><line x1="1258.0" y1="270.0" x2="1282.0" y2="270.0" stroke="#57606a" stroke-width="3" marker-end="url(#ah57606a)"/><text x="40.0" y="70.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" fill="#1f2328" text-anchor="start" font-weight="700">When the leader fails</text><text x="800.0" y="450.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" fill="#cf222e" text-anchor="middle" font-weight="400">Leave out step 3 and a leader that was only <tspan font-weight="800">partitioned</tspan> keeps taking writes: split brain.</text><text x="800.0" y="505.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#57606a" text-anchor="middle" font-weight="400">A timeout cannot tell dead from cut off. Only fencing makes the difference harmless.</text></svg>
