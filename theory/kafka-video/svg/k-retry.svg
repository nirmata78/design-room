" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#fff6e0"/><line x1="0" y1="0" x2="0" y2="12" stroke="#e5c56b" stroke-width="5"/></pattern></defs><rect width="1600" height="640" fill="#fff"/><rect x="50.0" y="200.0" width="280.0" height="110.0" rx="10" fill="#ddeaf8" stroke="#1f6feb" stroke-width="2.5"/><text x="190.0" y="264.1" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" fill="#1f2328" text-anchor="middle" font-weight="600">orders topic</text><rect x="470.0" y="200.0" width="280.0" height="110.0" rx="10" fill="#dff3e4" stroke="#1a7f37" stroke-width="2.5"/><text x="610.0" y="264.1" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" fill="#1f2328" text-anchor="middle" font-weight="600">Consumer</text><rect x="1250.0" y="200.0" width="300.0" height="110.0" rx="10" fill="#dff3e4" stroke="#1a7f37" stroke-width="2.5"/><text x="1400.0" y="264.1" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" fill="#1f2328" text-anchor="middle" font-weight="600">Done</text><line x1="332.0" y1="255.0" x2="466.0" y2="255.0" stroke="#1f6feb" stroke-width="3.5" marker-end="url(#ah1f6feb)"/><line x1="752.0" y1="255.0" x2="1246.0" y2="255.0" stroke="#1a7f37" stroke-width="3.5" marker-end="url(#ah1a7f37)"/><text x="999.0" y="243.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" fill="#1a7f37" text-anchor="middle" font-weight="700" stroke="#fff" stroke-width="7" stroke-linejoin="round" paint-order="stroke">success</text><rect x="470.0" y="420.0" width="280.0" height="110.0" rx="10" fill="#fff4d6" stroke="#bf8700" stroke-width="2.5"/><text x="610.0" y="467.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" fill="#1f2328" text-anchor="middle" font-weight="600">retry topic</text><text x="610.0" y="499.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" fill="#1f2328" text-anchor="middle" font-weight="400">with a delay</text><line x1="570.0" y1="312.0" x2="570.0" y2="416.0" stroke="#bf8700" stroke-width="3.5" marker-end="url(#ahbf8700)"/><text x="555.0" y="372.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" fill="#bf8700" text-anchor="end" font-weight="700" stroke="#fff" stroke-width="7" stroke-linejoin="round" paint-order="stroke">transient error</text><line x1="660.0" y1="416.0" x2="660.0" y2="314.0" stroke="#bf8700" stroke-width="3.5" marker-end="url(#ahbf8700)"/><text x="676.0" y="372.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" fill="#bf8700" text-anchor="start" font-weight="700" stroke="#fff" stroke-width="7" stroke-linejoin="round" paint-order="stroke">try again</text><rect x="1000.0" y="420.0" width="300.0" height="110.0" rx="10" fill="#fde7e9" stroke="#cf222e" stroke-width="2.5"/><text x="1150.0" y="468.2" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" fill="#1f2328" text-anchor="middle" font-weight="600">dead-letter topic</text><text x="1150.0" y="498.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" fill="#1f2328" text-anchor="middle" font-weight="400">alert, inspect, replay</text><line x1="752.0" y1="475.0" x2="996.0" y2="475.0" stroke="#cf222e" stroke-width="3.5" marker-end="url(#ahcf222e)"/><text x="874.0" y="463.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" fill="#cf222e" text-anchor="middle" font-weight="700" stroke="#fff" stroke-width="7" stroke-linejoin="round" paint-order="stroke">attempts used up</text><text x="800.0" y="80.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="29" fill="#cf222e" text-anchor="middle" font-weight="800">Without a way out, one bad record blocks its partition forever</text><text x="800.0" y="610.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" fill="#57606a" text-anchor="middle" font-weight="600">A retry topic gives up order for that key. If order matters, park every later event of the key too.</text></svg>
