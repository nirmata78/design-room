<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="610" viewBox="0 0 1600 610"><defs><marker id="ah1f2328" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="ah1f6feb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6feb"/></marker><marker id="ahcf222e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker><marker id="ah1a7f37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="ahbf8700" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bf8700"/></marker><marker id="ah8c959f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker><marker id="ah57606a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="ah6e8fb5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e8fb5"/></marker><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#eef1f4"/><line x1="0" y1="0" x2="0" y2="12" stroke="#a7b0ba" stroke-width="5"/></pattern><pattern id="hatchred" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#fdeef0"/><line x1="0" y1="0" x2="0" y2="12" stroke="#e8a0a8" stroke-width="5"/></pattern><pattern id="hatchamber" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#fff6e0"/><line x1="0" y1="0" x2="0" y2="12" stroke="#e5c56b" stroke-width="5"/></pattern></defs><rect width="1600" height="610" fill="#fff"/><rect x="20.0" y="20.0" width="770.0" height="570.0" rx="14" fill="#eaf2fc" stroke="none" stroke-width="0"/><rect x="810.0" y="20.0" width="770.0" height="570.0" rx="14" fill="#e9f6ec" stroke="none" stroke-width="0"/><text x="405.0" y="70.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="29" fill="#1f2328" text-anchor="middle" font-weight="700">Tiered storage</text><text x="1195.0" y="70.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="29" fill="#1f2328" text-anchor="middle" font-weight="700">Rebuilding a lost broker</text><rect x="70.0" y="130.0" width="280.0" height="150.0" rx="10" fill="#ddeaf8" stroke="#1f6feb" stroke-width="2.5"/><text x="210.0" y="182.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" fill="#1f2328" text-anchor="middle" font-weight="600">Broker disk</text><text x="210.0" y="213.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" fill="#1f2328" text-anchor="middle" font-weight="400">last 1 day</text><text x="210.0" y="243.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" fill="#1f2328" text-anchor="middle" font-weight="400">fast, replicated</text><rect x="440.0" y="130.0" width="300.0" height="150.0" rx="10" fill="#dff3e4" stroke="#1a7f37" stroke-width="2.5"/><text x="590.0" y="182.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" fill="#1f2328" text-anchor="middle" font-weight="600">Object storage</text><text x="590.0" y="213.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" fill="#1f2328" text-anchor="middle" font-weight="400">the other 6 days</text><text x="590.0" y="243.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" fill="#1f2328" text-anchor="middle" font-weight="400">cheap per terabyte</text><line x1="352.0" y1="205.0" x2="436.0" y2="205.0" stroke="#1a7f37" stroke-width="3.5" marker-end="url(#ah1a7f37)"/><text x="405.0" y="370.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" fill="#1f2328" text-anchor="middle" font-weight="500">Same topic, same offsets.</text><text x="405.0" y="402.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" fill="#1f2328" text-anchor="middle" font-weight="500">Old segments move out,</text><text x="405.0" y="434.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" fill="#1f2328" text-anchor="middle" font-weight="500">and consumers read them transparently.</text><text x="405.0" y="530.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" fill="#cf222e" text-anchor="middle" font-weight="700">Not for compacted topics.</text><text x="860.0" y="170.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" fill="#1f2328" text-anchor="start" font-weight="700">7 days on local disk: 3 TB to copy</text><rect x="860.0" y="190.0" width="514.6" height="70.0" rx="6" fill="#fde7e9" stroke="#cf222e" stroke-width="2.5"/><text x="1394.6" y="235.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="34" fill="#cf222e" text-anchor="start" font-weight="800">about 8 h</text><text x="860.0" y="340.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" fill="#1f2328" text-anchor="start" font-weight="700">1 day on local disk: 0.43 TB to copy</text><rect x="860.0" y="360.0" width="73.8" height="70.0" rx="6" fill="#dff3e4" stroke="#1a7f37" stroke-width="2.5"/><text x="953.8" y="405.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="34" fill="#1a7f37" text-anchor="start" font-weight="800">about 70 min</text><text x="1195.0" y="530.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" fill="#57606a" text-anchor="middle" font-weight="600">Copy throttled to 100 MB/s</text></svg>
