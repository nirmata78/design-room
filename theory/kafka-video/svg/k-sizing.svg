<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600"><defs><marker id="ah1f2328" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="ah1f6feb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6feb"/></marker><marker id="ahcf222e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker><marker id="ah1a7f37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="ahbf8700" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bf8700"/></marker><marker id="ah8c959f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker><marker id="ah57606a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="ah6e8fb5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e8fb5"/></marker><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#eef1f4"/><line x1="0" y1="0" x2="0" y2="12" stroke="#a7b0ba" stroke-width="5"/></pattern><pattern id="hatchred" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#fdeef0"/><line x1="0" y1="0" x2="0" y2="12" stroke="#e8a0a8" stroke-width="5"/></pattern><pattern id="hatchamber" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#fff6e0"/><line x1="0" y1="0" x2="0" y2="12" stroke="#e5c56b" stroke-width="5"/></pattern></defs><rect width="1600" height="600" fill="#fff"/><text x="40.0" y="50.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" fill="#1f2328" text-anchor="start" font-weight="700">Brokers needed by each limit (the budgets per broker are illustrative: measure yours)</text><text x="280.0" y="140.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="27" fill="#1f2328" text-anchor="end" font-weight="700">Disk</text><rect x="300.0" y="90.0" width="750.0" height="76.0" rx="6" fill="#ddeaf8" stroke="#1f6feb" stroke-width="2.5"/><text x="1028.0" y="140.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="32" fill="#1f2328" text-anchor="end" font-weight="800">5</text><text x="1074.0" y="138.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" fill="#57606a" text-anchor="start" font-weight="600">25.9 TB ÷ 6 TB per broker</text><text x="280.0" y="240.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="27" fill="#1f2328" text-anchor="end" font-weight="700">Writes</text><rect x="300.0" y="190.0" width="450.0" height="76.0" rx="6" fill="#eef1f4" stroke="#8c959f" stroke-width="2.5"/><text x="728.0" y="240.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="32" fill="#1f2328" text-anchor="end" font-weight="800">3</text><text x="774.0" y="238.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" fill="#57606a" text-anchor="start" font-weight="600">90 MB/s ÷ 30 MB/s per broker</text><text x="280.0" y="340.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="27" fill="#1f2328" text-anchor="end" font-weight="700">Network out</text><rect x="300.0" y="290.0" width="450.0" height="76.0" rx="6" fill="#eef1f4" stroke="#8c959f" stroke-width="2.5"/><text x="728.0" y="340.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="32" fill="#1f2328" text-anchor="end" font-weight="800">3</text><text x="774.0" y="338.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" fill="#57606a" text-anchor="start" font-weight="600">150 MB/s ÷ 60 MB/s per broker</text><line x1="60.0" y1="386.0" x2="1540.0" y2="386.0" stroke="#8c959f" stroke-width="2"/><text x="280.0" y="454.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="27" fill="#1f2328" text-anchor="end" font-weight="700">Design</text><rect x="300.0" y="400.0" width="750.0" height="80.0" rx="6" fill="#ddeaf8" stroke="#1f6feb" stroke-width="2.5"/><text x="675.0" y="452.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" fill="#1f2328" text-anchor="middle" font-weight="800">largest limit: 5</text><rect x="1050.0" y="400.0" width="150.0" height="80.0" rx="6" fill="#dff3e4" stroke="#1a7f37" stroke-width="2.5"/><text x="1125.0" y="452.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="30" fill="#1a7f37" text-anchor="middle" font-weight="800">+1</text><text x="1228.0" y="452.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="30" fill="#1a7f37" text-anchor="start" font-weight="800">6 brokers, 2 per zone</text><text x="800.0" y="560.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" fill="#57606a" text-anchor="middle" font-weight="600">The spare is what lets you lose a broker, or restart one, and still have room to work.</text></svg>
