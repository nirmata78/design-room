" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#fff6e0"/><line x1="0" y1="0" x2="0" y2="12" stroke="#e5c56b" stroke-width="5"/></pattern></defs><rect width="1600" height="610" fill="#fff"/><rect x="40.0" y="60.0" width="1010.0" height="400.0" rx="14" fill="#dff3e4" stroke="#1a7f37" stroke-width="3" stroke-dasharray="12 8"/><text x="545.0" y="105.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" fill="#1a7f37" text-anchor="middle" font-weight="800">Kafka transaction: exactly once, inside this box</text><rect x="80.0" y="180.0" width="240.0" height="110.0" rx="10" fill="#ddeaf8" stroke="#1f6feb" stroke-width="2.5"/><text x="200.0" y="243.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" fill="#1f2328" text-anchor="middle" font-weight="600">Input topic</text><rect x="420.0" y="180.0" width="250.0" height="110.0" rx="10" fill="#dff3e4" stroke="#1a7f37" stroke-width="2.5"/><text x="545.0" y="243.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" fill="#1f2328" text-anchor="middle" font-weight="600">Processor</text><rect x="770.0" y="150.0" width="240.0" height="90.0" rx="10" fill="#ddeaf8" stroke="#1f6feb" stroke-width="2.5"/><text x="890.0" y="203.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" fill="#1f2328" text-anchor="middle" font-weight="600">Output topic</text><rect x="770.0" y="300.0" width="240.0" height="110.0" rx="10" fill="#ddeaf8" stroke="#1f6feb" stroke-width="2.5"/><text x="890.0" y="363.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" fill="#1f2328" text-anchor="middle" font-weight="600">Consumer offset</text><line x1="322.0" y1="235.0" x2="416.0" y2="235.0" stroke="#1f6feb" stroke-width="3.5" marker-end="url(#ah1f6feb)"/><line x1="672.0" y1="215.0" x2="766.0" y2="195.0" stroke="#1a7f37" stroke-width="3.5" marker-end="url(#ah1a7f37)"/><line x1="672.0" y1="260.0" x2="766.0" y2="350.0" stroke="#1a7f37" stroke-width="3.5" marker-end="url(#ah1a7f37)"/><text x="545.0" y="435.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" fill="#1a7f37" text-anchor="middle" font-weight="700">output and offset commit together, or not at all</text><rect x="1220.0" y="90.0" width="330.0" height="90.0" rx="10" fill="#fff4d6" stroke="#bf8700" stroke-width="2.5"/><text x="1385.0" y="143.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" fill="#1f2328" text-anchor="middle" font-weight="600">Your database</text><rect x="1220.0" y="215.0" width="330.0" height="90.0" rx="10" fill="#fff4d6" stroke="#bf8700" stroke-width="2.5"/><text x="1385.0" y="268.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" fill="#1f2328" text-anchor="middle" font-weight="600">Card network</text><rect x="1220.0" y="340.0" width="330.0" height="90.0" rx="10" fill="#fff4d6" stroke="#bf8700" stroke-width="2.5"/><text x="1385.0" y="393.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" fill="#1f2328" text-anchor="middle" font-weight="600">Email provider</text><line x1="1052.0" y1="260.0" x2="1216.0" y2="135.0" stroke="#cf222e" stroke-width="3.5" stroke-dasharray="9 7" marker-end="url(#ahcf222e)"/><line x1="1052.0" y1="260.0" x2="1216.0" y2="260.0" stroke="#cf222e" stroke-width="3.5" stroke-dasharray="9 7" marker-end="url(#ahcf222e)"/><line x1="1052.0" y1="260.0" x2="1216.0" y2="385.0" stroke="#cf222e" stroke-width="3.5" stroke-dasharray="9 7" marker-end="url(#ahcf222e)"/><text x="800.0" y="530.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" fill="#cf222e" text-anchor="middle" font-weight="800">Outside the box, delivery is at least once. The receiver removes the duplicate.</text><text x="800.0" y="580.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" fill="#57606a" text-anchor="middle" font-weight="600">Idempotency key, unique constraint, or an upsert keyed by a stable event ID.</text></svg>
