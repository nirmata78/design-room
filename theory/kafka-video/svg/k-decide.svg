<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700"><defs><marker id="ah1f2328" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="ah1f6feb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6feb"/></marker><marker id="ahcf222e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker><marker id="ah1a7f37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="ahbf8700" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bf8700"/></marker><marker id="ah8c959f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker><marker id="ah57606a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="ah6e8fb5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e8fb5"/></marker><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#eef1f4"/><line x1="0" y1="0" x2="0" y2="12" stroke="#a7b0ba" stroke-width="5"/></pattern><pattern id="hatchred" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#fdeef0"/><line x1="0" y1="0" x2="0" y2="12" stroke="#e8a0a8" stroke-width="5"/></pattern><pattern id="hatchamber" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#fff6e0"/><line x1="0" y1="0" x2="0" y2="12" stroke="#e5c56b" stroke-width="5"/></pattern></defs><rect width="1600" height="700" fill="#fff"/><rect x="60.0" y="40.0" width="800.0" height="120.0" rx="10" fill="#eef1f4" stroke="#8c959f" stroke-width="2.5"/><text x="460.0" y="109.1" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" fill="#1f2328" text-anchor="middle" font-weight="700">Does the caller need the answer now?</text><line x1="862.0" y1="100.0" x2="1088.0" y2="100.0" stroke="#1f6feb" stroke-width="3.5" marker-end="url(#ah1f6feb)"/><text x="975.0" y="88.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" fill="#1f6feb" text-anchor="middle" font-weight="800" stroke="#fff" stroke-width="7" stroke-linejoin="round" paint-order="stroke">yes</text><rect x="1092.0" y="40.0" width="450.0" height="120.0" rx="10" fill="#ddeaf8" stroke="#1f6feb" stroke-width="2.5"/><text x="1317.0" y="92.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" fill="#1f2328" text-anchor="middle" font-weight="600">Request and response</text><text x="1317.0" y="125.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" fill="#1f2328" text-anchor="middle" font-weight="400">gRPC or HTTP</text><line x1="460.0" y1="162.0" x2="460.0" y2="216.0" stroke="#1f2328" stroke-width="3.5" marker-end="url(#ah1f2328)"/><text x="474.0" y="197.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" fill="#1f2328" text-anchor="start" font-weight="800" stroke="#fff" stroke-width="7" stroke-linejoin="round" paint-order="stroke">no</text><rect x="60.0" y="220.0" width="800.0" height="120.0" rx="10" fill="#eef1f4" stroke="#8c959f" stroke-width="2.5"/><text x="460.0" y="289.1" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" fill="#1f2328" text-anchor="middle" font-weight="700">Do several teams need the same facts, or a replay?</text><line x1="862.0" y1="280.0" x2="1088.0" y2="280.0" stroke="#1a7f37" stroke-width="3.5" marker-end="url(#ah1a7f37)"/><text x="975.0" y="268.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" fill="#1a7f37" text-anchor="middle" font-weight="800" stroke="#fff" stroke-width="7" stroke-linejoin="round" paint-order="stroke">yes</text><rect x="1092.0" y="220.0" width="450.0" height="120.0" rx="10" fill="#dff3e4" stroke="#1a7f37" stroke-width="2.5"/><text x="1317.0" y="272.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" fill="#1f2328" text-anchor="middle" font-weight="600">Kafka</text><text x="1317.0" y="305.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" fill="#1f2328" text-anchor="middle" font-weight="400">a durable, replayable log</text><line x1="460.0" y1="342.0" x2="460.0" y2="396.0" stroke="#1f2328" stroke-width="3.5" marker-end="url(#ah1f2328)"/><text x="474.0" y="377.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" fill="#1f2328" text-anchor="start" font-weight="800" stroke="#fff" stroke-width="7" stroke-linejoin="round" paint-order="stroke">no</text><rect x="60.0" y="400.0" width="800.0" height="120.0" rx="10" fill="#eef1f4" stroke="#8c959f" stroke-width="2.5"/><text x="460.0" y="469.1" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" fill="#1f2328" text-anchor="middle" font-weight="700">Is it work to do once per item, with retries or delays?</text><line x1="862.0" y1="460.0" x2="1088.0" y2="460.0" stroke="#bf8700" stroke-width="3.5" marker-end="url(#ahbf8700)"/><text x="975.0" y="448.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" fill="#bf8700" text-anchor="middle" font-weight="800" stroke="#fff" stroke-width="7" stroke-linejoin="round" paint-order="stroke">yes</text><rect x="1092.0" y="400.0" width="450.0" height="120.0" rx="10" fill="#fff4d6" stroke="#bf8700" stroke-width="2.5"/><text x="1317.0" y="452.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" fill="#1f2328" text-anchor="middle" font-weight="600">A task queue</text><text x="1317.0" y="485.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" fill="#1f2328" text-anchor="middle" font-weight="400">or Kafka share groups</text><line x1="460.0" y1="522.0" x2="460.0" y2="580.0" stroke="#1f2328" stroke-width="3.5" marker-end="url(#ah1f2328)"/><text x="474.0" y="559.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" fill="#1f2328" text-anchor="start" font-weight="800" stroke="#fff" stroke-width="7" stroke-linejoin="round" paint-order="stroke">no</text><rect x="60.0" y="584.0" width="800.0" height="90.0" rx="10" fill="#eef1f4" stroke="#8c959f" stroke-width="2.5"/><text x="460.0" y="638.1" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" fill="#1f2328" text-anchor="middle" font-weight="700">A database table is probably enough</text></svg>
