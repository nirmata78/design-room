<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="650" viewBox="0 0 1600 650"><defs><marker id="ah1f2328" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="ah1f6feb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6feb"/></marker><marker id="ahcf222e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker><marker id="ah1a7f37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="ahbf8700" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bf8700"/></marker><marker id="ah8c959f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker><marker id="ah57606a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="ah6e8fb5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e8fb5"/></marker><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#eef1f4"/><line x1="0" y1="0" x2="0" y2="12" stroke="#a7b0ba" stroke-width="5"/></pattern><pattern id="hatchred" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#fdeef0"/><line x1="0" y1="0" x2="0" y2="12" stroke="#e8a0a8" stroke-width="5"/></pattern><pattern id="hatchamber" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#fff6e0"/><line x1="0" y1="0" x2="0" y2="12" stroke="#e5c56b" stroke-width="5"/></pattern></defs><rect width="1600" height="650" fill="#fff"/><rect x="20.0" y="20.0" width="770.0" height="610.0" rx="14" fill="#fdeef0" stroke="none" stroke-width="0"/><rect x="810.0" y="20.0" width="770.0" height="610.0" rx="14" fill="#e9f6ec" stroke="none" stroke-width="0"/><text x="405.0" y="70.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="29" fill="#1f2328" text-anchor="middle" font-weight="700">Request and response</text><text x="1195.0" y="70.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="29" fill="#1f2328" text-anchor="middle" font-weight="700">Event on a log</text><rect x="60.0" y="150.0" width="200.0" height="100.0" rx="10" fill="#ddeaf8" stroke="#1f6feb" stroke-width="2.5"/><text x="160.0" y="208.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" fill="#1f2328" text-anchor="middle" font-weight="600">Checkout</text><rect x="310.0" y="150.0" width="200.0" height="100.0" rx="10" fill="#ddeaf8" stroke="#1f6feb" stroke-width="2.5"/><text x="410.0" y="208.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" fill="#1f2328" text-anchor="middle" font-weight="600">Payments</text><rect x="560.0" y="150.0" width="190.0" height="100.0" rx="10" fill="#fde7e9" stroke="#cf222e" stroke-width="2.5"/><text x="655.0" y="208.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" fill="#1f2328" text-anchor="middle" font-weight="600">Email</text><line x1="262.0" y1="200.0" x2="306.0" y2="200.0" stroke="#1f6feb" stroke-width="3.5" marker-end="url(#ah1f6feb)"/><line x1="512.0" y1="200.0" x2="556.0" y2="200.0" stroke="#cf222e" stroke-width="3.5" marker-end="url(#ahcf222e)"/><line x1="637.0" y1="112.0" x2="673.0" y2="148.0" stroke="#cf222e" stroke-width="5"/><line x1="637.0" y1="148.0" x2="673.0" y2="112.0" stroke="#cf222e" stroke-width="5"/><text x="405.0" y="340.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" fill="#cf222e" text-anchor="middle" font-weight="700">Email is down, so the call fails,</text><text x="405.0" y="372.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" fill="#cf222e" text-anchor="middle" font-weight="700">and the failure travels back</text><text x="405.0" y="404.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" fill="#cf222e" text-anchor="middle" font-weight="700">to the customer at checkout.</text><text x="405.0" y="520.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" fill="#57606a" text-anchor="middle" font-weight="600">The caller waits for everyone.</text><text x="405.0" y="550.7" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" fill="#57606a" text-anchor="middle" font-weight="600">Availability multiplies down the chain.</text><rect x="850.0" y="150.0" width="200.0" height="100.0" rx="10" fill="#ddeaf8" stroke="#1f6feb" stroke-width="2.5"/><text x="950.0" y="208.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" fill="#1f2328" text-anchor="middle" font-weight="600">Checkout</text><rect x="1100.0" y="150.0" width="200.0" height="100.0" rx="10" fill="#dff3e4" stroke="#1a7f37" stroke-width="2.5"/><text x="1200.0" y="208.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" fill="#1f2328" text-anchor="middle" font-weight="600">Log</text><rect x="1350.0" y="150.0" width="190.0" height="100.0" rx="10" fill="#fde7e9" stroke="#cf222e" stroke-width="2.5"/><text x="1445.0" y="208.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" fill="#1f2328" text-anchor="middle" font-weight="600">Email</text><line x1="1052.0" y1="200.0" x2="1096.0" y2="200.0" stroke="#1a7f37" stroke-width="3.5" marker-end="url(#ah1a7f37)"/><line x1="1302.0" y1="200.0" x2="1346.0" y2="200.0" stroke="#8c959f" stroke-width="3.5" stroke-dasharray="9 7" marker-end="url(#ah8c959f)"/><line x1="1427.0" y1="112.0" x2="1463.0" y2="148.0" stroke="#cf222e" stroke-width="5"/><line x1="1427.0" y1="148.0" x2="1463.0" y2="112.0" stroke="#cf222e" stroke-width="5"/><text x="1195.0" y="340.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" fill="#1a7f37" text-anchor="middle" font-weight="700">Email is down. The order is taken.</text><text x="1195.0" y="372.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" fill="#1a7f37" text-anchor="middle" font-weight="700">Email catches up from its offset</text><text x="1195.0" y="404.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" fill="#1a7f37" text-anchor="middle" font-weight="700">when it comes back.</text><text x="1195.0" y="520.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" fill="#57606a" text-anchor="middle" font-weight="600">Decoupled in time. Still coupled by</text><text x="1195.0" y="550.7" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" fill="#57606a" text-anchor="middle" font-weight="600">the schema of the event.</text></svg>
