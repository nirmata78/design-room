" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#fff6e0"/><line x1="0" y1="0" x2="0" y2="12" stroke="#e5c56b" stroke-width="5"/></pattern></defs><rect width="1600" height="620" fill="#fff"/><text x="40.0" y="46.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" fill="#1f2328" text-anchor="start" font-weight="700">One topic, two independent consumer groups</text><rect x="660.0" y="100.0" width="280.0" height="84.0" rx="10" fill="#ddeaf8" stroke="#1f6feb" stroke-width="2.5"/><text x="800.0" y="150.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" fill="#1f2328" text-anchor="middle" font-weight="600">Partition 0</text><rect x="660.0" y="215.0" width="280.0" height="84.0" rx="10" fill="#ddeaf8" stroke="#1f6feb" stroke-width="2.5"/><text x="800.0" y="265.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" fill="#1f2328" text-anchor="middle" font-weight="600">Partition 1</text><rect x="660.0" y="330.0" width="280.0" height="84.0" rx="10" fill="#ddeaf8" stroke="#1f6feb" stroke-width="2.5"/><text x="800.0" y="380.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" fill="#1f2328" text-anchor="middle" font-weight="600">Partition 2</text><rect x="660.0" y="445.0" width="280.0" height="84.0" rx="10" fill="#ddeaf8" stroke="#1f6feb" stroke-width="2.5"/><text x="800.0" y="495.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" fill="#1f2328" text-anchor="middle" font-weight="600">Partition 3</text><rect x="30.0" y="90.0" width="460.0" height="450.0" rx="14" fill="#e9f6ec" stroke="none" stroke-width="0"/><text x="46.0" y="121.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" fill="#57606a" text-anchor="start" font-weight="600">Group: fulfilment</text><rect x="90.0" y="150.0" width="330.0" height="120.0" rx="10" fill="#dff3e4" stroke="#1a7f37" stroke-width="2.5"/><text x="255.0" y="203.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" fill="#1f2328" text-anchor="middle" font-weight="600">Consumer A</text><text x="255.0" y="232.7" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" fill="#1f2328" text-anchor="middle" font-weight="400">partitions 0 and 1</text><rect x="90.0" y="370.0" width="330.0" height="120.0" rx="10" fill="#dff3e4" stroke="#1a7f37" stroke-width="2.5"/><text x="255.0" y="423.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" fill="#1f2328" text-anchor="middle" font-weight="600">Consumer B</text><text x="255.0" y="452.7" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" fill="#1f2328" text-anchor="middle" font-weight="400">partitions 2 and 3</text><line x1="656.0" y1="142.0" x2="424.0" y2="210.0" stroke="#1a7f37" stroke-width="3" marker-end="url(#ah1a7f37)"/><line x1="656.0" y1="257.0" x2="424.0" y2="210.0" stroke="#1a7f37" stroke-width="3" marker-end="url(#ah1a7f37)"/><line x1="656.0" y1="372.0" x2="424.0" y2="430.0" stroke="#1a7f37" stroke-width="3" marker-end="url(#ah1a7f37)"/><line x1="656.0" y1="487.0" x2="424.0" y2="430.0" stroke="#1a7f37" stroke-width="3" marker-end="url(#ah1a7f37)"/><rect x="1110.0" y="90.0" width="460.0" height="450.0" rx="14" fill="#fff6e0" stroke="none" stroke-width="0"/><text x="1126.0" y="121.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" fill="#57606a" text-anchor="start" font-weight="600">Group: analytics</text><rect x="1170.0" y="245.0" width="340.0" height="130.0" rx="10" fill="#fff4d6" stroke="#bf8700" stroke-width="2.5"/><text x="1340.0" y="303.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" fill="#1f2328" text-anchor="middle" font-weight="600">Consumer C</text><text x="1340.0" y="332.7" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" fill="#1f2328" text-anchor="middle" font-weight="400">all four partitions</text><line x1="944.0" y1="142.0" x2="1166.0" y2="310.0" stroke="#bf8700" stroke-width="3" marker-end="url(#ahbf8700)"/><line x1="944.0" y1="257.0" x2="1166.0" y2="310.0" stroke="#bf8700" stroke-width="3" marker-end="url(#ahbf8700)"/><line x1="944.0" y1="372.0" x2="1166.0" y2="310.0" stroke="#bf8700" stroke-width="3" marker-end="url(#ahbf8700)"/><line x1="944.0" y1="487.0" x2="1166.0" y2="310.0" stroke="#bf8700" stroke-width="3" marker-end="url(#ahbf8700)"/><text x="800.0" y="590.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" fill="#57606a" text-anchor="middle" font-weight="600">Inside a group, one partition has one reader. So partitions cap a group&#x27;s parallelism.</text></svg>
