<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" width="1600" height="620"><defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="a-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker><marker id="a-white" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="800" y="40" font-size="28" text-anchor="middle" font-weight="bold" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="800" dy="0">Multi-Paxos: one election, then one round trip per log slot</tspan></text><rect x="60" y="110" width="300" height="150" rx="14" fill="#fef3c7" stroke="#b45309" stroke-width="3"/><text x="210.0" y="142" font-size="24" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="210.0" dy="0">Leader elected</tspan><tspan x="210.0" dy="29">once</tspan><tspan x="210.0" dy="29">Phase 1 for all</tspan><tspan x="210.0" dy="29">future slots</tspan></text><rect x="430" y="110" width="155" height="150" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="507.5" y="185" font-size="24" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="507.5" dy="0">slot 1</tspan></text><rect x="605" y="110" width="155" height="150" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="682.5" y="185" font-size="24" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="682.5" dy="0">slot 2</tspan></text><rect x="780" y="110" width="155" height="150" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="857.5" y="185" font-size="24" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="857.5" dy="0">slot 3</tspan></text><rect x="955" y="110" width="155" height="150" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="1032.5" y="185" font-size="24" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="1032.5" dy="0">slot 4</tspan></text><rect x="1130" y="110" width="155" height="150" rx="14" fill="#fef3c7" stroke="#b45309" stroke-width="3"/><text x="1207.5" y="185" font-size="24" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="1207.5" dy="0">slot 5</tspan></text><rect x="1305" y="110" width="155" height="150" rx="14" fill="#f3f4f6" stroke="#4b5563" stroke-width="3"/><text x="1382.5" y="185" font-size="24" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="1382.5" dy="0">slot 6</tspan></text><text x="858" y="300" font-size="23" text-anchor="middle" font-weight="bold" fill="#15803d" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="858" dy="0">each slot needs only Phase 2: Accept, then Accepted</tspan></text><text x="1383" y="347" font-size="22" text-anchor="middle" font-weight="bold" fill="#b45309" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="1383" dy="0">empty: a no-op fills</tspan><tspan x="1383" dy="26">it on recovery</tspan></text><line x1="210" y1="262" x2="210" y2="330" stroke="#b45309" stroke-width="3" marker-end="url(#a-amber)"/><rect x="60" y="340" width="1040" height="100" rx="14" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/><text x="580.0" y="390" font-size="24" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="580.0" dy="0">Leader dies: a new leader runs Phase 1 once, learns what any majority accepted, and carries on</tspan></text><rect x="60" y="480" width="1480" height="100" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="800.0" y="530" font-size="24" text-anchor="middle" font-weight="bold" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="800.0" dy="0">Cost in steady state: the same as the replicated state machine, one round trip to a majority per command</tspan></text></svg>