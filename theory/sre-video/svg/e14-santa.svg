inant-baseline="middle"><tspan x="820" dy="0">25x: over a million a second</tspan></text><rect x="1080" y="120" width="480" height="330" rx="14" fill="#fef3c7" stroke="#b45309" stroke-width="3"/><text x="1320.0" y="285" font-size="24" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="1320.0" dy="0"></tspan></text><text x="1320" y="155" font-size="24" text-anchor="middle" font-weight="bold" fill="#b45309" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="1320" dy="0">What made it a hard launch</tspan></text><text x="1110" y="230" font-size="25" text-anchor="start" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="1110" dy="0">•  a hard deadline</tspan></text><text x="1110" y="285" font-size="25" text-anchor="start" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="1110" dy="0">•  huge publicity</tspan></text><text x="1110" y="340" font-size="25" text-anchor="start" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="1110" dy="0">•  an audience of millions</tspan></text><text x="1110" y="395" font-size="25" text-anchor="start" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="1110" dy="0">•  a very steep ramp-up</tspan></text></svg>