<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" width="1600" height="640"><defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="a-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker><marker id="a-white" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><line x1="300" y1="540" x2="1000" y2="540" stroke="#4b5563" stroke-width="3"/><line x1="300" y1="540" x2="300" y2="90" stroke="#4b5563" stroke-width="3"/><text transform="translate(190,315.0) rotate(-90)" font-size="22" text-anchor="middle" fill="#374151" font-family="Helvetica, Arial, sans-serif">Requests per second, as a multiple of normal peak</text><text x="280" y="540" font-size="21" text-anchor="end" font-weight="normal" fill="#374151" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="280" dy="0">0x</tspan></text><text x="280" y="459" font-size="21" text-anchor="end" font-weight="normal" fill="#374151" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="280" dy="0">5x</tspan></text><text x="280" y="377" font-size="21" text-anchor="end"