<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 780" width="1600" height="780"><defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="a-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker><marker id="a-white" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="280" y="100" width="380" height="120" rx="14" fill="#fef3c7" stroke="#b45309" stroke-width="3"/><text x="470.0" y="146" font-size="24" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="470.0" dy="0">A short spike</tspan><tspan x="470.0" dy="29">overloads the service</tspan></text><rect x="940" y="100" width="380" height="120" rx="14" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/><text x="1130.0" y="146" font-size="24" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="1130.0" dy="0">Requests slow;</tspan><tspan x="1130.0" dy="29">clients time out</tspan></text><rect x="940" y="490" width="380" height="120" rx="14" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/><text x="1130.0" y="536" font-size="24" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="1130.0" dy="0">Clients retry:</tspan><tspan x="1130.0" dy="29">more load</tspan></text><rect x="280" y="490" width="380" height="120" rx="14" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/><text x="470.0" y="536" font-size="24" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="470.0" dy="0">Queues grow;</tspan><tspan x="470.0" dy="29">caches go cold</tspan></text><line x1="660" y1="160" x2="940" y2="160" stroke="#1d4ed8" stroke-width="4" marker-end="url(#a-blue)"/><line x1="1130" y1="220" x2="1130" y2="490" stroke="#1d4ed8" stroke-width="4" marker-end="url(#a-blue)"/><line x1="940" y1="550" x2="660" y2="550" stroke="#1d4ed8" stroke-width="4" marker-end="url(#a-blue)"/><line x1="470" y1="490" x2="470" y2="220" stroke="#b91c1c" stroke-width="4" marker-end="url(#a-red)"/><text x="360" y="347" font-size="22" text-anchor="middle" font-weight="bold" fill="#b91c1c" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="360" dy="0">load stays</tspan><tspan x="360" dy="26">above capacity</tspan></text><text x="800" y="334" font-size="26" text-anchor="middle" font-weight="bold" fill="#b91c1c" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="800" dy="0">The trigger is gone.</tspan><tspan x="800" dy="31">The loop sustains the outage.</tspan></text><rect x="580" y="670" width="440" height="80" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="800.0" y="710" font-size="23" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="800.0" dy="0">Break it: shed load, cut retries</tspan></text></svg>