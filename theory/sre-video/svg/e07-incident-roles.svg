ll="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="300.0" dy="0">Operations lead</tspan></text><text x="300.0" y="354" font-size="22" text-anchor="middle" font-weight="normal" fill="#374151" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="300.0" dy="0">the only role that</tspan><tspan x="300.0" dy="26">changes the system</tspan></text><line x1="800" y1="160" x2="300" y2="280" stroke="#4b5563" stroke-width="4" marker-end="url(#a-grey)"/><rect x="620" y="280" width="360" height="130" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="800.0" y="328" font-size="25" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="800.0" dy="0">Communications lead</tspan></text><text x="800.0" y="354" font-size="22" text-anchor="middle" font-weight="normal" fill="#374151" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="800.0" dy="0">the single voice to</tspan><tspan x="800.0" dy="26">stakeholders and customers</tspan></text><line x1="800" y1="160" x2="800" y2="280" stroke="#4b5563" stroke-width="4" marker-end="url(#a-grey)"/><rect x="1120" y="280" width="360" height="130" rx="14" fill="#fef3c7" stroke="#b45309" stroke-width="3"/><text x="1300.0" y="328" font-size="25" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="1300.0" dy="0">Planning lead</tspan></text><text x="1300.0" y="354" font-size="22" text-anchor="middle" font-weight="normal" fill="#374151" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="1300.0" dy="0">bugs, handoffs, logistics,</tspan><tspan x="1300.0" dy="26">the longer-running work</tspan></text><line x1="800" y1="160" x2="1300" y2="280" stroke="#4b5563" stroke-width="4" marker-end="url(#a-grey)"/><rect x="120" y="490" width="360" height="90" rx="1