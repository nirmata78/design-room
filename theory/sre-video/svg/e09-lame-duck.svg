<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" width="1600" height="640"><defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="a-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker><marker id="a-white" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="80" y="150" font-size="26" text-anchor="middle" font-weight="bold" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="80" dy="0">Task</tspan></text><text x="80" y="330" font-size="26" text-anchor="middle" font-weight="bold" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="80" dy="0">Clients</tspan></text><rect x="160" y="90" width="352" height="130" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="336.0" y="155" font-size="21" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="336.0" dy="0">Serving</tspan></text><rect x="520" y="90" width="352" height="130" rx="14" fill="#fef3c7" stroke="#b45309" stroke-width="3"/><text x="696.0" y="130" font-size="21" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="696.0" dy="0">Lame duck:</tspan><tspan x="696.0" dy="25">still working, asks</tspan><tspan x="696.0" dy="25">for no new requests</tspan></text><rect x="880" y="90" width="312" height="130" rx="14" fill="#fef3c7" stroke="#b45309" stroke-width="3"/><text x="1036.0" y="142" font-size="21" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="1036.0" dy="0">Draining:</tspan><tspan x="1036.0" dy="25">finishing in-flight</tspan></text><rect x="1200" y="90" width="292" height="130" rx="14" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/><text x="1346.0" y="155" font-size="21" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="1346.0" dy="0">Stopped</tspan></text><rect x="160" y="270" width="360" height="110" rx="14" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/><text x="340.0" y="325" font-size="23" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="340.0" dy="0">Send to this task</tspan></text><rect x="520" y="270" width="980" height="110" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="1010.0" y="325" font-size="24" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="1010.0" dy="0">Shift new requests to other tasks; no request is dropped</tspan></text><text x="800" y="466" font-size="24" text-anchor="middle" font-weight="normal" fill="#374151" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="800" dy="0">Flow control reacts to trouble (a limit near 100 active requests).</tspan><tspan x="800" dy="29">The lame duck state avoids the trouble.</tspan></text><text x="800" y="570" font-size="23" text-anchor="middle" font-weight="bold" fill="#b91c1c" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="800" dy="0">The drain time must exceed the longest request in flight</tspan></text></svg>