<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700"><defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="a-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker><marker id="a-white" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="150" width="150" height="150" rx="14" fill="#f3f4f6" stroke="#4b5563" stroke-width="3"/><text x="115.0" y="225" font-size="22" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="115.0" dy="0">Client</tspan></text><rect x="310" y="150" width="230" height="150" rx="14" fill="#fef3c7" stroke="#b45309" stroke-width="3"/><text x="425.0" y="199" font-size="22" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="425.0" dy="0">Gateway:</tspan><tspan x="425.0" dy="26">admission control</tspan><tspan x="425.0" dy="26">by tokens or compute</tspan></text><line x1="190" y1="225.0" x2="310" y2="225.0" stroke="#1d4ed8" stroke-width="4" marker-end="url(#a-blue)"/><rect x="640" y="150" width="220" height="150" rx="14" fill="#fef3c7" stroke="#b45309" stroke-width="3"/><text x="750.0" y="212" font-size="22" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="750.0" dy="0">Bounded queue</tspan><tspan x="750.0" dy="26">with deadlines</tspan></text><line x1="540" y1="225.0" x2="640" y2="225.0" stroke="#1d4ed8" stroke-width="4" marker-end="url(#a-blue)"/><rect x="960" y="150" width="260" height="150" rx="14" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/><text x="1090.0" y="199" font-size="22" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="1090.0" dy="0">Model servers on</tspan><tspan x="1090.0" dy="26">accelerators</tspan><tspan x="1090.0" dy="26">(scarce, slow to scale)</tspan></text><line x1="860" y1="225.0" x2="960" y2="225.0" stroke="#1d4ed8" stroke-width="4" marker-end="url(#a-blue)"/><rect x="1330" y="150" width="200" height="150" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="1430.0" y="225" font-size="22" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="1430.0" dy="0">Response</tspan></text><line x1="1220" y1="225.0" x2="1330" y2="225.0" stroke="#1d4ed8" stroke-width="4" marker-end="url(#a-blue)"/><rect x="960" y="360" width="260" height="80" rx="14" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/><text x="1090.0" y="400" font-size="22" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="1090.0" dy="0">Cache of answers</tspan></text><line x1="1090" y1="360" x2="1090" y2="300" stroke="#1d4ed8" stroke-width="4" marker-end="url(#a-blue)"/><rect x="1260" y="360" width="280" height="80" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="1400.0" y="387" font-size="21" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="1400.0" dy="0">Smaller model:</tspan><tspan x="1400.0" dy="25">degraded mode</tspan></text><line x1="1400" y1="360" x2="1400" y2="300" stroke="#15803d" stroke-width="4" marker-end="url(#a-green)"/><rect x="40" y="540" width="1500" height="110" rx="14" fill="#f3f4f6" stroke="#4b5563" stroke-width="3" stroke-dasharray="10 6"/><text x="790.0" y="595" font-size="24" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="790.0" dy="0"></tspan></text><text x="790" y="575" font-size="24" text-anchor="middle" font-weight="bold" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="790" dy="0">Changes that can fail: model version, prompt, retrieval data</tspan></text><text x="790" y="620" font-size="24" text-anchor="middle" font-weight="bold" fill="#15803d" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="790" dy="0">→ staged rollout, with evaluation as the health gate and an instant revert</tspan></text><text x="800" y="60" font-size="25" text-anchor="middle" font-weight="bold" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="800" dy="0">Admission control counts work in tokens, not requests: one request can cost 100x another</tspan></text></svg>