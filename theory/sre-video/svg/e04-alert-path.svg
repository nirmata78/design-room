if" dominant-baseline="middle"><tspan x="353.0" dy="0">Collector</tspan><tspan x="353.0" dy="26">scrapes</tspan><tspan x="353.0" dy="26">every 15 s</tspan></text><text x="353.0" y="338" font-size="23" text-anchor="middle" font-weight="bold" fill="#1d4ed8" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="353.0" dy="0">up to 15 s</tspan></text><line x1="220" y1="230.0" x2="258" y2="230.0" stroke="#1d4ed8" stroke-width="4" marker-end="url(#a-blue)"/><rect x="486" y="160" width="190" height="140" rx="14" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/><text x="581.0" y="217" font-size="22" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="581.0" dy="0">Time-series</tspan><tspan x="581.0" dy="26">store</tspan></text><line x1="448" y1="230.0" x2="486" y2="230.0" stroke="#1d4ed8" stroke-width="4" marker-end="url(#a-blue)"/><rect x="714" y="160" width="190" height="140" rx="14" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/><text x="809.0" y="204" font-size="22" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="809.0" dy="0">Rule engine</tspan><tspan x="809.0" dy="26">evaluates</tspan><tspan x="809.0" dy="26">every 15 s</tspan></text><text x="809.0" y="338" font-size="23" text-anchor="middle" font-weight="bold" fill="#1d4ed8" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="809.0" dy="0">up to 15 s</tspan></text><line x1="676" y1="230.0" x2="714" y2="230.0" stroke="#1d4ed8" stroke-width="4" marker-end="url(#a-blue)"/><rect x="942" y="160" width="190" height="140" rx="14" fill="#fef3c7" stroke="#b45309" stroke-width="3"/><text x="1037.0" y="217" font-size="22" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="1037.0" dy="0">Hold time</tspan><tspan x="1037.0" dy="26">2 minutes</tspan></text><text x="1037.0" y="338" font-size="23" text-anchor="middle" font-weight="bold" fill="#b45309" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="1037.0" dy="0">120 s</tspan></text><line x1="904" y1="230.0" x2="942" y2="230.0" stroke="#1d4ed8" stroke-width="4" marker-end="url(#a-blue)"/><rect x="1170" y="160" width="190" height="140" rx="14" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/><text x="1265.0" y="217" font-size="22" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="1265.0" dy="0">Alert manager</tspan><tspan x="1265.0" dy="26">groups, routes</tspan></text><text x="1265.0" y="338" font-size="23" text-anchor="middle" font-weight="bold" fill="#1d4ed8" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="1265.0" dy="0">30 s</tspan></text><line x1="1132" y1="230.0" x2="1170" y2="230.0" stroke="#1d4ed8" stroke-width="4" marker-end="url(#a-blue)"/><rect x="1398" y="160" width="190" height="140" rx="14" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/><text x="1493.0" y="217" font-size="22" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="1493.0" dy="0">Page on</tspan><tspan x="1493.0" dy="26">a phone</tspan></text><line x1="1360" y1="230.0" x2="1398" y2="230.0" stroke="#1d4ed8" stroke-width="4" marker-end="url(#a-blue)"/><text x="800" y="70" font-size="28" text-anchor="middle" font-weight="bold" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="800" dy="0">Every arrow adds delay. Their sum is your time to detect.</tspan></text><text x="800" y="440" font-size="28" text-anchor="middle" font-weight="bold" fill="#b91c1c" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="800" dy="0">worst case: 15 + 15 + 120 + 30 = 180 seconds</tspan></text><text x="800" y="495" font-size="21" text-anchor="middle" font-weight="normal" fill="#6b7280" font-family="Helvetica, Arial, sans-serif" font-style="italic" dominant-baseline="middle"><tspan x="800" dy="0">illustrative values</tspan></text></svg>