<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" width="1600" height="720"><defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="a-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker><marker id="a-white" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="560" y="40" width="480" height="190" rx="14" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/><text x="800.0" y="135" font-size="24" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="800.0" dy="0"></tspan></text><text x="800" y="75" font-size="25" text-anchor="middle" font-weight="bold" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="800" dy="0">Coordinator (task master)</tspan></text><text x="800" y="124" font-size="22" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="800" dy="0">state of every unit of work,</tspan><tspan x="800" dy="26">as pointers to uniquely</tspan><tspan x="800" dy="26">named data, plus leases</tspan></text><rect x="120" y="330" width="380" height="120" rx="14" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/><text x="310.0" y="376" font-size="23" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="310.0" dy="0">Worker 1</tspan><tspan x="310.0" dy="28">lease expired: orphan</tspan></text><rect x="1100" y="330" width="380" height="120" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="1290.0" y="376" font-size="23" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="1290.0" dy="0">Worker 2</tspan><tspan x="1290.0" dy="28">holds the valid lease</tspan></text><line x1="1290" y1="330" x2="1040" y2="190" stroke="#15803d" stroke-width="4" marker-end="url(#a-green)"/><text x="1250" y="250" font-size="22" text-anchor="middle" font-weight="bold" fill="#15803d" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="1250" dy="0">commit: accepted</tspan></text><line x1="310" y1="330" x2="560" y2="190" stroke="#b91c1c" stroke-width="4" marker-end="url(#a-red)"/><text x="330" y="250" font-size="22" text-anchor="middle" font-weight="bold" fill="#b91c1c" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="330" dy="0">commit: refused</tspan></text><rect x="120" y="560" width="380" height="90" rx="14" fill="#f3f4f6" stroke="#4b5563" stroke-width="3"/><text x="310.0" y="605" font-size="21" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="310.0" dy="0">out-w1-7f3  (unique name)</tspan></text><rect x="1100" y="560" width="380" height="90" rx="14" fill="#f3f4f6" stroke="#4b5563" stroke-width="3"/><text x="1290.0" y="605" font-size="21" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="1290.0" dy="0">out-w2-a91  (unique name)</tspan></text><line x1="310" y1="450" x2="310" y2="560" stroke="#b91c1c" stroke-width="4" stroke-dasharray="10 7" marker-end="url(#a-red)"/><line x1="1290" y1="450" x2="1290" y2="560" stroke="#15803d" stroke-width="4" marker-end="url(#a-green)"/><text x="800" y="371" font-size="24" text-anchor="middle" font-weight="bold" fill="#374151" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="800" dy="0">Double guarantee:</tspan><tspan x="800" dy="29">unique outputs, and state</tspan><tspan x="800" dy="29">controlled by leases</tspan></text><text x="800" y="620" font-size="23" text-anchor="middle" font-weight="bold" fill="#b91c1c" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="800" dy="0">An orphan can keep writing, but only to its own file</tspan></text></svg>