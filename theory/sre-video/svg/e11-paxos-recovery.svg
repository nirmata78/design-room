<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" width="1600" height="760"><defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="a-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker><marker id="a-white" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="90" y="40" width="260" height="70" rx="14" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/><text x="220.0" y="75" font-size="24" text-anchor="middle" font-weight="bold" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="220.0" dy="0">Proposer P2</tspan></text><line x1="220" y1="110" x2="220" y2="690" stroke="#4b5563" stroke-width="3" stroke-dasharray="10 7"/><rect x="570" y="40" width="260" height="70" rx="14" fill="#f3f4f6" stroke="#4b5563" stroke-width="3"/><text x="700.0" y="75" font-size="24" text-anchor="middle" font-weight="bold" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="700.0" dy="0">Acceptor 2</tspan></text><line x1="700" y1="110" x2="700" y2="690" stroke="#4b5563" stroke-width="3" stroke-dasharray="10 7"/><rect x="1050" y="40" width="260" height="70" rx="14" fill="#f3f4f6" stroke="#4b5563" stroke-width="3"/><text x="1180.0" y="75" font-size="24" text-anchor="middle" font-weight="bold" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="1180.0" dy="0">Acceptor 3</tspan></text><line x1="1180" y1="110" x2="1180" y2="690" stroke="#4b5563" stroke-width="3" stroke-dasharray="10 7"/><text x="60" y="175" font-size="26" text-anchor="start" font-weight="bold" fill="#1d4ed8" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="60" dy="0">Later</tspan></text><text x="800" y="150" font-size="24" text-anchor="middle" font-weight="normal" fill="#374151" font-family="Helvetica, Arial, sans-serif" font-style="italic" dominant-baseline="middle"><tspan x="800" dy="0">P2 wants value Y, and does not know X was chosen</tspan></text><line x1="220" y1="220" x2="700" y2="220" stroke="#1d4ed8" stroke-width="4" marker-end="url(#a-blue)"/><text x="460" y="195" font-size="23" text-anchor="middle" font-weight="bold" fill="#1d4ed8" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="460" dy="0">Prepare(2)</tspan></text><line x1="220" y1="270" x2="1180" y2="270" stroke="#1d4ed8" stroke-width="3" marker-end="url(#a-blue)"/><text x="930" y="250" font-size="23" text-anchor="middle" font-weight="bold" fill="#1d4ed8" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="930" dy="0">Prepare(2)</tspan></text><line x1="700" y1="360" x2="220" y2="360" stroke="#b91c1c" stroke-width="4" stroke-dasharray="10 7" marker-end="url(#a-red)"/><text x="460" y="335" font-size="23" text-anchor="middle" font-weight="bold" fill="#b91c1c" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="460" dy="0">Promise(2): I already accepted (1, X)</tspan></text><line x1="1180" y1="430" x2="220" y2="430" stroke="#15803d" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#a-green)"/><text x="960" y="410" font-size="23" text-anchor="middle" font-weight="bold" fill="#15803d" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="960" dy="0">Promise(2): nothing accepted</tspan></text><rect x="120" y="490" width="1360" height="90" rx="14" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/><text x="800.0" y="535" font-size="25" text-anchor="middle" font-weight="bold" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="800.0" dy="0">A majority answered. One reply carries an accepted value, so P2 must propose X, not Y</tspan></text><line x1="220" y1="640" x2="700" y2="640" stroke="#1d4ed8" stroke-width="4" marker-end="url(#a-blue)"/><text x="460" y="615" font-size="23" text-anchor="middle" font-weight="bold" fill="#1d4ed8" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="460" dy="0">Accept(2, X)</tspan></text><line x1="220" y1="690" x2="1180" y2="690" stroke="#1d4ed8" stroke-width="3" marker-end="url(#a-blue)"/><text x="930" y="670" font-size="23" text-anchor="middle" font-weight="bold" fill="#1d4ed8" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="930" dy="0">Accept(2, X)</tspan></text></svg>