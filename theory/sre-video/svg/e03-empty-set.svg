<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700"><defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="a-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker><marker id="a-white" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="90" width="330" height="110" rx="14" fill="#f3f4f6" stroke="#4b5563" stroke-width="3"/><text x="205.0" y="131" font-size="24" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="205.0" dy="0">Decommission</tspan><tspan x="205.0" dy="29">the rack</tspan></text><rect x="430" y="90" width="330" height="110" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="595.0" y="131" font-size="24" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="595.0" dy="0">Step 1: erase disks</tspan><tspan x="595.0" dy="29">succeeds</tspan></text><rect x="820" y="90" width="330" height="110" rx="14" fill="#fef3c7" stroke="#b45309" stroke-width="3"/><text x="985.0" y="131" font-size="24" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="985.0" dy="0">A later step fails.</tspan><tspan x="985.0" dy="29">Job is restarted</tspan></text><rect x="1210" y="90" width="330" height="110" rx="14" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/><text x="1375.0" y="131" font-size="24" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="1375.0" dy="0">Machines still needing</tspan><tspan x="1375.0" dy="29">erase: none (empty)</tspan></text><line x1="370" y1="145" x2="430" y2="145" stroke="#1d4ed8" stroke-width="4" marker-end="url(#a-blue)"/><line x1="760" y1="145" x2="820" y2="145" stroke="#1d4ed8" stroke-width="4" marker-end="url(#a-blue)"/><line x1="1150" y1="145" x2="1210" y2="145" stroke="#1d4ed8" stroke-width="4" marker-end="url(#a-blue)"/><rect x="1210" y="330" width="330" height="130" rx="14" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/><text x="1375.0" y="381" font-size="24" text-anchor="middle" font-weight="bold" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="1375.0" dy="0">The tool reads an empty</tspan><tspan x="1375.0" dy="29">list as "everything"</tspan></text><line x1="1375" y1="200" x2="1375" y2="330" stroke="#b91c1c" stroke-width="4" marker-end="url(#a-red)"/><rect x="700" y="330" width="440" height="130" rx="14" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/><text x="920.0" y="381" font-size="24" text-anchor="middle" font-weight="bold" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="920.0" dy="0">Nearly the whole fleet is</tspan><tspan x="920.0" dy="29">sent to be wiped</tspan></text><line x1="1210" y1="395" x2="1140" y2="395" stroke="#b91c1c" stroke-width="4" marker-end="url(#a-red)"/><text x="700" y="507" font-size="22" text-anchor="start" font-weight="normal" fill="#374151" font-family="Helvetica, Arial, sans-serif" font-style="italic" dominant-baseline="middle"><tspan x="700" dy="0">Content delivery machines lost their disks within minutes.</tspan><tspan x="700" dy="26">Users were still served from the datacenters.</tspan></text><rect x="40" y="330" width="590" height="270" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="3" stroke-dasharray="10 6"/><text x="335.0" y="465" font-size="24" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="335.0" dy="0"></tspan></text><text x="335" y="365" font-size="24" text-anchor="middle" font-weight="bold" fill="#15803d" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="335" dy="0">Guardrails that bound the blast radius</tspan></text><text x="70" y="415" font-size="23" text-anchor="start" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="70" dy="0">•  rate limit: N machines per hour</tspan></text><text x="70" y="453" font-size="23" text-anchor="start" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="70" dy="0">•  fraction limit: a few percent of a pool</tspan></text><text x="70" y="491" font-size="23" text-anchor="start" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="70" dy="0">•  input check: empty or unusually large stops</tspan></text><text x="70" y="529" font-size="23" text-anchor="start" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="70" dy="0">•  human gate for large actions</tspan></text><text x="70" y="567" font-size="23" text-anchor="start" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="70" dy="0">•  dry run first</tspan></text></svg>