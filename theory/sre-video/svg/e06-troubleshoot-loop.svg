<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700"><defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="a-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker><marker id="a-white" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="60" y="190" width="260" height="120" rx="14" fill="#f3f4f6" stroke="#4b5563" stroke-width="3"/><text x="190.0" y="236" font-size="24" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="190.0" dy="0">Problem</tspan><tspan x="190.0" dy="29">report</tspan></text><rect x="360" y="190" width="260" height="120" rx="14" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/><text x="490.0" y="236" font-size="24" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="490.0" dy="0">Triage:</tspan><tspan x="490.0" dy="29">stop the bleeding</tspan></text><line x1="320" y1="250.0" x2="360" y2="250.0" stroke="#1d4ed8" stroke-width="4" marker-end="url(#a-blue)"/><rect x="660" y="190" width="260" height="120" rx="14" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/><text x="790.0" y="236" font-size="24" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="790.0" dy="0">Examine:</tspan><tspan x="790.0" dy="29">metrics, logs, traces</tspan></text><line x1="620" y1="250.0" x2="660" y2="250.0" stroke="#1d4ed8" stroke-width="4" marker-end="url(#a-blue)"/><rect x="960" y="190" width="260" height="120" rx="14" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/><text x="1090.0" y="236" font-size="24" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="1090.0" dy="0">Hypothesise</tspan><tspan x="1090.0" dy="29">a cause</tspan></text><line x1="920" y1="250.0" x2="960" y2="250.0" stroke="#1d4ed8" stroke-width="4" marker-end="url(#a-blue)"/><rect x="1260" y="190" width="260" height="120" rx="14" fill="#fef3c7" stroke="#b45309" stroke-width="3"/><text x="1390.0" y="236" font-size="24" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="1390.0" dy="0">Test it:</tspan><tspan x="1390.0" dy="29">change one thing</tspan></text><line x1="1220" y1="250.0" x2="1260" y2="250.0" stroke="#1d4ed8" stroke-width="4" marker-end="url(#a-blue)"/><line x1="1460" y1="190" x2="1460" y2="110" stroke="#b91c1c" stroke-width="4" stroke-dasharray="10 7"/><line x1="1460" y1="110" x2="790.0" y2="110" stroke="#b91c1c" stroke-width="4" stroke-dasharray="10 7"/><line x1="790.0" y1="110" x2="790.0" y2="190" stroke="#b91c1c" stroke-width="4" stroke-dasharray="10 7" marker-end="url(#a-red)"/><text x="1125.0" y="70" font-size="24" text-anchor="middle" font-weight="bold" fill="#b91c1c" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="1125.0" dy="0">no: that is a result. Learn from it, go round again</tspan></text><rect x="1100" y="490" width="440" height="100" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="1320.0" y="540" font-size="25" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="1320.0" dy="0">Treat the cause</tspan></text><line x1="1390" y1="310" x2="1320" y2="490" stroke="#15803d" stroke-width="4" marker-end="url(#a-green)"/><text x="1360" y="385" font-size="24" text-anchor="middle" font-weight="bold" fill="#15803d" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="1360" dy="0">yes</tspan></text><rect x="560" y="490" width="440" height="100" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="780.0" y="526" font-size="23" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="780.0" dy="0">Cure: make sure it cannot</tspan><tspan x="780.0" dy="28">happen the same way</tspan></text><line x1="1100" y1="540" x2="1000" y2="540" stroke="#15803d" stroke-width="4" marker-end="url(#a-green)"/><text x="300" y="526" font-size="24" text-anchor="middle" font-weight="bold" fill="#b91c1c" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="300" dy="0">A negative result is knowledge.</tspan><tspan x="300" dy="29">Write it down.</tspan></text></svg>