<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" width="1600" height="640"><defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="a-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker><marker id="a-white" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="150" width="340" height="230" rx="14" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/><text x="210.0" y="245" font-size="28" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="210.0" dy="0">1  DNS</tspan></text><text x="210.0" y="290" font-size="25" text-anchor="middle" font-weight="normal" fill="#374151" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="210.0" dy="0">picks a datacenter</tspan></text><text x="210.0" y="435" font-size="21" text-anchor="middle" font-weight="normal" fill="#374151" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="210.0" dy="0">near the user, not full or down</tspan></text><rect x="440" y="150" width="340" height="230" rx="14" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/><text x="610.0" y="245" font-size="28" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="610.0" dy="0">2  Virtual IP</tspan></text><text x="610.0" y="290" font-size="25" text-anchor="middle" font-weight="normal" fill="#374151" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="610.0" dy="0">picks a front end</tspan></text><text x="610.0" y="435" font-size="21" text-anchor="middle" font-weight="normal" fill="#374151" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="610.0" dy="0">shared address, network balancer</tspan></text><line x1="380" y1="265.0" x2="440" y2="265.0" stroke="#1d4ed8" stroke-width="4" marker-end="url(#a-blue)"/><rect x="840" y="150" width="340" height="230" rx="14" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/><text x="1010.0" y="245" font-size="28" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="1010.0" dy="0">3  Front end</tspan></text><text x="1010.0" y="290" font-size="25" text-anchor="middle" font-weight="normal" fill="#374151" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="1010.0" dy="0">picks a service</tspan></text><text x="1010.0" y="435" font-size="21" text-anchor="middle" font-weight="normal" fill="#374151" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="1010.0" dy="0">terminates the connection, makes the RPC</tspan></text><line x1="780" y1="265.0" x2="840" y2="265.0" stroke="#1d4ed8" stroke-width="4" marker-end="url(#a-blue)"/><rect x="1240" y="150" width="340" height="230" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="1410.0" y="245" font-size="28" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" 