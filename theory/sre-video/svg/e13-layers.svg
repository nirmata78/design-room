<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" width="1600" height="720"><defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="a-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker><marker id="a-white" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><line x1="220" y1="90" x2="1540" y2="90" stroke="#4b5563" stroke-width="5" marker-end="url(#a-grey)"/><circle cx="240" cy="90" r="12" fill="#15803d"/><text x="240" y="48" font-size="23" text-anchor="middle" font-weight="bold" fill="#15803d" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="240" dy="0">Live</tspan></text><circle cx="620" cy="90" r="12" fill="#b91c1c"/><text x="620" y="48" font-size="23" text-anchor="middle" font-weight="bold" fill="#b91c1c" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="620" dy="0">Deleted by a bug</tspan></text><circle cx="1060" cy="90" r="12" fill="#4b5563"/><text x="1060" y="48" font-size="23" text-anchor="middle" font-weight="bold" fill="#4b5563" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="1060" dy="0">Destroyed</tspan></text><text x="110" y="197" font-size="21" text-anchor="middle" font-weight="bold" fill="#15803d" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="110" dy="0">Layer 1</tspan><tspan x="110" dy="25">Soft deletion</tspan></text><rect x="620" y="170" width="440" height="80" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="840.0" y="210" font-size="23" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="840.0" dy="0">hidden, recoverable for a window</tspan></text><text x="110" y="317" font-size="21" text-anchor="middle" font-weight="bold" fill="#1d4ed8" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="110" dy="0">Layer 2</tspan><tspan x="110" dy="25">Backups</tspan></text><rect x="220" y="290" width="1320" height="80" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/><text x="880.0" y="330" font-size="23" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="880.0" dy="0">an older, separate copy to restore from</tspan></text><text x="110" y="437" font-size="21" text-anchor="middle" font-weight="bold" fill="#b45309" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="110" dy="0">Layer 3</tspan><tspan x="110" dy="25">Early detection</tspan></text><rect x="220" y="410" width="1320" height="80" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="3"/><text x="880.0" y="450" font-size="23" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="880.0" dy="0">out-of-band validators: counts, checksums, references</tspan></text><text x="110" y="570" font-size="21" text-anchor="middle" font-weight="bold" fill="#b91c1c" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="110" dy="0">Replication</tspan></text><rect x="220" y="530" width="1320" height="80" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/><text x="880.0" y="570" font-size="23" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="880.0" dy="0">copies the mistake to every replica within seconds</tspan></text><text x="900" y="660" font-size="23" text-anchor="middle" font-weight="normal" fill="#374151" font-family="Helvetica, Arial, sans-serif" font-style="italic" dominant-baseline="middle"><tspan x="900" dy="0">Early detection is what makes the other layers usable: a restore point only helps if you notice in time</tspan></text></svg>