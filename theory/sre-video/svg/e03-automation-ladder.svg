<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" width="1600" height="720"><defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="a-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker><marker id="a-white" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="500" width="280" height="150" rx="14" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/><text x="180.0" y="558" font-size="24" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="180.0" dy="0">1  No automation</tspan></text><text x="180.0" y="584" font-size="21" text-anchor="middle" font-weight="normal" fill="#374151" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="180.0" dy="0">Master failed</tspan><tspan x="180.0" dy="25">over by hand</tspan></text><rect x="345" y="410" width="280" height="150" rx="14" fill="#fef3c7" stroke="#b45309" stroke-width="3"/><text x="485.0" y="468" font-size="24" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="485.0" dy="0">2  One person's script</tspan></text><text x="485.0" y="494" font-size="21" text-anchor="middle" font-weight="normal" fill="#374151" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="485.0" dy="0">A failover script in a</tspan><tspan x="485.0" dy="25">home directory</tspan></text><rect x="650" y="320" width="280" height="150" rx="14" fill="#fef3c7" stroke="#b45309" stroke-width="3"/><text x="790.0" y="378" font-size="24" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="790.0" dy="0">3  Shared script</tspan></text><text x="790.0" y="404" font-size="21" text-anchor="middle" font-weight="normal" fill="#374151" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="790.0" dy="0">Everyone uses one</tspan><tspan x="790.0" dy="25">generic failover</tspan></text><rect x="955" y="230" width="280" height="150" rx="14" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/><text x="1095.0" y="288" font-size="24" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="1095.0" dy="0">4  System ships it</tspan></text><text x="1095.0" y="314" font-size="21" text-anchor="middle" font-weight="normal" fill="#374151" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="1095.0" dy="0">The database ships</tspan><tspan x="1095.0" dy="25">its own failover</tspan></text><rect x="1260" y="140" width="280" height="150" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="1400.0" y="198" font-size="24" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="1400.0" dy="0">5  Needs none</tspan></text><text x="1400.0" y="224" font-size="21" text-anchor="middle" font-weight="normal" fill="#374151" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="1400.0" dy="0">It notices a problem</tspan><tspan x="1400.0" dy="25">and fails over itself</tspan></text><text x="800" y="60" font-size="28" text-anchor="middle" font-weight="bold" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="800" dy="0">Move the intelligence into the system</tspan></text><text x="800" y="690" font-size="22" text-anchor="middle" font-weight="normal" fill="#374151" font-family="Helvetica, Arial, sans-serif" font-style="italic" dominant-baseline="middle"><tspan x="800" dy="0">Why climb: external automation rots when the system changes, and rarely-run automation (failover) is the most fragile</tspan></text></svg>