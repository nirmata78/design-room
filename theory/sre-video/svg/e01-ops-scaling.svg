0.9 564.0,524.3 628.0,518.2 692.0,512.6 756.0,507.3 820.0,502.2 884.0,497.5 948.0,492.9 1012.0,488.5 1076.0,484.3 1140.0,480.3 1204.0,476.4 1268.0,472.5 1332.0,468.9 1396.0,465.3 1460.0,461.8" fill="none" stroke="#15803d" stroke-width="6" stroke-linejoin="round"/><text x="640" y="156" font-size="24" text-anchor="middle" font-weight="bold" fill="#b91c1c" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="640" dy="0">Traditional operations: work grows with load,</tspan><tspan x="640" dy="29">so headcount grows with it</tspan></text><text x="1130" y="551" font-size="24" text-anchor="middle" font-weight="bold" fill="#15803d" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="1130" dy="0">SRE: operations capped, the rest is automation,</tspan><tspan x="1130" dy="29">so headcount grows sublinearly</tspan></text><line x1="1204.0" y1="216.0" x2="1204.0" y2="476.3543851161716" stroke="#b45309" stroke-width="4" stroke-dasharray="10 7"/><text x="1379.0" y="386" font-size="23" text-anchor="middle" font-weight="bold" fill="#b45309" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="1379.0" dy="0">the gap is the budget</tspan><tspan x="1379.0" dy="28">for the whole idea</tspan></text></svg>