<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700"><defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="a-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker><marker id="a-white" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="110" width="460" height="280" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="270.0" y="250" font-size="24" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="270.0" dy="0"></tspan></text><text x="270" y="145" font-size="25" text-anchor="middle" font-weight="bold" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="270" dy="0">Region 1</tspan></text><rect x="80" y="210" width="160" height="120" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="160.0" y="270" font-size="24" text-anchor="middle" font-weight="bold" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="160.0" dy="0">Leader</tspan></text><rect x="270" y="210" width="160" height="120" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="350.0" y="270" font-size="24" text-anchor="middle" font-weight="bold" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="350.0" dy="0">Replica</tspan></text><rect x="570" y="110" width="460" height="280" rx="14" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/><text x="800.0" y="250" font-size="24" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="800.0" dy="0"></tspan></text><text x="800" y="145" font-size="25" text-anchor="middle" font-weight="bold" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="800" dy="0">Region 2  (30 ms away)</tspan></text><rect x="610" y="210" width="160" height="120" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="690.0" y="270" font-size="24" text-anchor="middle" font-weight="bold" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="690.0" dy="0">Replica</tspan></text><rect x="800" y="210" width="160" height="120" rx="14" fill="#ffffff" stroke="#4b5563" stroke-width="3"/><text x="880.0" y="270" font-size="24" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="880.0" dy="0">Replica</tspan></text><rect x="1100" y="110" width="460" height="280" rx="14" fill="#f3f4f6" stroke="#4b5563" stroke-width="3"/><text x="1330.0" y="250" font-size="24" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="1330.0" dy="0"></tspan></text><text x="1330" y="145" font-size="25" text-anchor="middle" font-weight="bold" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="1330" dy="0">Region 3  (80 ms away)</tspan></text><rect x="1140" y="210" width="160" height="120" rx="14" fill="#ffffff" stroke="#4b5563" stroke-width="3"/><text x="1220.0" y="270" font-size="24" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="1220.0" dy="0">Replica</tspan></text><line x1="250" y1="400" x2="640" y2="400" stroke="#15803d" stroke-width="6" marker-end="url(#a-green)"/><text x="450" y="440" font-size="23" text-anchor="middle" font-weight="bold" fill="#15803d" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="450" dy="0">30 ms round trip</tspan></text><line x1="250" y1="520" x2="1180" y2="520" stroke="#4b5563" stroke-width="4" stroke-dasharray="10 7" marker-end="url(#a-grey)"/><text x="720" y="560" font-size="23" text-anchor="middle" font-weight="bold" fill="#4b5563" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="720" dy="0">80 ms: not on the critical path</tspan></text><text x="800" y="50" font-size="28" text-anchor="middle" font-weight="bold" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="800" dy="0">Five replicas, three regions. A commit needs three acknowledgements.</tspan></text><text x="800" y="630" font-size="25" text-anchor="middle" font-weight="bold" fill="#15803d" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="800" dy="0">Commit waits for: leader + local replica + the nearest remote replica  ≈  30 ms + disk write</tspan></text><text x="800" y="675" font-size="21" text-anchor="middle" font-weight="normal" fill="#6b7280" font-family="Helvetica, Arial, sans-serif" font-style="italic" dominant-baseline="middle"><tspan x="800" dy="0">illustrative round-trip times</tspan></text></svg>