<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" width="1600" height="720"><defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="a-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker><marker id="a-white" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="120" y="40" width="300" height="80" rx="14" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/><text x="270.0" y="80" font-size="25" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="270.0" dy="0">Cron leader</tspan></text><rect x="650" y="40" width="320" height="80" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="810.0" y="80" font-size="25" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="810.0" dy="0">Replicated log</tspan></text><rect x="1180" y="40" width="300" height="80" rx="14" fill="#f3f4f6" stroke="#4b5563" stroke-width="3"/><text x="1330.0" y="80" font-size="23" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="1330.0" dy="0">Datacenter scheduler</tspan></text><line x1="270" y1="120" x2="270" y2="690" stroke="#4b5563" stroke-width="3" stroke-dasharray="10 7"/><line x1="810" y1="120" x2="810" y2="690" stroke="#4b5563" stroke-width="3" stroke-dasharray="10 7"/><line x1="1330" y1="120" x2="1330" y2="690" stroke="#4b5563" stroke-width="3" stroke-dasharray="10 7"/><line x1="270" y1="190" x2="810" y2="190" stroke="#15803d" stroke-width="4" marker-end="url(#a-green)"/><text x="540.0" y="165" font-size="22" text-anchor="middle" font-weight="bold" fill="#15803d" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="540.0" dy="0">1  record: about to launch job J</tspan></text><line x1="270" y1="270" x2="1330" y2="270" stroke="#1d4ed8" stroke-width="4" marker-end="url(#a-blue)"/><text x="800.0" y="245" font-size="22" text-anchor="middle" font-weight="bold" fill="#1d4ed8" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="800.0" dy="0">2  launch request</tspan></text><line x1="250" y1="325" x2="290" y2="365" stroke="#b91c1c" stroke-width="7"/><line x1="250" y1="365" x2="290" y2="325" stroke="#b91c1c" stroke-width="7"/><text x="300" y="345" font-size="23" text-anchor="start" font-weight="bold" fill="#b91c1c" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="300" dy="0">leader dies here</tspan></text><rect x="120" y="400" width="300" height="70" rx="14" fill="#fef3c7" stroke="#b45309" stroke-width="3"/><text x="270.0" y="435" font-size="24" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="270.0" dy="0">New leader</tspan></text><line x1="270" y1="500" x2="810" y2="500" stroke="#b45309" stroke-width="4" marker-end="url(#a-amber)"/><text x="640" y="478" font-size="22" text-anchor="middle" font-weight="bold" fill="#b45309" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="640" dy="0">3  read log: started, not finished</tspan></text><rect x="430" y="560" width="950" height="120" rx="14" fill="#fef3c7" stroke="#b45309" stroke-width="3" stroke-dasharray="10 6"/><text x="905.0" y="620" font-size="24" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="905.0" dy="0"></tspan></text><text x="905" y="590" font-size="23" text-anchor="middle" font-weight="bold" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="905" dy="0">Idempotent steps: repeat.   State can be looked up: check, then act.</tspan></text><text x="905" y="635" font-size="23" text-anchor="middle" font-weight="bold" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="905" dy="0">Neither: the owner chose in advance, skip or launch again.</tspan></text><text x="1350" y="317" font-size="22" text-anchor="start" font-weight="bold" fill="#15803d" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="1350" dy="0">if no crash:</tspan><tspan x="1350" dy="26">4  record: finished</tspan></text></svg>