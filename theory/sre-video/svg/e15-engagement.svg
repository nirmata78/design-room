"><tspan x="280.0" dy="0">Several SREs, weeks to months, per service</tspan></text><rect x="40" y="350" width="480" height="70" rx="14" fill="#ffffff" stroke="#4b5563" stroke-width="3"/><text x="280.0" y="385" font-size="24" text-anchor="middle" font-weight="bold" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="280.0" dy="0">Low reach</tspan></text><rect x="40" y="440" width="480" height="90" rx="14" fill="#ffffff" stroke="#4b5563" stroke-width="3"/><text x="280.0" y="485" font-size="22" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="280.0" dy="0">Weakness: Finds design flaws late</tspan></text><rect x="560" y="60" width="480" height="90" rx="14" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/><text x="800.0" y="105" font-size="27" text-anchor="middle" font-weight="bold" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="800.0" dy="0">Early engagement</tspan></text><text x="800" y="195" font-size="24" text-anchor="middle" font-weight="bold" fill="#1d4ed8" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="800" dy="0">engages: from design</tspan></text><rect x="560" y="240" width="480" height="90" rx="14" fill="#ffffff" stroke="#4b5563" stroke-width="3"/><text x="800.0" y="285" font-size="22" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="800.0" dy="0">Fewer people, earlier</tspan></text><rect x="560" y="350" width="480" height="70" rx="14" fill="#ffffff" stroke="#4b5563" stroke-width="3"/><text x="800.0" y="385" font-size="24" text-anchor="middle" font-weight="bold" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="800.0" dy="0">Medium reach</tspan></text><rect x="560" y="440" width="480" height="90" rx="14" fill="#ffffff" stroke="#4b5563" stroke-width="3"/><text x="800.0" y="485" font-size="22" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="800.0" dy="0">Weakness: Needs capacity at design time</tspan></text><rect x="1080" y="60" width="480" height="90" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="1320.0" y="105" font-size="27" text-anchor="middle" font-weight="bold" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="1320.0" dy="0">Frameworks and platform</tspan></text><text x="1320" y="195" font-size="24" text-anchor="middle" font-weight="bold" fill="#15803d" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="1320" dy="0">engages: by construction</tspan></text><rect x="1080" y="240" width="480" height="90" rx="14" fill="#ffffff" stroke="#4b5563" stroke-width="3"/><text x="1320.0" y="285" font-size="22" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="1320.0" dy="0">Low cost per service after the upfront build</tspan></text><rect x="1080" y="350" width="480" height="70" rx="14" fill="#ffffff" stroke="#4b5563" stroke-width="3"/><text x="1320.0" y="385" font-size="24" text-anchor="middle" font-weight="bold" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="1320.0" dy="0">High reach</tspan></text><rect x="1080" y="440" width="480" height="90" rx="14" fill="#ffffff" stroke="#4b5563" stroke-width="3"/><text x="1320.0" y="485" font-size="22" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="1320.0" dy="0">Weakness: Teams must adopt it</tspan></text></svg>