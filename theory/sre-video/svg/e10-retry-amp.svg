span x="590.0" dy="0">Front end</tspan></text><text x="590.0" y="320" font-size="25" text-anchor="middle" font-weight="normal" fill="#374151" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="590.0" dy="0">attempts seen: 3</tspan></text><line x1="295" y1="295.0" x2="465" y2="295.0" stroke="#b91c1c" stroke-width="4" marker-end="url(#a-red)"/><text x="380.0" y="273" font-size="24" text-anchor="middle" font-weight="bold" fill="#b91c1c" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="380.0" dy="0">3 tries</tspan></text><rect x="885" y="230" width="250" height="130" rx="14" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/><text x="1010.0" y="275" font-size="28" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="1010.0" dy="0">Service</tspan></text><text x="1010.0" y="320" font-size="25" text-anchor="middle" font-weight="normal" fill="#374151" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="1010.0" dy="0">attempts seen: 9</tspan></text><line x1="715" y1="295.0" x2="885" y2="295.0" stroke="#b91c1c" stroke-width="4" marker-end="url(#a-red)"/><text x="800.0" y="273" font-size="24" text-anchor="middle" font-weight="bold" fill="#b91c1c" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="800.0" dy="0">3 tries</tspan></text><rect x="1305" y="230" width="250" height="130" rx="14" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/><text x="1430.0" y="275" font-size="28" text-anchor="middle" font-weight="normal" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="1430.0" dy="0">Database</tspan></text><text x="1430.0" y="320" font-size="25" text-anchor="middle" font-weight="normal" fill="#374151" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="1430.0" dy="0">attempts seen: 27</tspan></text><line x1="1135" y1="295.0" x2="1305" y2="295.0" stroke="#b91c1c" stroke-width="4" marker-end="url(#a-red)"/><text x="1220.0" y="273" font-size="24" text-anchor="middle" font-weight="bold" fill="#b91c1c" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="1220.0" dy="0">3 tries</tspan></text><text x="800" y="90" font-size="28" text-anchor="middle" font-weight="bold" fill="#111827" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="800" dy="0">Three layers, each trying up to three times</tspan></text><text x="800" y="454" font-size="27" text-anchor="middle" font-weight="bold" fill="#b91c1c" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="800" dy="0">3 × 3 × 3 = 27 requests reach the database for one user action,</tspan><tspan x="800" dy="32">at the moment it needs relief</tspan></text><text x="800" y="580" font-size="23" text-anchor="middle" font-weight="bold" fill="#15803d" font-family="Helvetica, Arial, sans-serif" dominant-baseline="middle"><tspan x="800" dy="0">With a retry budget of 10 percent, the worst-case growth falls from nearly 3x to about 1.1x</tspan></text></svg>