<svg class="d" viewBox="0 0 720 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Conventions
       viewBox width is always 720 (= full text width); pick the height you need.
       Box fills:  .b grey  .w white  .r red  .bl blue  .g green  .a amber  .g2 dark grey
       Text:       default 11.5px · .tb bold · .ts small 10.2px · .tm mono · .lab small caps label · .c centred
                   colours .tr red · .tg green · .sp blue
       Lines:      .ln grey arrow · .ln-r red arrow · .ln-g green arrow · add .dash for async/optional
                   .lane light divider · .life dashed lifeline (sequence diagrams)
       Arrowheads come from the <marker> defs at the top of the HTML (ids ah, ahr, ahg).
       Width budget: ~6.2 px per character at 11.5px, ~5.4 px at .ts, ~5.8 px for .tm. -->
  <text x="6" y="12" class="lab">EXAMPLE · BOXES, ARROWS AND A TINY SEQUENCE</text>

  <rect x="6" y="26" width="120" height="54" rx="5" class="b"/>
  <text x="66" y="48" class="c tb">Client</text><text x="66" y="64" class="c ts">sends a request</text>
  <rect x="166" y="26" width="140" height="54" rx="5" class="r"/>
  <text x="236" y="48" class="c tb">Service</text><text x="236" y="64" class="c ts">stateless, scaled out</text>
  <rect x="346" y="26" width="140" height="54" rx="5" class="g"/>
  <text x="416" y="48" class="c tb">Database</text><text x="416" y="64" class="c ts">source of truth</text>
  <rect x="526" y="26" width="188" height="54" rx="5" class="a"/>
  <text x="620" y="48" class="c tb">Queue</text><text x="620" y="64" class="c ts">async, may lag</text>
  <line x1="126" y1="53" x2="165" y2="53" class="ln"/>
  <line x1="306" y1="53" x2="345" y2="53" class="ln-g"/>
  <path d="M236,80 L236,92 L620,92 L620,81" class="ln dash"/>

  <rect x="6" y="110" width="80" height="24" rx="5" class="b"/><text x="46" y="126" class="c tb">A</text>
  <rect x="300" y="110" width="80" height="24" rx="5" class="bl"/><text x="340" y="126" class="c tb">B</text>
  <line x1="46" y1="134" x2="46" y2="196" class="life"/><line x1="340" y1="134" x2="340" y2="196" class="life"/>
  <line x1="46" y1="156" x2="339" y2="156" class="ln"/><text x="54" y="151" class="ts">① request</text>
  <line x1="340" y1="180" x2="47" y2="180" class="ln-r"/><text x="54" y="175" class="ts tr tb">② reply</text>
  <text x="420" y="150" class="ts">Sequence diagrams: header boxes, dashed lifelines,</text>
  <text x="420" y="164" class="ts">numbered messages; label above each arrow.</text>
  <text x="420" y="184" class="tm">mono text for keys, commands, IDs</text>
</svg>
