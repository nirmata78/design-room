<svg class="d" viewBox="0 0 720 262" xmlns="http://www.w3.org/2000/svg">
  <rect x="40" y="6" width="110" height="28" rx="5" class="b"/><text x="95" y="25" class="c tb">Client 1</text>
  <rect x="230" y="6" width="130" height="28" rx="5" class="r"/><text x="295" y="25" class="c tb">Redis (lock)</text>
  <rect x="420" y="6" width="110" height="28" rx="5" class="b"/><text x="475" y="25" class="c tb">Client 2</text>
  <rect x="590" y="6" width="124" height="28" rx="5" class="g"/><text x="652" y="25" class="c tb">Storage (DB)</text>
  <line x1="95" y1="34" x2="95" y2="256" class="life"/>
  <line x1="295" y1="34" x2="295" y2="256" class="life"/>
  <line x1="475" y1="34" x2="475" y2="256" class="life"/>
  <line x1="652" y1="34" x2="652" y2="256" class="life"/>

  <line x1="95" y1="56" x2="294" y2="56" class="ln"/><text x="104" y="51" class="ts">acquire: SET lock NX PX 10000 + INCR fence</text>
  <line x1="295" y1="76" x2="96" y2="76" class="ln-g"/><text x="104" y="71" class="ts tg">OK, fencing token 33</text>

  <rect x="85" y="88" width="20" height="96" rx="3" class="a"/>
  <text x="112" y="122" class="ts tb">GC pause /</text><text x="112" y="135" class="ts tb">network stall</text>
  <text x="304" y="108" class="ts tr">lease expires (10 s)</text>

  <line x1="475" y1="128" x2="296" y2="128" class="ln"/><text x="306" y="123" class="ts">acquire</text>
  <line x1="295" y1="148" x2="474" y2="148" class="ln-g"/><text x="306" y="143" class="ts tg">OK, token 34</text>
  <line x1="475" y1="172" x2="651" y2="172" class="ln"/><text x="484" y="167" class="ts">write, token 34</text>
  <text x="644" y="187" class="ts tg" text-anchor="end">accepted; max token = 34</text>

  <line x1="95" y1="210" x2="651" y2="210" class="ln"/><text x="104" y="205" class="ts">Client 1 wakes up, still believes it holds the lock: write, token 33</text>
  <text x="644" y="225" class="ts tr tb" text-anchor="end">rejected: 33 &lt; 34</text>
  <text x="104" y="246" class="ts">Without the token check in storage, both writes land. The lock alone could not prevent it.</text>
</svg>
