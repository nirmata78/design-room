<svg class="d" viewBox="0 0 720 248" xmlns="http://www.w3.org/2000/svg">
  <text x="6" y="14" class="lab">10k CONNECTIONS</text>
  <rect x="6" y="24" width="86" height="22" rx="4" class="b"/><text x="49" y="39" class="c ts">client 1</text>
  <rect x="6" y="52" width="86" height="22" rx="4" class="b"/><text x="49" y="67" class="c ts">client 2</text>
  <rect x="6" y="80" width="86" height="22" rx="4" class="b"/><text x="49" y="95" class="c ts">…</text>
  <rect x="6" y="108" width="86" height="22" rx="4" class="b"/><text x="49" y="123" class="c ts">client N</text>
  <line x1="92" y1="35" x2="119" y2="70" class="ln"/>
  <line x1="92" y1="63" x2="119" y2="80" class="ln"/>
  <line x1="92" y1="119" x2="119" y2="100" class="ln"/>

  <rect x="120" y="24" width="112" height="126" rx="5" class="b"/>
  <text x="176" y="46" class="c tb">epoll / kqueue</text>
  <text x="176" y="62" class="c ts">event loop (ae)</text>
  <text x="176" y="90" class="c ts">readable → read</text>
  <text x="176" y="105" class="c ts">+ parse command</text>
  <text x="176" y="128" class="c ts">writable → send</text>
  <text x="176" y="143" class="c ts">queued replies</text>

  <rect x="258" y="8" width="250" height="44" rx="5" class="bl"/>
  <text x="383" y="26" class="c tb">I/O threads (optional, io-threads)</text>
  <text x="383" y="42" class="c ts">parse requests · write replies — never execute</text>

  <rect x="258" y="66" width="250" height="84" rx="5" class="r"/>
  <text x="383" y="84" class="c tb">Main thread: one command at a time</text>
  <rect x="268" y="96" width="40" height="22" rx="3" class="w"/><text x="288" y="111" class="c tm">ZADD</text>
  <rect x="312" y="96" width="38" height="22" rx="3" class="w"/><text x="331" y="111" class="c tm">INCR</text>
  <rect x="354" y="96" width="98" height="22" rx="3" class="w"/><text x="403" y="111" class="c tm">EVAL advance</text>
  <rect x="456" y="96" width="42" height="22" rx="3" class="w"/><text x="477" y="111" class="c tm">ZRANK</text>
  <text x="383" y="139" class="c ts">each runs to completion: no locks, no interleaving</text>

  <line x1="232" y1="108" x2="257" y2="108" class="ln"/>
  <line x1="320" y1="52" x2="320" y2="65" class="ln dash"/>

  <rect x="534" y="66" width="180" height="84" rx="5" class="b"/>
  <text x="624" y="86" class="c tb">In-memory dataset</text>
  <text x="624" y="104" class="c ts">dict: key → typed object</text>
  <text x="624" y="120" class="c ts">expires: key → unix ms</text>
  <text x="624" y="136" class="c ts">~50–100 B overhead / key</text>
  <line x1="508" y1="108" x2="533" y2="108" class="ln"/>

  <rect x="120" y="186" width="190" height="56" rx="5" class="b"/>
  <text x="215" y="206" class="c tb">Background (bio) threads</text>
  <text x="215" y="222" class="c ts">AOF fsync · lazy free (UNLINK)</text>
  <text x="215" y="236" class="c ts">close() of old files</text>

  <rect x="330" y="186" width="190" height="56" rx="5" class="a"/>
  <text x="425" y="206" class="c tb">fork() child process</text>
  <text x="425" y="222" class="c ts">RDB snapshot · AOF rewrite</text>
  <text x="425" y="236" class="c ts">copy-on-write memory pages</text>

  <rect x="540" y="186" width="174" height="56" rx="5" class="bl"/>
  <text x="627" y="206" class="c tb">Replicas</text>
  <text x="627" y="222" class="c ts">async stream of the writes</text>
  <text x="627" y="236" class="c ts">ack to client comes first</text>

  <path d="M300,150 L300,168 L215,168 L215,185" class="ln dash"/>
  <line x1="400" y1="150" x2="425" y2="185" class="ln dash"/>
  <path d="M480,150 L480,168 L627,168 L627,185" class="ln dash"/>
</svg>
