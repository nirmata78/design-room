<svg class="d" viewBox="0 0 720 132" xmlns="http://www.w3.org/2000/svg">
  <rect x="6" y="46" width="104" height="40" rx="5" class="g"/><text x="58" y="63" class="c tb">Writer</text><text x="58" y="77" class="c ts">W = 2 acks</text>
  <rect x="200" y="6" width="124" height="32" rx="5" class="b"/><text x="262" y="26" class="c tb">Replica 1 · v2</text>
  <rect x="200" y="50" width="124" height="32" rx="5" class="r" style="stroke-width:2"/><text x="262" y="70" class="c tb">Replica 2 · v2</text>
  <rect x="200" y="94" width="124" height="32" rx="5" class="b"/><text x="262" y="114" class="c tb">Replica 3 · v1</text>
  <rect x="414" y="46" width="104" height="40" rx="5" class="bl"/><text x="466" y="63" class="c tb">Reader</text><text x="466" y="77" class="c ts">R = 2 replies</text>
  <line x1="110" y1="58" x2="199" y2="24" class="ln-g"/><line x1="110" y1="66" x2="199" y2="66" class="ln-g"/>
  <line x1="324" y1="66" x2="413" y2="66" class="ln"/><line x1="324" y1="108" x2="413" y2="76" class="ln"/>
  <text x="330" y="58" class="ts tr tb">overlap</text>
  <text x="540" y="30" class="tb">N = 3, W = 2, R = 2</text>
  <text x="540" y="48" class="ts">R + W &gt; N, so every read set</text>
  <text x="540" y="62" class="ts">shares a replica with the last</text>
  <text x="540" y="76" class="ts">write set: the newest version</text>
  <text x="540" y="90" class="ts">is always among the replies.</text>
  <text x="540" y="112" class="ts">R = 1: faster, may read v1.</text>
</svg>
