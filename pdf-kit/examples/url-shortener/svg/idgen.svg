<svg class="d" viewBox="0 0 720 254" xmlns="http://www.w3.org/2000/svg">
  <text x="6" y="10" class="lab">① RANGE LEASING: UNIQUE WITHOUT A HOT COUNTER</text>
  <rect x="6" y="20" width="150" height="84" rx="5" class="bl"/>
  <text x="81" y="40" class="c tb">ID allocator</text>
  <text x="81" y="55" class="c ts">etcd / ZooKeeper /</text>
  <text x="81" y="68" class="c ts">one counter row</text>
  <text x="16" y="88" class="tm">next_block = 41,872</text>

  <rect x="206" y="18" width="252" height="26" rx="4" class="g"/>
  <text x="214" y="35" class="tm">svc A · block 41,870 · 4,187,000,000+</text>
  <rect x="206" y="50" width="252" height="26" rx="4" class="g"/>
  <text x="214" y="67" class="tm">svc B · block 41,871 · 4,187,100,000+</text>
  <rect x="206" y="82" width="252" height="26" rx="4" class="b" style="opacity:.65"/>
  <text x="214" y="99" class="tm">svc C ✕ crashed: rest of 41,869 unused</text>
  <line x1="156" y1="44" x2="205" y2="31" class="ln"/><line x1="156" y1="62" x2="205" y2="63" class="ln"/><line x1="156" y1="82" x2="205" y2="95" class="ln dash"/>

  <rect x="476" y="18" width="238" height="90" rx="5" class="w"/>
  <text x="486" y="36" class="ts">• 1 atomic increment = 100,000 IDs</text>
  <text x="486" y="52" class="ts">• ~350 IDs/s per instance at peak</text>
  <text x="486" y="68" class="ts">   → a new lease every ~5 minutes</text>
  <text x="486" y="84" class="ts">• allocator down → keep using the held block</text>
  <text x="486" y="100" class="ts">• lost IDs on crash: irrelevant vs 3.5 T</text>

  <text x="6" y="132" class="lab">② TURN A SEQUENTIAL ID INTO A NON-GUESSABLE 7-CHAR CODE</text>
  <rect x="6" y="142" width="112" height="50" rx="5" class="g"/>
  <text x="62" y="161" class="c ts">ID from block</text><text x="62" y="179" class="c tm tb">4,187,000,123</text>
  <rect x="140" y="142" width="148" height="50" rx="5" class="bl"/>
  <text x="214" y="161" class="c tb">Feistel permute</text><text x="214" y="177" class="c ts">42 bits, 4 rounds, secret keys</text>
  <rect x="310" y="142" width="144" height="50" rx="5" class="a"/>
  <text x="382" y="161" class="c tb">Cycle walk</text><text x="382" y="177" class="c ts">≥ 62⁷ ? permute again</text>
  <rect x="476" y="142" width="116" height="50" rx="5" class="bl"/>
  <text x="534" y="161" class="c tb">Base62 encode</text><text x="534" y="177" class="c ts">exactly 7 chars</text>
  <rect x="614" y="142" width="100" height="50" rx="5" class="r"/>
  <text x="664" y="161" class="c ts">short code</text><text x="664" y="179" class="c tm tb">fN7J2J9</text>
  <line x1="118" y1="167" x2="139" y2="167" class="ln"/><line x1="288" y1="167" x2="309" y2="167" class="ln"/>
  <line x1="454" y1="167" x2="475" y2="167" class="ln"/><line x1="592" y1="167" x2="613" y2="167" class="ln"/>
  <path d="M382,192 L382,204 L330,204 L330,193" class="ln dash"/><text x="388" y="206" class="ts">avg 1.25 passes (62⁷ / 2⁴² = 0.80)</text>

  <rect x="6" y="214" width="708" height="36" rx="4" class="w"/>
  <text x="14" y="229" class="ts"><tspan class="tb">Neighbouring IDs land far apart:</tspan>  <tspan class="tm">…123 → fN7J2J9    …124 → uDKm74R    …125 → yzozrAp</tspan></text>
  <text x="14" y="244" class="ts">Plain base62 would give 04zme03, 04zme04, 04zme05: anyone could step through other people's links.</text>
</svg>
