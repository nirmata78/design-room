<svg class="d" viewBox="0 0 720 176" xmlns="http://www.w3.org/2000/svg">
  <text x="6" y="12" class="lab tr">WRONG: FALL BACK ON "NO RECEIPT YET"</text>
  <rect x="6" y="20" width="120" height="40" rx="5" class="bl"/><text x="66" y="44" class="c ts tb">push SENT</text>
  <rect x="160" y="20" width="150" height="40" rx="5" class="a"/><text x="235" y="37" class="c ts tb">no receipt after 30 s</text><text x="235" y="51" class="c ts">(receipts are weak)</text>
  <rect x="344" y="20" width="130" height="40" rx="5" class="b"/><text x="409" y="44" class="c ts tb">send email too</text>
  <rect x="508" y="20" width="206" height="40" rx="5" class="r"/><text x="611" y="37" class="c ts tb">push arrives anyway</text><text x="611" y="51" class="c ts tr">user gets both ✕</text>
  <line x1="126" y1="40" x2="159" y2="40" class="ln"/><line x1="310" y1="40" x2="343" y2="40" class="ln"/><line x1="474" y1="40" x2="507" y2="40" class="ln-r"/>

  <text x="6" y="88" class="lab tg">RIGHT: FALL BACK ONLY ON A DEFINITE FAILURE</text>
  <rect x="6" y="96" width="120" height="40" rx="5" class="bl"/><text x="66" y="120" class="c ts tb">push attempt</text>
  <rect x="160" y="96" width="150" height="40" rx="5" class="r"/><text x="235" y="113" class="c ts tb">410 Unregistered /</text><text x="235" y="127" class="c ts">no app · provider 4xx</text>
  <rect x="344" y="96" width="130" height="40" rx="5" class="g"/><text x="409" y="113" class="c ts tb">email, same</text><text x="409" y="127" class="c ts">dedupKey</text>
  <rect x="508" y="96" width="206" height="40" rx="5" class="g"/><text x="611" y="113" class="c ts tb">one message delivered</text><text x="611" y="127" class="c ts tg">token removed from registry ✓</text>
  <line x1="126" y1="116" x2="159" y2="116" class="ln"/><line x1="310" y1="116" x2="343" y2="116" class="ln-g"/><line x1="474" y1="116" x2="507" y2="116" class="ln-g"/>
  <text x="6" y="160" class="ts">Exception, chosen explicitly by the product owner: fraud alerts and OTPs may go to two channels <tspan class="tb">at once</tspan>, because missing</text>
  <text x="6" y="173" class="ts">them is worse than a duplicate. That's a send-both decision made up front, not a fallback guessed afterwards.</text>
</svg>
