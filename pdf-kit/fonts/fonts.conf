<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- fontconfig for rsvg-convert / pango: the bundled Google Fonts first, then the system defaults.
     Use: FONTCONFIG_FILE=pdf-kit/fonts/fonts.conf rsvg-convert … -->
<fontconfig>
  <include ignore_missing="yes">/opt/homebrew/etc/fonts/fonts.conf</include>
  <dir prefix="relative">google</dir>
  <dir prefix="relative">.</dir>
</fontconfig>
